baseURL: "https://jasper-aa64.github.io/"
languageCode: "en-us"
title: "Jasper's Technical Notebook"
defaultContentLanguage: "en"
enableRobotsTXT: true
publishDir: "docs"
cleanDestinationDir: true

pagination:
  pagerSize: 8

permalinks:
  posts: "/posts/:slug/"

taxonomies:
  tag: "tags"
  category: "categories"

menu:
  main:
    - name: "Home"
      url: "/"
      weight: 10
    - name: "Posts"
      url: "/posts/"
      weight: 20
    - name: "Archives"
      url: "/archives/"
      weight: 30
    - name: "Categories"
      url: "/categories/"
      weight: 40
    - name: "Tags"
      url: "/tags/"
      weight: 50
    - name: "About"
      url: "/about/"
      weight: 60

params:
  author: "Jasper32"
  tagline: "Algorithms, C++ performance, and AI-assisted engineering"
  description: "A technical notebook for AI-native development, high-performance and low-latency systems, software engineering, and agent evaluation, testing, and trustworthiness."
  heroDirections:
    - "AI-native development"
    - "high-performance, low-latency systems"
    - "software engineering"
    - "agent evaluation, testing, and trustworthiness"
  github: "https://github.com/Jasper-aa64"

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]
          inline:
            - ["$", "$"]
            - ["\\(", "\\)"]
  highlight:
    style: "dracula"
    lineNos: false
    noClasses: true
  tableOfContents:
    startLevel: 1
    endLevel: 2
    ordered: false
