baseURL: "https://jasper-aa64.github.io/"
languageCode: "en-us"
title: "Jasper"
defaultContentLanguage: "en"
enableRobotsTXT: true
hasCJKLanguage: true
publishDir: "docs"
cleanDestinationDir: true

pagination:
  pagerSize: 8

permalinks:
  posts: "/posts/:slug/"

taxonomies:
  tag: "tags"
  category: "categories"

defaultContentLanguageInSubdir: false

params:
  author: "Jasper32"
  github: "https://github.com/Jasper-aa64"

languages:
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 1
    title: "Jasper"
    menus:
      main:
        - { name: "Home", url: "/", weight: 10 }
        - { name: "Blog", url: "/posts/", weight: 20 }
        - { name: "Categories", url: "/categories/", weight: 30 }
        - { name: "About", url: "/about/", weight: 40 }
    params:
      description: "Jasper's personal site: C++ that has to be fast, low-latency systems, competitive programming, and how to tell whether an AI-written speedup is real."
  zh:
    languageName: "中文"
    languageCode: "zh-CN"
    weight: 2
    title: "Jasper"
    menus:
      main:
        - { name: "首页", url: "/zh/", weight: 10 }
        - { name: "博客", url: "/zh/posts/", weight: 20 }
        - { name: "分类", url: "/zh/categories/", weight: 30 }
        - { name: "关于", url: "/zh/about/", weight: 40 }
    params:
      description: "Jasper 的个人主页:要跑得快的 C++、低延迟系统、算法竞赛,以及怎么判断 AI 写出来的加速是不是真的。"

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]
          inline:
            - ["$", "$"]
            - ["\\(", "\\)"]
  highlight:
    lineNos: false
    noClasses: false
  tableOfContents:
    startLevel: 1
    endLevel: 3
    ordered: false
