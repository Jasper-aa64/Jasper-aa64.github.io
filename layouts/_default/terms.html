{{ define "main" }}
  <section class="page-heading">
    <span class="eyebrow">{{ i18n "taxonomy" }}</span>
    <h1>{{ .Title }}</h1>
    <p>{{ i18n "taxonomyBlurb" }}</p>
  </section>

  <section class="content-panel">
    <div class="term-grid">
      {{ range .Data.Terms.Alphabetical }}
        <a class="term-card" href="{{ .Page.RelPermalink }}">
          <strong>{{ .Page.Title }}</strong>
          <span>{{ i18n "postCount" .Count }}</span>
        </a>
      {{ end }}
    </div>
  </section>
{{ end }}
