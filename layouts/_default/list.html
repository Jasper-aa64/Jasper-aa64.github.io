{{ define "main" }}
  <section class="page-heading">
    <span class="eyebrow">{{ .Kind | humanize }}</span>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </section>

  <section class="content-panel">
    <div class="post-list">
      {{ range .Pages }}
        {{ partial "post-card.html" . }}
      {{ end }}
    </div>
  </section>
{{ end }}
