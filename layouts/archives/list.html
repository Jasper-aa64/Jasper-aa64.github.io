{{ define "main" }}
  <section class="page-heading">
    <span class="eyebrow">{{ i18n "timeline" }}</span>
    <h1>{{ .Title }}</h1>
    <p>{{ i18n "timelineBlurb" }}</p>
  </section>

  <section class="content-panel">
    <div class="archive-list">
      {{ $all := partial "posts-all.html" . }}
      {{ range (sort $all "Date" "desc").GroupByDate "2006" }}
        <section class="archive-year">
          <h2>{{ .Key }}</h2>
          <div class="archive-items">
            {{ range .Pages }}
              <a class="archive-item" href="{{ .RelPermalink }}">
                <time>{{ .Date.Format (i18n "dateArchive") }}</time>
                <span>{{ .Title }}</span>
              </a>
            {{ end }}
          </div>
        </section>
      {{ end }}
    </div>
  </section>
{{ end }}
