{{ define "main" }}
<section class="page-head wrap">
  <h1 class="page-head__title reveal">{{ .Title }}</h1>
  <p class="page-head__lede reveal">{{ i18n "archiveLede" }}</p>
</section>
<section class="wrap page-body">
  {{ $all := partial "posts-all.html" . }}
  {{ range (sort $all "Date" "desc").GroupByDate "2006" }}
    <section class="year-group">
      <h2 class="year-group__year">{{ .Key }}</h2>
      <ol class="entry-list">{{ range .Pages }}{{ partial "entry-row.html" (dict "page" .) }}{{ end }}</ol>
    </section>
  {{ end }}
</section>
{{ end }}
