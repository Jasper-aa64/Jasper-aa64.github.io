<!doctype html>
<html lang="%%lang%%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%title%%</title>
<link rel="icon" href="/images/logo.svg?v=20261008-rounded-brain-1">
<style>
%%UICSS%%
.eqs { font: 14px Consolas, Menlo, monospace; color: var(--muted); }
table { border-collapse: separate; border-spacing: 5px; margin: 0 auto; }
th { font: 600 13px Consolas, Menlo, monospace; color: var(--muted); padding: 0 4px 2px; }
th.col { color: var(--hl); }
th.free { text-decoration: line-through; }
th small { display: block; font-weight: 400; font-size: 11px; text-decoration: none; }
td { box-sizing: border-box; min-width: 60px; height: 38px; text-align: center; font: 15.5px Consolas, Menlo, monospace; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 0 8px; transition: background .25s, border-color .25s; }
td.rl { border: 0; background: none; color: var(--muted); font-size: 13px; min-width: 0; text-align: right; padding-right: 4px; white-space: nowrap; }
@media (max-width: 560px) { table { border-spacing: 3px; } td { min-width: 44px; height: 34px; padding: 0 3px; font-size: 13.5px; } td.rl { font-size: 12px; } }
td.bar { border: 0; background: none; min-width: 0; width: 2px; padding: 0; border-left: 2px solid var(--line); border-radius: 0; }
td.col { background: var(--hlbg); border-color: var(--hl); }
td.cand { box-shadow: 0 0 0 2px var(--x) inset; }
td.piv { background: var(--pivbg); border-color: var(--piv); color: var(--piv); font-weight: 800; }
td.chg { background: var(--okbg); border-color: var(--ok); }
td.src { border-color: var(--piv); border-style: dashed; }
td.bad { background: var(--badbg); border-color: var(--bad); color: var(--bad); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div><div class="seg" id="tabs" role="tablist"></div></div>
  <div class="eqs" id="eqs"></div>
  <div class="stage"><table id="tb"></table></div>
  <div class="panel" id="panel"><div class="ph"><span class="badge" id="badge"></span><span id="head"></span></div><p class="t" id="txt"></p></div>
  %%CONTROLS%%
  %%LEGEND%%
</div>
<script>
(function () {
  var L = %%JSON%%, UI = { play: L.play, pause: L.pause };
%%UIJS%%
  function fmt(s, o) { return s.replace(/\{(\w+)\}/g, function (_, k) { return o[k]; }); }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
  function F(n, d) { d = d || 1; if (d < 0) { n = -n; d = -d; } var g = gcd(n, d); return [n / g, d / g]; }
  function sub(a, b) { return F(a[0] * b[1] - b[0] * a[1], a[1] * b[1]); }
  function mul(a, b) { return F(a[0] * b[0], a[1] * b[1]); }
  function div(a, b) { return F(a[0] * b[1], a[1] * b[0]); }
  function abs(a) { return Math.abs(a[0] / a[1]); }
  function str(a) { return a[1] === 1 ? String(a[0]) : a[0] + '/' + a[1]; }
  function zero(a) { return a[0] === 0; }

  var PRESETS = [
    { name: L.p1, m: [[2, -1, 1, 1], [4, 1, -1, 5], [1, 1, 1, 0]] },
    { name: L.p2, m: [[1, 2, 1, 4], [2, 4, 3, 9], [1, 2, 2, 5]] },
    { name: L.p3, m: [[1, 2, 1, 4], [2, 4, 3, 9], [1, 2, 2, 6]] }
  ];
  var N = 3, M = 3, steps = [], k = 0, timer = null, cur = 0;

  function build(pm) {
    var a = pm.map(function (row) { return row.map(function (v) { return F(v); }); });
    var where = [-1, -1, -1], free = [], r = 0, i, c;
    steps = [];
    function push(o) { o.a = a.map(function (row) { return row.slice(); }); o.where = where.slice(); o.free = free.slice(); o.r = r; steps.push(o); }
    push({ col: -1, head: L.h0, msg: L.start, cls: '' });
    for (c = 0; c < M; c++) {
      var p = -1;
      for (i = r; i < N; i++) if (!zero(a[i][c]) && (p < 0 || abs(a[i][c]) > abs(a[p][c]))) p = i;
      if (p < 0) {
        free.push(c);
        push({ col: c, head: fmt(L.hcol, { c: c + 1 }), msg: fmt(L.nofree, { c: c + 1, r: r + 1 }), cls: '' });
        continue;
      }
      push({ col: c, cand: p, head: fmt(L.hcol, { c: c + 1 }), msg: fmt(L.pick, { c: c + 1, r: r + 1, p: p + 1, v: str(a[p][c]) }), cls: '' });
      if (p !== r) {
        var t = a[p]; a[p] = a[r]; a[r] = t;
        push({ col: c, piv: [r, c], chg: [r, p], head: fmt(L.hcol, { c: c + 1 }), msg: fmt(L.swap, { p: p + 1, r: r + 1 }), cls: '' });
      }
      var pv = a[r][c];
      if (!(pv[0] === 1 && pv[1] === 1)) {
        a[r] = a[r].map(function (x) { return div(x, pv); });
        push({ col: c, piv: [r, c], chg: [r], head: fmt(L.hcol, { c: c + 1 }), msg: fmt(L.norm, { r: r + 1, v: str(pv) }), cls: '' });
      }
      for (i = 0; i < N; i++) {
        if (i === r || zero(a[i][c])) continue;
        var f = a[i][c];
        a[i] = a[i].map(function (x, j) { return sub(x, mul(f, a[r][j])); });
        push({ col: c, piv: [r, c], chg: [i], src: r, head: fmt(L.hcol, { c: c + 1 }), msg: fmt(L.elim, { i: i + 1, r: r + 1, f: str(f), c: c + 1 }), cls: '' });
      }
      where[c] = r; r++;
    }
    var badRow = -1;
    for (i = r; i < N; i++) if (!zero(a[i][M])) { badRow = i; break; }
    if (badRow >= 0) push({ col: -1, bad: badRow, head: L.hend, msg: fmt(L.none, { i: badRow + 1, v: str(a[badRow][M]) }) + (free.length ? ' ' + L.noneFree : ''), cls: 'bad' });
    else if (free.length) {
      var parts = [];
      for (c = 0; c < M; c++) if (where[c] >= 0) {
        var s = 'x' + (c + 1) + ' = ' + str(a[where[c]][M]);
        free.forEach(function (fc) { var co = a[where[c]][fc]; if (!zero(co)) s += ' − (' + str(co) + ')·x' + (fc + 1); });
        parts.push(s);
      }
      push({ col: -1, head: L.hend, msg: fmt(L.many, { f: free.map(function (x) { return 'x' + (x + 1); }).join(', '), s: parts.join(L.sep) }), cls: 'ok' });
    } else {
      push({ col: -1, head: L.hend, msg: fmt(L.one, { s: [0, 1, 2].map(function (c) { return 'x' + (c + 1) + ' = ' + str(a[where[c]][M]); }).join(L.sep) }), cls: 'ok' });
    }
  }

  var tb = document.getElementById('tb'), panel = document.getElementById('panel'), eqs = document.getElementById('eqs');
  function render(quiet) {
    var s = steps[k], html = '<tr><th></th>', c, i;
    for (c = 0; c < M; c++) {
      var isFree = s.free.indexOf(c) >= 0;
      html += '<th class="' + (c === s.col ? 'col' : '') + (isFree ? ' free' : '') + '">x' + (c + 1) + '</th>';
    }
    html += '<th></th><th>b</th></tr>';
    for (i = 0; i < N; i++) {
      html += '<tr><td class="rl">' + fmt(L.row, { i: i + 1 }) + '</td>';
      for (c = 0; c <= M; c++) {
        if (c === M) html += '<td class="bar"></td>';
        var cls = [];
        if (c === s.col && i >= s.r) cls.push('col');
        if (s.cand === i && c === s.col) cls.push('cand');
        if (s.piv && s.piv[0] === i && s.piv[1] === c) cls.push('piv');
        else if (s.chg && s.chg.indexOf(i) >= 0) cls.push('chg');
        else if (s.src === i) cls.push('src');
        if (s.bad === i) cls.push('bad');
        html += '<td class="' + cls.join(' ') + '">' + str(s.a[i][c]) + '</td>';
      }
      html += '</tr>';
    }
    tb.innerHTML = html;
    document.getElementById('badge').textContent = k + 1;
    document.getElementById('head').textContent = s.head;
    document.getElementById('txt').textContent = s.msg;
    panel.className = 'panel ' + s.cls;
    progress(k, steps.length);
    if (!quiet) fit();
  }
  function show(n) { k = Math.max(0, Math.min(steps.length - 1, n)); render(); }
  function stop() { if (timer) { clearInterval(timer); timer = null; } playBtn(false); }
  function play() {
    if (timer) { stop(); return; }
    if (k === steps.length - 1) show(0);
    playBtn(true);
    timer = setInterval(function () { if (k >= steps.length - 1) stop(); else show(k + 1); }, 2000);
  }
  function eqText(m) {
    return m.map(function (row) {
      var s = '';
      for (var c = 0; c < M; c++) {
        var v = row[c]; if (!v) continue;
        var term = (Math.abs(v) === 1 ? '' : Math.abs(v)) + 'x' + (c + 1);
        s += s ? (v < 0 ? ' − ' : ' + ') + term : (v < 0 ? '−' : '') + term;
      }
      return s + ' = ' + row[M];
    }).join(L.sep + ' ');
  }
  function tabs() {
    var el = document.getElementById('tabs'); el.innerHTML = '';
    PRESETS.forEach(function (p, j) {
      var b = document.createElement('button'); b.textContent = p.name; b.setAttribute('role', 'tab');
      if (j === cur) b.className = 'on';
      b.onclick = function () { choose(j); }; el.appendChild(b);
    });
  }
  function choose(i) { stop(); cur = i; tabs(); eqs.textContent = eqText(PRESETS[i].m); build(PRESETS[i].m); show(0); }
  function lock() {
    var saveCur = cur, saveK = k;
    lockHeights([eqs, panel, tb.parentNode], function (measure) {
      PRESETS.forEach(function (p) {
        eqs.textContent = eqText(p.m); build(p.m);
        for (k = 0; k < steps.length; k++) { render(true); measure(); }
      });
    });
    cur = saveCur; eqs.textContent = eqText(PRESETS[cur].m); build(PRESETS[cur].m); k = saveK; render();
  }
  document.getElementById('prev').onclick = function () { stop(); show(k - 1); };
  document.getElementById('next').onclick = function () { stop(); show(k + 1); };
  document.getElementById('play').onclick = play;
  document.getElementById('reset').onclick = function () { stop(); show(0); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { stop(); show(k + 1); }
    if (e.key === 'ArrowLeft') { stop(); show(k - 1); }
  });
  var rz = null;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(lock, 120); });
  window.addEventListener('load', lock);
  choose(0);
  lock();
})();
</script>
</body>
</html>
