* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font: 15px/1.6 PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif; -webkit-tap-highlight-color: transparent; }
header { padding: 14px 16px 10px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; }

a { color: var(--accent); }
.tours { display:flex; flex-wrap:wrap; gap:8px; padding: 0 16px 10px; }
.tours button, .stepbar button { font: inherit; font-size:14px; padding: 5px 12px; border-radius: 999px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }

.map svg { display:block; width:100%; height:auto; min-width: 1000px; }
.side { position: sticky; top: 12px; display:flex; flex-direction:column; gap:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding: 12px 14px; }
.card h2 { font-size:17px; margin:0 0 6px; }
.card p { margin: 4px 0; color: var(--muted); font-size:14px; }
.card h3 { font-size:13px; margin:10px 0 4px; color:var(--muted); font-weight:600; }
.card ul { margin:0; padding-left: 18px; font-size:14px; }
.stepbar { display:none; }
.stepbar.on { display:block; }
.stepbar .count { font-size:13px; color:var(--muted); }
.stepbar .cap { margin: 6px 0 10px; font-size:15px; color:var(--fg); }
.stepbar .btns { display:flex; gap:8px; }
.node { cursor:pointer; outline:none; }
.node:hover > rect:first-of-type, .node:focus-visible > rect:first-of-type { stroke:#bf3989; stroke-width:2.5; }
.node.sel > rect:first-of-type { stroke:#bf3989; stroke-width:3; }
svg .tag a tspan { text-decoration: underline; text-decoration-color: rgba(9,105,218,.35); }
svg .tag a:hover tspan { fill:#bf3989; }
svg.dim .node, svg.dim .edge { opacity:.18; transition: opacity .25s; }
svg.dim .node.on, svg.dim .edge.on { opacity:1; }
svg .edge.on { stroke:#bf3989; stroke-width:3; }
svg.dim .node.on > rect:first-of-type { stroke:#bf3989; stroke-width:3; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; order: -1; }
  .map { max-height: 70vh; }
}
@media (prefers-reduced-motion: reduce) { svg.dim .node, svg.dim .edge { transition:none; } }

  <text x="20" y="62" class="s">Blue text = where it is covered (#N = Trading System Notes #N, Ref = a section of the reference page). Times are orders of magnitude.</text>
  <text x="20" y="82" class="s">Black = hot path (market data → order); red = reports coming back (fill → position → strategy); grey dashed = side paths (recording, logging, monitoring, push).</text>
  <text x="20" y="102" class="s">Green = hot thread, each pinned to an isolated core; blue = a structure that hands data between threads; yellow = a join point; dashed = side-path threads or processes.</text>

  <text x="272" y="248" class="s">Kernel stack: 5–10 µs</text>

  <text x="532" y="230" class="s">Check per-channel</text>
  <text x="532" y="248" class="s">sequence, fill gaps</text>
  <text x="532" y="266" class="s">Ring first, then by stock</text>

  <text x="532" y="458" class="s">Producer waits for no one</text>
  <text x="532" y="476" class="tag"><a href="/posts/spmc-shared-memory-broadcast-ring/" target="_blank" rel="noopener"><tspan>#5 SPMC broadcast ring</tspan></a></text>

  <text x="792" y="440" class="s">shards → join → strategy,</text>
  <text x="792" y="458" class="s">ms to s.</text>
  <text x="792" y="476" class="s">Per tick (MM, arbitrage):</text>
  <text x="792" y="494" class="s">signal to order inside</text>
  <text x="792" y="512" class="s">the shard thread, in µs.</text>
  </g>

  <text x="1032" y="460" class="s">One writer; others read snapshots</text>
  <text x="1032" y="478" class="tag"><a href="/posts/prefetch-warmup-double-buffer/" target="_blank" rel="noopener"><tspan>#14 double-buffered snapshots</tspan></a></text>
  </g>

  <text x="1342" y="460" class="s">Check positions, cash, orders</text>
  <text x="1342" y="478" class="s">Decide buy, sell, cancel</text>

  <text x="1342" y="718" class="s">Slice big orders over time</text>
  <text x="1342" y="736" class="s">(TWAP and the like)</text>

  <text x="1032" y="758" class="s">Orders leave through the NIC</text>

  <text x="44" y="968" class="s">Offline must match live,</text>
  <text x="44" y="986" class="s">value for value</text>
  </g>

  <text x="282" y="950" class="s">in batches</text>
  <text x="282" y="968" class="s">A ring behind = lapped:</text>
  <text x="282" y="986" class="s">detect it, alert</text>
  <text x="282" y="1004" class="tag"><a href="/posts/spmc-shared-memory-broadcast-ring/#23-three-deployment-traps" target="_blank" rel="noopener"><tspan>#5 2.3 deployment traps</tspan></a></text>

  <text x="532" y="950" class="s">Rejects, cancels, positions</text>
  <text x="532" y="968" class="s">Reads counters, off hot path</text>

  <text x="792" y="950" class="s">one record and move on;</text>
  <text x="792" y="968" class="s">a background thread</text>
  <text x="792" y="986" class="s">batches the writes</text>
  <text x="792" y="1004" class="tag"><a href="/posts/lock-free-queue-logger-micro-batching/" target="_blank" rel="noopener"><tspan>#4 queue and batching</tspan></a></text>

  <text x="1032" y="950" class="s">via a service and a queue</text>
  <text x="1032" y="968" class="s">into the decision thread</text>
  <text x="1032" y="986" class="s">Rare, but must act fast</text>

  <path d="M630,330 L630,378" class="side edge" id="e_feed_ring" marker-end="url(#arrG)"/>
  <path d="M590,510 L590,840 L375,840 L375,888" class="side edge" id="e_ring_rec" marker-end="url(#arrG)"/>
  <path d="M680,510 L680,888" class="side edge" id="e_ring_mon" marker-end="url(#arrG)"/>
  <path d="M270,970 L234,970" class="side edge" id="e_rec_research" marker-end="url(#arrG)"/>
  <path d="M880,822 L880,888" class="side edge" id="e_hot_log" marker-end="url(#arrG)"/>
  <path d="M1155,890 L1155,807" class="side edge" id="e_ctrl_dec" marker-end="url(#arrG)"/>
  <path d="M1445,790 L1445,888" class="side edge" id="e_oms_push" marker-end="url(#arrG)"/>
  <text x="233" y="242" class="lab" text-anchor="middle">data</text>
  <text x="638" y="360" class="lab" text-anchor="start">write once</text>

  <text x="156" y="505" class="labr" text-anchor="start">reports</text>
  <text x="420" y="790" class="labr" text-anchor="middle">reports: acks, fills, cancels →</text>

  <text x="20" y="1098" class="s">Times are orders of magnitude to show which stage is worth optimising, not measurements of any one system; see Part 2 of the reference page.</text>

<script>
const DATA = {"nodes": {"exch": {"title": "Exchange", "lines": ["The matching engine is where market data starts and where orders end.", "Market data goes out as multicast, split into channels: each channel carries a subset of the instruments, with consecutive sequence numbers. Orders come in to be matched; the results go back as execution reports."], "tags": []}, "counter": {"title": "Broker system", "lines": ["Orders usually do not go straight to the exchange: they pass through the broker's trading system, which runs its own risk checks and routes them on.", "A fast broker tier adds tens of microseconds, a standard one up to milliseconds (typical magnitudes). It sits outside your own system, so there is little to tune there."], "tags": []}, "nic": {"title": "NIC", "lines": ["The network card receives the market data packets. Through the kernel network stack each packet pays for an interrupt, a copy and a system call, about 5–10 µs; with kernel bypass the thread polls the card directly, about 1 µs.", "Route the card's interrupts to other cores so they never interrupt a hot thread."], "tags": [[["#1 keep IRQs off hot cores", "/posts/cpu-affinity-core-isolation-numa/"]]]}, "feed": {"title": "Feed handler thread", "lines": ["Decodes the packets into the internal format.", "Every channel's sequence numbers must be consecutive: a gap has to be recovered (retransmission or a snapshot), and until then that channel's data cannot be trusted.", "It first writes each message into the broadcast ring for the readers that are not in a hurry, then looks up the stock's shard and writes into that shard's queue."], "tags": [[["#5 broadcast ring 1.7", "/posts/spmc-shared-memory-broadcast-ring/#17-when-not-to-use-a-broadcast-ring"]]]}, "spsc": {"title": "Shard queues", "lines": ["One single-producer single-consumer queue per shard: the feed thread writes, the shard thread reads.", "A table maps each stock to a shard, fixed before the open; a stock always goes to the same shard, so its messages stay in order.", "One handoff is one cache line moving from one core to another: tens of nanoseconds."], "tags": [[["#4 lock-free queue", "/posts/lock-free-queue-logger-micro-batching/"]], [["Ref 2.6 cross-core", "/ref/cpu-memory/#cross-core"]]]}, "shard": {"title": "Shard threads ×N", "lines": ["Each shard thread owns a set of stocks: it updates their order books, then their factors, incrementally. Nobody else touches that state, so no locks.", "Shards are balanced by message volume, not by the number of stocks: the busy names send far more messages.", "Before the open, touch everything this core will use (warm-up), so the first page fault and the first cache miss do not land in the first seconds of trading."], "tags": [[["Cache case study: 64 options a tick", "/posts/low-latency-cache-case-study/"]], [["#14 warm up on the working core", "/posts/prefetch-warmup-double-buffer/"]]]}, "barrier": {"title": "Join: bar complete", "lines": ["A cross-sectional strategy has to wait until every shard has finished the bar before it can rank and normalise.", "This is a join point: it waits for the slowest shard.", "Only cross-sectional work needs a join; a stock's own factors never wait for anyone."], "tags": []}, "ring": {"title": "Broadcast ring (shm)", "lines": ["The feed thread writes each message once; every reader that needs the full stream reads it on its own: recorder, monitor, research.", "The producer never looks at where readers are; a slow reader gets lapped and has to notice it itself.", "More readers never make the producer wait, but a reader that spins on the newest slot makes every write more expensive when the producer runs flat out (#5 1.6)."], "tags": [[["#5 SPMC broadcast ring", "/posts/spmc-shared-memory-broadcast-ring/"]]]}, "clock": {"title": "Two cadences", "lines": ["The two kinds of strategy run on different clocks.", "Per bar (multi-factor): every stock finishes the bar, then everything is scored together. A handoff of tens of nanoseconds is invisible here; what matters is how long a wave of data takes to be fully processed.", "Per tick (market making, arbitrage): one message can trigger one order. The shard thread computes the signal, runs the risk checks and sends the order itself, with no join and no queue: microseconds end to end."], "tags": []}, "acct": {"title": "Account state", "lines": ["Positions, cash and open orders are the most important state in the system.", "Only the decision thread writes them; the push service and the monitor read the snapshots it publishes and never touch the copy being changed.", "How to publish a snapshot without readers seeing half old and half new data: #14, double buffering."], "tags": [[["#14 double-buffered snapshots", "/posts/prefetch-warmup-double-buffer/"]]]}, "strategy": {"title": "Strategy", "lines": ["Combines and ranks the scores, checks them against current positions, cash and unfilled orders, and decides what to buy, sell or cancel.", "It decides what and how much; how to send it is left to the order manager."], "tags": []}, "risk": {"title": "Pre-trade risk", "lines": ["The checks every order passes before it goes out: order size and position limits, whether the price is within a sane band, whether orders and cancels are coming too fast.", "With the kill switch on, nothing goes out. It sits on the hot path, so it only compares numbers in memory."], "tags": []}, "oms": {"title": "Order manager (OMS)", "lines": ["Gives every order a state machine: new, sent, partly filled, filled, cancelled, rejected.", "A big order is not sent at once: it is sliced and sent on a schedule (TWAP spreads it evenly over time, VWAP follows traded volume) so it does not push the price away.", "Order objects come from a pool allocated in advance; nothing is allocated on the hot path (#3)."], "tags": [[["#3 no hot-path allocation", "/posts/hot-path-memory-allocators/"]]]}, "gw": {"title": "Order gateway", "lines": ["Encodes orders in the broker or exchange protocol, keeps the session and sequence numbers, throttles the rate and sends them out through the NIC.", "Execution reports come in here too; they are decoded and handed to the order manager."], "tags": []}, "research": {"title": "Replay and research", "lines": ["The recorded data is fed, in its original order, back through the same factor code.", "Only when offline results match live results value for value can the replay be trusted. It is also the regression test after a code change: same day of data, not a single output value may change."], "tags": []}, "rec": {"title": "Recorder", "lines": ["The recorder reads the full stream from the broadcast ring and writes it to files for replay and research.", "It may read in batches, but never a full ring behind, or it gets lapped and silently loses data; after a restart it resumes from a saved cursor (#5 2.3)."], "tags": [[["#5 2.3 deployment traps", "/posts/spmc-shared-memory-broadcast-ring/#23-three-deployment-traps"]]]}, "mon": {"title": "Monitoring", "lines": ["Watches feed gaps, queue backlogs, latency percentiles for every stage, rejects, cancel rates and positions.", "It only reads counters that each thread keeps for itself and does its statistics on its own thread, adding no work to the hot path."], "tags": []}, "log": {"title": "Async logger", "lines": ["A hot thread logs by putting one record into a queue and moving on; a background thread batches records, formats them and writes them out.", "Neither formatting nor disk writes happen on the hot path (#4)."], "tags": [[["#4 queue and batching", "/posts/lock-free-queue-logger-micro-batching/"]]]}, "ctrl": {"title": "Trader commands", "lines": ["Commands from traders: start or stop a strategy or an algo order, cancel, change parameters.", "A service validates them and passes them through a queue into the decision thread, which changes its own state. They are rare, but must take effect quickly, cancels above all."], "tags": []}, "push": {"title": "Client push", "lines": ["Pushes order states, positions and algo-order progress to the traders' screens.", "It is for people: tens of milliseconds is fine; trouble starts at hundreds of milliseconds or seconds.", "It reads the snapshots the decision thread publishes and never touches the state the hot path is changing."], "tags": []}}, "ui": {"page_title": "Architecture Map", "lead": "Click a box to see what it does and why it is built that way. Pick a path to step through how a market data message becomes a fill. Blue labels open the posts.", "other_lang": ["中文", "arch-map.zh.html"], "static": ["Static image", "/images/ref/arch-map.en.svg"], "ref": ["Reference", "/ref/trading-architecture/"], "prev": "Back", "next": "Next", "exit": "Exit", "step": "Step {i} of {n}", "panel_empty": "Click any box in the map.", "zoom": ["Actual size", "Fit width"], "panel_links": "Covered in", "tours": {"tick": ["A tick to an order", [[["exch", "e_exch_nic", "nic"], "The exchange multicasts market data by channel and the NIC receives the packet: about 1 µs with kernel bypass, 5–10 µs through the kernel stack."], [["e_nic_feed", "feed"], "The feed handler thread decodes it and checks the channel sequence number; a gap has to be recovered."], [["e_feed_ring", "ring"], "It first writes the message into the broadcast ring for readers that are not in a hurry, such as the recorder and the monitor, and moves on without waiting for anyone."], [["e_feed_spsc", "spsc"], "Then it looks up the stock's shard and writes into that shard's queue. A stock always goes to the same shard, so its messages stay in order; the handoff costs tens of nanoseconds."], [["e_spsc_shard", "shard"], "The shard thread updates the stock's order book, then its factors, incrementally. Each shard touches only its own stocks' state, so no locks."], [["e_shard_barrier", "barrier"], "A cross-sectional strategy waits until every shard has finished the bar, then ranks and normalises everything together. This is a join: it waits for the slowest shard."], [["e_barrier_strategy", "strategy"], "The strategy checks positions, cash and open orders and decides what to buy, sell or cancel."], [["e_strategy_risk", "risk"], "Pre-trade risk checks size and position limits, price bands and order rates; with the kill switch on, nothing goes out."], [["e_risk_oms", "oms"], "The order manager gives every order a state. A big order is not sent at once but sliced and sent on a schedule (TWAP and the like)."], [["e_oms_gw", "gw", "e_gw_counter", "counter", "e_counter_exch"], "The order gateway encodes the order and sends it through the broker's system to the exchange: tens to hundreds of µs round trip from co-location, up to milliseconds through a standard broker tier."]]], "fast": ["Per-tick strategies", [[["exch", "e_exch_nic", "nic", "e_nic_feed", "feed"], "Same start: data reaches the NIC and is decoded. The fastest systems map the exchange's channels straight to threads and skip the per-stock dispatch altogether."], [["e_feed_spsc", "spsc", "e_spsc_shard", "shard"], "The message reaches the thread that owns the stock."], [["clock", "shard"], "A per-tick strategy (market making, arbitrage) does not wait for a join: the same thread computes the signal and decides right away whether to send an order."], [["risk", "oms", "gw"], "The risk, order-manager and gateway code then run in the same thread, with no queue in between. Every extra cross-core handoff would add tens of nanoseconds and some jitter."]]], "fill": ["A fill coming back", [[["exch", "e_exch_counter_r", "counter"], "After matching, the exchange sends execution reports: acknowledgements, fills and cancels. They come back through the broker's system."], [["e_counter_gw_r", "gw"], "The broker system passes them to the order gateway, which decodes them."], [["e_gw_oms_r", "oms"], "The order manager updates the order's state: partly filled, filled or cancelled."], [["e_oms_acct_r", "acct"], "The account state follows: positions, cash, open orders. Only the decision thread writes it; every other thread reads snapshots."], [["e_acct_strategy_r", "strategy"], "The next decision uses the new positions and cash, which closes the loop. Risk checks read the same state."], [["e_oms_push", "push"], "On the side, the client push sends the order and position changes to the traders' screens; for people, tens of milliseconds is fine."]]], "side": ["Side paths and commands", [[["e_ring_rec", "rec"], "The recorder reads the broadcast ring and writes everything to files. It may read in batches, but never a full ring behind, or it gets lapped and loses data."], [["e_rec_research", "research"], "The recordings are replayed offline through the same factor code; only if offline matches live value for value can the replay be trusted."], [["e_ring_mon", "mon"], "The monitor reads the ring and each thread's counters: gaps, backlog, latency percentiles, rejects. It may be slow, but it must never hold up the hot path."], [["e_hot_log", "log"], "A hot thread logs by putting one record into a queue and moving on; a background thread batches the writes."], [["ctrl", "e_ctrl_dec"], "Trader commands (start/stop, cancel, change parameters) go through a service and a queue into the decision thread: rare, but they must take effect quickly."]]], "burst": ["The opening rush", [[["exch", "e_exch_nic", "nic", "e_nic_feed", "feed"], "At the open, the close and on news, messages arrive several times faster than usual. The feed thread only decodes and dispatches each one, so it keeps up."], [["e_feed_spsc", "spsc", "e_spsc_shard", "shard"], "The slow part is further on: when each message carries a lot of factor work, the shard threads fall behind, messages queue up, and the factors run on stale data."], [["e_feed_ring", "ring", "e_ring_rec", "rec"], "The backlog sits in the rings and queues: backlog = (arrival rate − service rate) × duration, and it must stay below capacity. A broadcast ring that overflows laps its readers."], [["shard", "clock"], "So what to save is the queueing, not the handoff: shard by message volume, add shard threads, and cut the work per message."]]]}}};
const svg = document.querySelector('.map svg');
const panel = document.getElementById('panel');
const bar = document.getElementById('stepbar');
let tour = null, step = 0;
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function show(id){
  svg.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
  const n = DATA.nodes[id]; if (!n) return;
  document.getElementById(id).classList.add('sel');
  let h = '<h2>' + esc(n.title) + '</h2>' + n.lines.map(l => '<p>' + esc(l) + '</p>').join('');
  const links = [];
  n.tags.forEach(line => line.forEach(([txt, url]) => { if (url) links.push('<li><a href="' + url + '" target="_blank" rel="noopener">' + esc(txt.replace(/^ · /, '')) + '</a></li>'); }));
  if (links.length) h += '<h3>' + esc(DATA.ui.panel_links) + '</h3><ul>' + links.join('') + '</ul>';
  panel.innerHTML = h;
}
svg.querySelectorAll('.node').forEach(g => {
  g.addEventListener('click', e => { if (e.target.closest('a')) return; show(g.id); });
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(g.id); } });
});
function render(){
  svg.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.tours button[data-k]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === tour ? 'true' : 'false'));
  if (!tour) { svg.classList.remove('dim'); bar.classList.remove('on'); return; }
  const steps = DATA.ui.tours[tour][1];
  svg.classList.add('dim'); bar.classList.add('on');
  for (let i = 0; i <= step; i++) steps[i][0].forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('on'); });
  bar.querySelector('.count').textContent = DATA.ui.step.replace('{i}', step + 1).replace('{n}', steps.length);
  bar.querySelector('.cap').textContent = steps[step][1];
  bar.querySelector('.prev').disabled = step === 0;
  bar.querySelector('.next').disabled = step === steps.length - 1;
  const last = steps[step][0].map(id => document.getElementById(id)).filter(el => el && el.classList.contains('node')).pop();
  if (last) { show(last.id); last.scrollIntoView({block:'nearest', inline:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
}
document.querySelector('.tours .zoom').addEventListener('click', e => {
  const on = document.querySelector('.map').classList.toggle('full');
  e.currentTarget.setAttribute('aria-pressed', on ? 'true' : 'false');
  e.currentTarget.textContent = on ? DATA.ui.zoom[1] : DATA.ui.zoom[0];
});
document.querySelectorAll('.tours button[data-k]').forEach(b => b.addEventListener('click', () => { tour = tour === b.dataset.k ? null : b.dataset.k; step = 0; render(); }));
bar.querySelector('.prev').addEventListener('click', () => { step--; render(); });
bar.querySelector('.next').addEventListener('click', () => { step++; render(); });
bar.querySelector('.exit').addEventListener('click', () => { tour = null; render(); });
document.addEventListener('keydown', e => {
  if (!tour) return;
  const n = DATA.ui.tours[tour][1].length;
  if (e.key === 'ArrowRight' && step < n - 1) { step++; render(); }
  if (e.key === 'ArrowLeft' && step > 0) { step--; render(); }
  if (e.key === 'Escape') { tour = null; render(); }
});
const h = location.hash.slice(1);
if (DATA.ui.tours[h]) { tour = h; step = 0; render(); }
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
