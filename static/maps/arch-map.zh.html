.card ul { margin:0; padding-left: 18px; font-size:14px; }
.stepbar { display:none; }
.stepbar.on { display:block; }
.stepbar .count { font-size:13px; color:var(--muted); }
.stepbar .cap { margin: 6px 0 10px; font-size:15px; color:var(--fg); }
.stepbar .btns { display:flex; gap:8px; }
.node { cursor:pointer; outline:none; }
.node:hover > rect:first-of-type, .node:focus-visible > rect:first-of-type { stroke:#bf3989; stroke-width:2.5; }
.node.sel > rect:first-of-type { stroke:#bf3989; stroke-width:3; }
svg .tag a tspan { text-decoration: underline; text-decoration-color: rgba(9,105,218,.35); }

svg.dim .node, svg.dim .edge { opacity:.18; transition: opacity .25s; }
svg.dim .node.on, svg.dim .edge.on { opacity:1; }
svg .edge.on { stroke:#bf3989; stroke-width:3; }
svg.dim .node.on > rect:first-of-type { stroke:#bf3989; stroke-width:3; }
@media (max-width: 900px) {

  .side { position: static; order: -1; }
  .map { max-height: 70vh; }
}
@media (prefers-reduced-motion: reduce) { svg.dim .node, svg.dim .edge { transition:none; } }

  <text x="20" y="62" class="s">蓝字 = 在哪里讲过（#N = 交易系统笔记 #N，速查 = 速查页的小节）。时间都是量级。</text>

<script>
const DATA = {"nodes": {"exch": {"title": "交易所", "lines": ["交易所的撮合引擎是行情的源头，也是报单的终点。", "行情按通道组播发出：每个通道只带一部分证券，通道里的消息序号连续。报单进来撮合，结果以回报发回。"], "tags": []}, "counter": {"title": "券商柜台", "lines": ["报单一般不直接进交易所：先过券商的柜台系统，它做自己的风控和报盘，再转给交易所。", "极速柜台几十微秒，普通柜台到毫秒（常见量级）。这一段在自己的系统之外，能优化的不多。"], "tags": []}, "nic": {"title": "网卡（NIC）", "lines": ["网卡收到行情包。走操作系统内核的协议栈，每个包要过中断、拷贝和系统调用，约 5–10 µs；绕过内核（kernel bypass），线程直接轮询网卡，约 1 µs。", "网卡的中断要绑到别的核上，别打断热线程。"], "tags": [[["#1 中断别打到热核", "/zh/posts/cpu-affinity-core-isolation-numa/"]]]}, "feed": {"title": "行情接入线程", "lines": ["把网卡上的包解码成内部格式。", "每个通道的序号必须连续：发现断档就要去补（重传或拿快照恢复），补齐之前这个通道的数据不可信。", "解码完先写一份进广播环，给不赶时间的读者；再按股票查表，写进负责这只股票的分片队列。"], "tags": [[["#5 广播环 1.6", "/zh/posts/spmc-shared-memory-broadcast-ring/#16-什么时候不用广播环"]]]}, "spsc": {"title": "分片队列（SPSC）", "lines": ["每个分片一个单生产者、单消费者的队列：接入线程写，分片线程读。", "股票到分片是一张表，开盘前排好；同一只股票永远进同一片，顺序就不会乱。", "交接一次，就是一条缓存行从一个核搬到另一个核，几十纳秒。"], "tags": [[["#4 无锁队列", "/zh/posts/lock-free-queue-logger-micro-batching/"]], [["速查 2.6 跨核交接", "/zh/ref/cpu-memory/#cross-core"]]]}, "shard": {"title": "分片线程 ×N", "lines": ["每个分片线程只管自己那些股票：更新盘口，再增量更新因子。状态只有它自己碰，不用锁。", "分片按消息量分，不按股票个数分：热门股的消息多得多。", "开盘前在这个核上把要用的数据碰一遍（预热），别让第一次缺页、第一次缓存缺失落在开盘那几秒。"], "tags": [[["缓存案例：一次行情重算 64 个期权", "/zh/posts/low-latency-cache-case-study/"]], [["#14 在干活的核上预热", "/zh/posts/prefetch-warmup-double-buffer/"]]]}, "barrier": {"title": "汇合：bar 收齐", "lines": ["按 bar 截面的策略，要等所有分片都算完这一根 bar，才能一起排名、标准化。", "这是一个汇合点，要等最慢的那个分片。", "只有截面才要汇合；单只股票自己的因子不用等别人。"], "tags": []}, "ring": {"title": "广播环（共享内存）", "lines": ["接入线程只写一份，要全量的读者各自来读：落盘、监控、研究。", "生产者从不看读者读到哪，慢读者会被套圈，要自己发现。", "读者再多也不会让生产者等，但死循环盯着最新槽位的读者，会让每次写变贵（#5 1.5.3）。"], "tags": [[["#5 SPMC 广播环", "/zh/posts/spmc-shared-memory-broadcast-ring/"]]]}, "clock": {"title": "两种节奏", "lines": ["两种策略的节奏不一样。", "按 bar 截面（多因子）：所有股票算完一根 bar 再一起打分。几十纳秒的交接看不出来，要盯的是一波数据进来以后，多久全部算完。", "逐笔触发（做市、套利）：一条行情就可能触发一笔报单。分片线程里一路算信号、过风控、发单，不过汇合、不过队列，全程微秒级。"], "tags": []}, "acct": {"title": "账户状态", "lines": ["持仓、资金、在途单，是整个系统里最要紧的状态。", "只让决策线程一个人改；推送、监控要看，就读它发布出来的快照，不碰正在改的那份。", "快照怎么发才不会读到一半新一半旧，见 #14 的双缓冲。"], "tags": [[["#14 双缓冲读快照", "/zh/posts/prefetch-warmup-double-buffer/"]]]}, "strategy": {"title": "策略", "lines": ["把各股票的打分合成、排名，再对照现在的持仓、资金和还没成交的单子，决定买什么、卖什么、撤哪些。", "它只决定“做什么、做多少”，“怎么下”交给后面的订单管理。"], "tags": []}, "risk": {"title": "事前风控", "lines": ["每一笔单子发出去之前都要过的检查：单笔和持仓上限、价格在不在合理范围、报撤单是不是太频繁。", "总开关（kill switch）一关，什么都发不出去。它在热路径上，所以只做内存里的比较。"], "tags": []}, "oms": {"title": "订单管理（OMS）", "lines": ["给每笔单子一个状态机：新建、已报、部分成交、全部成交、已撤、被拒。", "大单不一次发出去，拆成小单按时间表发（TWAP 平均分到一段时间里，VWAP 按成交量分），免得一下把价格砸穿。", "订单对象从预先分配好的池子里拿，热路径上不现分配内存（#3）。"], "tags": [[["#3 热路径不现分配内存", "/zh/posts/hot-path-memory-allocators/"]]]}, "gw": {"title": "下单网关", "lines": ["把单子编码成柜台或交易所的协议，维护会话和序号，控制发送速度，再从网卡发出去。", "回报也从这里进来，解码后交给订单管理。"], "tags": []}, "research": {"title": "离线回放与研究", "lines": ["录下的行情按原来的顺序，喂回同一份因子代码。", "离线算出来的和盘中算出来的逐值对得上，才说明回放可信。改了代码以后也靠它做回归：改前改后输出一个值都不变，才算没改坏。"], "tags": []}, "rec": {"title": "行情落盘（录制）", "lines": ["落盘进程从广播环读全量，写成文件，给回放和研究用。", "它可以隔一会读一批，但不能落后满一圈，否则会被套圈、无声丢数据；重启要从存下的游标接着读（#5 2.3）。"], "tags": [[["#5 2.3 部署时的坑", "/zh/posts/spmc-shared-memory-broadcast-ring/#23-部署时的三个坑"]]]}, "mon": {"title": "监控与告警", "lines": ["盯行情断档、各队列的积压、每一段延迟的分位数、拒单和撤单率、仓位。", "只读各线程自己记的计数器，统计在监控自己的线程里算，不往热路径上加活。"], "tags": []}, "log": {"title": "异步日志", "lines": ["热线程打日志，只把一条记录写进队列就走；后台线程攒一批，再格式化、写盘。", "格式化和写盘都不在热路径上（#4）。"], "tags": [[["#4 无锁队列与攒批", "/zh/posts/lock-free-queue-logger-micro-batching/"]]]}, "ctrl": {"title": "交易员指令", "lines": ["交易员的指令：启停策略或算法单、撤单、改参数。", "经服务进程校验后走队列送进决策线程，由决策线程自己改状态。次数少，但人点了要尽快生效，撤单尤其要快。"], "tags": []}, "push": {"title": "客户端推送", "lines": ["把订单状态、持仓、算法单进度推到交易员的屏幕上。", "是给人看的：几十毫秒够用，到百毫秒、秒级才开始误事。", "读决策线程发布的快照，不碰热路径正在改的状态。"], "tags": []}}, "ui": {"page_title": "架构地图", "lead": "点一个框看它做什么、为什么这样设计；选一条路径，一步一步看一条行情怎么变成一笔成交。蓝字可以直接点开对应的文章。", "other_lang": ["English", "arch-map.en.html"], "static": ["静态图", "/images/ref/arch-map.zh.svg"], "ref": ["速查页", "/zh/ref/trading-architecture/"], "prev": "上一步", "next": "下一步", "exit": "退出", "step": "第 {i} / {n} 步", "panel_empty": "点图里的任意一个框。", "zoom": ["看原尺寸", "适应宽度"], "panel_links": "在哪里讲过", "tours": {"tick": ["一条行情到下单", [[["exch", "e_exch_nic", "nic"], "交易所把行情按通道组播出来，网卡收到包。绕过内核直接收约 1 µs，走内核协议栈要 5–10 µs。"], [["e_nic_feed", "feed"], "行情接入线程解码，按通道查序号：断档了就去补。"], [["e_feed_ring", "ring"], "先写一份进广播环，给落盘、监控这些不赶时间的读者。写完就走，不等任何读者。"], [["e_feed_spsc", "spsc"], "再按股票查表，写进负责这只股票的分片队列。同一只股票永远进同一片，顺序不会乱；交接一次几十纳秒。"], [["e_spsc_shard", "shard"], "分片线程更新这只股票的盘口，再增量更新它的因子。每个分片只碰自己那些股票的状态，不用锁。"], [["e_shard_barrier", "barrier"], "按 bar 截面的策略要等所有分片都算完这根 bar，再一起排名、标准化。这是汇合点，要等最慢的那个分片。"], [["e_barrier_strategy", "strategy"], "策略对照持仓、资金、在途单，决定买什么、卖什么、撤哪些。"], [["e_strategy_risk", "risk"], "事前风控检查单笔和持仓上限、价格范围、报撤频率；总开关一关，什么都发不出去。"], [["e_risk_oms", "oms"], "订单管理给每笔单子建状态。大单不一次发出去，拆成小单按时间表发（TWAP 等）。"], [["e_oms_gw", "gw", "e_gw_counter", "counter", "e_counter_exch"], "下单网关编码成协议发出去，经券商柜台到交易所。托管直连往返几十到几百 µs，经普通柜台可到毫秒。"]]], "fast": ["逐笔触发", [[["exch", "e_exch_nic", "nic", "e_nic_feed", "feed"], "前面一样：行情进网卡，接入线程解码。最快的系统让交易所的通道直接对应线程，连按股票分发这一步都省掉。"], [["e_feed_spsc", "spsc", "e_spsc_shard", "shard"], "消息交给负责这只股票的线程。"], [["clock", "shard"], "逐笔触发的策略（做市、套利）不等汇合：在这个线程里一路算信号，算完马上决定发不发单。"], [["risk", "oms", "gw"], "风控、订单管理、网关的代码也在这个线程里接着调，中间不过任何队列。每多一次跨核交接，就多几十纳秒和一份抖动。"]]], "fill": ["一笔成交回来", [[["exch", "e_exch_counter_r", "counter"], "交易所撮合以后发出回报：确认、成交、撤单都算。回报先回到券商柜台。"], [["e_counter_gw_r", "gw"], "柜台把回报转给下单网关，网关解码。"], [["e_gw_oms_r", "oms"], "订单管理更新这笔单子的状态：部分成交、全部成交、已撤。"], [["e_oms_acct_r", "acct"], "账户状态跟着变：持仓、资金、在途单。这些只让决策线程一个人改，别的线程只读快照。"], [["e_acct_strategy_r", "strategy"], "下一次决策用的就是新的持仓和资金，回路闭合。风控检查上限时，读的也是这份状态。"], [["e_oms_push", "push"], "旁边，推送把订单和持仓的变化送到交易员的屏幕上。给人看的，几十毫秒够用。"]]], "side": ["旁路与指令", [[["e_ring_rec", "rec"], "落盘进程读广播环，全量写文件。它可以隔一会读一批，但不能落后满一圈，否则会被套圈、丢数据。"], [["e_rec_research", "research"], "录下的行情拿去离线回放：喂回同一份因子代码，离线结果和盘中逐值对得上，才说明回放可信。"], [["e_ring_mon", "mon"], "监控读环和各线程的计数器：断档、积压、延迟分位数、拒单。它慢了不要紧，但不能拖住热路径。"], [["e_hot_log", "log"], "热线程打日志只往队列里写一条就走，后台线程攒一批再写盘。"], [["ctrl", "e_ctrl_dec"], "交易员的指令（启停、撤单、改参数）经服务进程走队列送进决策线程。次数少，但人点了要尽快生效。"]]], "burst": ["开盘蜂拥", [[["exch", "e_exch_nic", "nic", "e_nic_feed", "feed"], "开盘、收盘、消息面的时候，消息一下涌进来，是平时的好几倍。接入线程每条只做解码和分发，扛得住。"], [["e_feed_spsc", "spsc", "e_spsc_shard", "shard"], "慢的是后面：每条要算的因子多了，分片线程算不过来，消息就在分片队列里排队，因子用的就是旧行情。"], [["e_feed_ring", "ring", "e_ring_rec", "rec"], "积压都堆在环和队列里：积压 =（到达速度 − 处理速度）× 持续时间，不能超过容量。广播环超过就会套圈。"], [["shard", "clock"], "所以要省的是排队，不是交接：按消息量分片，多开几个分片线程，让每条的活变少。"]]]}}};
const svg = document.querySelector('.map svg');
const panel = document.getElementById('panel');
const bar = document.getElementById('stepbar');
let tour = null, step = 0;
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function show(id){
  svg.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
  const n = DATA.nodes[id]; if (!n) return;
  document.getElementById(id).classList.add('sel');
  let h = '<h2>' + esc(n.title) + '</h2>' + n.lines.map(l => '<p>' + esc(l) + '</p>').join('');
  const links = [];
  n.tags.forEach(line => line.forEach(([txt, url]) => { if (url) links.push('<li><a href="' + url + '" target="_blank" rel="noopener">' + esc(txt.replace(/^ · /, '')) + '</a></li>'); }));
  if (links.length) h += '<h3>' + esc(DATA.ui.panel_links) + '</h3><ul>' + links.join('') + '</ul>';
  panel.innerHTML = h;
}
svg.querySelectorAll('.node').forEach(g => {
  g.addEventListener('click', e => { if (e.target.closest('a')) return; show(g.id); });
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(g.id); } });
});
function render(){
  svg.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.tours button[data-k]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === tour ? 'true' : 'false'));
  if (!tour) { svg.classList.remove('dim'); bar.classList.remove('on'); return; }
  const steps = DATA.ui.tours[tour][1];
  svg.classList.add('dim'); bar.classList.add('on');
  for (let i = 0; i <= step; i++) steps[i][0].forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('on'); });
  bar.querySelector('.count').textContent = DATA.ui.step.replace('{i}', step + 1).replace('{n}', steps.length);
  bar.querySelector('.cap').textContent = steps[step][1];
  bar.querySelector('.prev').disabled = step === 0;
  bar.querySelector('.next').disabled = step === steps.length - 1;
  const last = steps[step][0].map(id => document.getElementById(id)).filter(el => el && el.classList.contains('node')).pop();
  if (last) { show(last.id); last.scrollIntoView({block:'nearest', inline:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
}
document.querySelector('.tours .zoom').addEventListener('click', e => {
  const on = document.querySelector('.map').classList.toggle('full');
  e.currentTarget.setAttribute('aria-pressed', on ? 'true' : 'false');
  e.currentTarget.textContent = on ? DATA.ui.zoom[1] : DATA.ui.zoom[0];
});
document.querySelectorAll('.tours button[data-k]').forEach(b => b.addEventListener('click', () => { tour = tour === b.dataset.k ? null : b.dataset.k; step = 0; render(); }));
bar.querySelector('.prev').addEventListener('click', () => { step--; render(); });
bar.querySelector('.next').addEventListener('click', () => { step++; render(); });
bar.querySelector('.exit').addEventListener('click', () => { tour = null; render(); });
document.addEventListener('keydown', e => {
  if (!tour) return;
  const n = DATA.ui.tours[tour][1].length;
  if (e.key === 'ArrowRight' && step < n - 1) { step++; render(); }
  if (e.key === 'ArrowLeft' && step > 0) { step--; render(); }
  if (e.key === 'Escape') { tour = null; render(); }
});
const h = location.hash.slice(1);
if (DATA.ui.tours[h]) { tour = h; step = 0; render(); }
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</body>
