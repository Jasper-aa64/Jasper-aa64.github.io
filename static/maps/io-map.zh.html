<header>
<h1>IO 地图</h1>
<p class="lead">点一个框看它做什么、在哪篇讲过；选一条路径，一步一步看一次 read、一次 recv、一次 sendfile 怎么走。蓝字可以直接点开对应的文章或地图。</p>
<nav><a href="/maps/process-map.zh.html">进程地图</a><a href="/zh/ref/cpp-linux/#io">速查页</a><a href="/images/ref/io-map.zh.svg">静态图</a></nav>
</header>
<div class="tours"><button type="button" data-k="read" aria-pressed="false">读一个文件</button><button type="button" data-k="write" aria-pressed="false">写一个文件</button><button type="button" data-k="mmap" aria-pressed="false">映射一个文件</button><button type="button" data-k="recv" aria-pressed="false">收一个包</button><button type="button" data-k="send" aria-pressed="false">发一个包</button><button type="button" data-k="sendfile" aria-pressed="false">把文件发到网络</button><button type="button" class="zoom" aria-pressed="false">看原尺寸</button></div>

    </marker>

  <rect x="0" y="0" width="1600" height="1150" fill="#ffffff"/>
  <text x="20" y="38" class="h" style="font-size:23px">IO 地图：数据怎么在设备、内核和你的缓冲区之间走</text>
  <text x="20" y="62" class="s">上面是用户态，中间是内核，下面是设备和内存。左边一列是文件，中间一列是网络。数字都是量级。</text>
  <text x="20" y="82" class="s">橙线 = CPU 拷贝；蓝色虚线 = DMA（设备直接读写内存，不占 CPU）；绿色虚线 = 映射，不拷贝；灰线 = 调用或通知。</text>
  <text x="20" y="102" class="s">蓝字 = 在哪里讲过，进程地图、硬件地图会打开对应的那张图。</text>
  <rect x="20" y="112" width="1560" height="230" rx="10" fill="#f6fbf7" stroke="#4ac26b" stroke-dasharray="6 4"/>
  <text x="32" y="134" class="lane-h" style="fill:#1a7f37">用户态：你的进程</text>
  <path d="M20,356 L1580,356" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
  <text x="1576" y="351" class="lab" text-anchor="end">系统调用：同一个线程切到内核态，一次来回约 100 ns 到几百 ns</text>
  <rect x="20" y="364" width="1560" height="478" rx="10" fill="#fbfbfc" stroke="#1f2328" stroke-width="2"/>
  <text x="32" y="383" class="lane-h" style="fill:#1f2328">内核态</text>
  <rect x="20" y="900" width="1560" height="190" rx="10" fill="#fff8f7" stroke="#ff8182" stroke-dasharray="6 4"/>
  <text x="32" y="922" class="lane-h" style="fill:#cf222e">设备和内存</text>
  <g id="app" class="node" tabindex="0" role="button" aria-label="你的进程">
  <rect x="40" y="150" width="300" height="150" rx="6" class="user"/>
  <text x="52" y="174" class="t">你的进程</text>
  <text x="52" y="192" class="s" style="white-space:pre">read / write：读写文件</text>
  <text x="52" y="210" class="s" style="white-space:pre">send / recv：收发网络数据</text>
  <text x="52" y="228" class="s" style="white-space:pre">mmap：把文件映射进地址空间</text>
  <text x="52" y="246" class="s" style="white-space:pre">每一个都是一次系统调用</text>
  <text x="52" y="264" class="tag"><a href="/maps/process-map.zh.html" target="_blank" rel="noopener"><tspan>进程地图</tspan></a></text>
  </g>
  <g id="ubuf" class="node" tabindex="0" role="button" aria-label="用户缓冲区 buf">
  <rect x="370" y="150" width="270" height="150" rx="6" class="user"/>
  <text x="382" y="174" class="t">用户缓冲区 buf</text>
  <text x="382" y="192" class="s" style="white-space:pre">你自己分配的内存：栈上、堆上</text>
  <text x="382" y="210" class="s" style="white-space:pre">read / recv：内核把数据拷进来</text>
  <text x="382" y="228" class="s" style="white-space:pre">write / send：内核从这里拷走</text>
  <text x="382" y="246" class="tag"><a href="/maps/process-map.zh.html" target="_blank" rel="noopener"><tspan>进程地图：栈、堆</tspan></a></text>
  </g>
  <g id="umap" class="node" tabindex="0" role="button" aria-label="mmap 映射区">
  <rect x="670" y="150" width="270" height="150" rx="6" class="user"/>
  <text x="682" y="174" class="t">mmap 映射区</text>
  <text x="682" y="192" class="s" style="white-space:pre">页缓存里的页直接映射进来</text>
  <text x="682" y="210" class="s" style="white-space:pre">读写就是普通的访存，不拷贝</text>
  <text x="682" y="228" class="s" style="white-space:pre">第一次碰一页要缺页</text>
  <text x="682" y="246" class="tag"><a href="/maps/process-map.zh.html" target="_blank" rel="noopener"><tspan>进程地图：mmap 区</tspan></a></text>
  </g>
  <g id="models" class="node" tabindex="0" role="button" aria-label="IO 模型：等数据的时候，线程在干什么">
  <rect x="980" y="140" width="580" height="180" rx="6" class="note"/>
  <text x="992" y="164" class="t">IO 模型：等数据的时候，线程在干什么</text>
  <text x="992" y="182" class="s" style="white-space:pre">阻塞：数据没好，线程睡在 read / recv 里</text>
  <text x="992" y="200" class="s" style="white-space:pre">非阻塞：数据没好，立刻返回 EAGAIN，过会儿再试</text>
  <text x="992" y="218" class="s" style="white-space:pre">IO 多路复用（select / poll / epoll）：一个线程等很多 fd，读还是自己读</text>
  <text x="992" y="236" class="s" style="white-space:pre">异步（io_uring）：把“读到 buf 里”交给内核，读完了再通知你</text>
  <text x="992" y="254" class="s" style="white-space:pre">前三种都是同步 IO：把数据拷进 buf 这一步，是你的线程在等</text>
  <text x="992" y="272" class="tag"><a href="/zh/ref/epoll-internals/" target="_blank" rel="noopener"><tspan>epoll：红黑树、就绪链表和回调</tspan></a></text>
  </g>
  <g id="vfs" class="node" tabindex="0" role="button" aria-label="VFS（虚拟文件系统）">
  <rect x="40" y="390" width="300" height="110" rx="6" class="file"/>
  <text x="52" y="414" class="t">VFS（虚拟文件系统）</text>
  <text x="52" y="432" class="s" style="white-space:pre">按 fd 找到打开的文件</text>
  <text x="52" y="450" class="s" style="white-space:pre">再交给具体的文件系统（ext4、xfs……）</text>
  </g>
  <g id="pcache" class="node" tabindex="0" role="button" aria-label="页缓存（page cache）">
  <rect x="40" y="530" width="300" height="150" rx="6" class="file"/>
  <text x="52" y="554" class="t">页缓存（page cache）</text>
  <text x="52" y="572" class="s" style="white-space:pre">读过、写过的文件内容，按页缓存在内存里</text>
  <text x="52" y="590" class="s" style="white-space:pre">read 命中就直接拷，不碰磁盘</text>
  <text x="52" y="608" class="s" style="white-space:pre">write 写到这里、标成脏页就返回</text>
  <text x="52" y="626" class="s" style="white-space:pre">free 命令里的 buff/cache 主要就是它</text>
  </g>
  <g id="flush" class="node" tabindex="0" role="button" aria-label="回写线程（writeback）">
  <rect x="370" y="710" width="250" height="110" rx="6" class="file"/>
  <text x="382" y="734" class="t">回写线程（writeback）</text>
  <text x="382" y="752" class="s" style="white-space:pre">脏页过一会写回磁盘</text>
  <text x="382" y="770" class="s" style="white-space:pre">默认脏了约 30 s 必写，每 5 s 查一次</text>
  <text x="382" y="788" class="s" style="white-space:pre">fsync：等这个文件写完才返回</text>
  </g>
  <g id="blk" class="node" tabindex="0" role="button" aria-label="块设备层 + 磁盘驱动">
  <rect x="40" y="710" width="300" height="110" rx="6" class="file"/>
  <text x="52" y="734" class="t">块设备层 + 磁盘驱动</text>
  <text x="52" y="752" class="s" style="white-space:pre">把要读写的页组成请求，排队、合并</text>
  <text x="52" y="770" class="s" style="white-space:pre">交给 NVMe 驱动，发给磁盘</text>
  </g>
  <g id="sock" class="node" tabindex="0" role="button" aria-label="socket 缓冲区">
  <rect x="670" y="390" width="300" height="150" rx="6" class="net"/>
  <text x="682" y="414" class="t">socket 缓冲区</text>
  <text x="682" y="432" class="s" style="white-space:pre">接收缓冲：收到了、还没被 recv 的数据</text>
  <text x="682" y="450" class="s" style="white-space:pre">发送缓冲：send 拷进来、对方还没确认的</text>
  <text x="682" y="468" class="s" style="white-space:pre">满了：send 阻塞，或返回 EAGAIN</text>
  </g>
  <g id="epollk" class="node" tabindex="0" role="button" aria-label="epoll：就绪通知">
  <rect x="1010" y="390" width="550" height="150" rx="6" class="net"/>
  <text x="1022" y="414" class="t">epoll：就绪通知</text>
  <text x="1022" y="432" class="s" style="white-space:pre">socket 收到数据，回调把它挂上 epoll 的就绪链表，</text>
  <text x="1022" y="450" class="s" style="white-space:pre">再叫醒睡在 epoll_wait 里的线程</text>
  <text x="1022" y="468" class="s" style="white-space:pre">只通知“可以读了”，数据还得你自己 recv</text>
  <text x="1022" y="486" class="tag"><a href="/zh/ref/epoll-internals/" target="_blank" rel="noopener"><tspan>epoll：红黑树、就绪链表和回调</tspan></a></text>
  </g>
  <g id="tcp" class="node" tabindex="0" role="button" aria-label="TCP/IP 协议栈">
  <rect x="670" y="570" width="300" height="110" rx="6" class="net"/>
  <text x="682" y="594" class="t">TCP/IP 协议栈</text>
  <text x="682" y="612" class="s" style="white-space:pre">收：校验、去包头，按 IP 和端口找到 socket</text>
  <text x="682" y="630" class="s" style="white-space:pre">发：分段、等确认、丢了重传</text>
  </g>
  <g id="drv" class="node" tabindex="0" role="button" aria-label="网卡驱动 + 收发环">
  <rect x="670" y="710" width="300" height="110" rx="6" class="net"/>
  <text x="682" y="734" class="t">网卡驱动 + 收发环</text>
  <text x="682" y="752" class="s" style="white-space:pre">收：软中断（NAPI）一次取一批包</text>
  <text x="682" y="770" class="s" style="white-space:pre">发：把包挂到发送环，通知网卡</text>
  </g>
  <g id="zc" class="node" tabindex="0" role="button" aria-label="零拷贝：把文件发到网络上">
  <rect x="1010" y="570" width="550" height="250" rx="6" class="note"/>
  <text x="1022" y="594" class="t">零拷贝：把文件发到网络上</text>
  <text x="1022" y="612" class="s" style="white-space:pre">read + write：</text>
  <text x="1022" y="630" class="s" style="white-space:pre">  磁盘 → 页缓存（DMA）→ buf（CPU）→ socket 缓冲（CPU）→ 网卡（DMA）</text>
  <text x="1022" y="648" class="s" style="white-space:pre">  4 次拷贝，4 次用户态、内核态切换</text>
  <text x="1022" y="666" class="s" style="white-space:pre">mmap + write：页缓存直接映射进来，省掉拷进 buf 那一次</text>
  <text x="1022" y="684" class="s" style="white-space:pre">sendfile：数据不出内核，页缓存 → 网卡</text>
  <text x="1022" y="702" class="s" style="white-space:pre">  网卡支持分散收集 DMA 时，CPU 一次都不拷，只剩 2 次 DMA、2 次切换</text>
  <text x="1022" y="720" class="s" style="white-space:pre">splice：在两个 fd 之间搬，中间经过一个管道，也不拷进用户态</text>
  </g>
  <g id="disk" class="node" tabindex="0" role="button" aria-label="磁盘（NVMe SSD）">
  <rect x="40" y="940" width="300" height="130" rx="6" class="dev"/>
  <text x="52" y="964" class="t">磁盘（NVMe SSD）</text>
  <text x="52" y="982" class="s" style="white-space:pre">一次随机读约 10–100 µs</text>
  <text x="52" y="1000" class="s" style="white-space:pre">机械硬盘要几 ms</text>
  <text x="52" y="1018" class="s" style="white-space:pre">做完用 DMA 写进内存，再发中断</text>
  <text x="52" y="1036" class="tag"><a href="/maps/hardware-map.zh.html" target="_blank" rel="noopener"><tspan>硬件地图：外部设备</tspan></a></text>
  </g>
  <g id="mem" class="node" tabindex="0" role="button" aria-label="内存（DRAM）">
  <rect x="380" y="940" width="250" height="130" rx="6" class="dev"/>
  <text x="392" y="964" class="t">内存（DRAM）</text>
  <text x="392" y="982" class="s" style="white-space:pre">页缓存、socket 缓冲、收发环</text>
  <text x="392" y="1000" class="s" style="white-space:pre">其实都是内存里的页</text>
  <text x="392" y="1018" class="s" style="white-space:pre">DMA：设备直接读写内存，不占 CPU</text>
  <text x="392" y="1036" class="tag"><a href="/maps/hardware-map.zh.html#load" target="_blank" rel="noopener"><tspan>硬件地图：内存控制器 → 通道</tspan></a></text>
  </g>
  <g id="nic" class="node" tabindex="0" role="button" aria-label="网卡（NIC）">
  <rect x="670" y="940" width="300" height="130" rx="6" class="dev"/>
  <text x="682" y="964" class="t">网卡（NIC）</text>
  <text x="682" y="982" class="s" style="white-space:pre">收：DMA 写进收包环，再发中断</text>
  <text x="682" y="1000" class="s" style="white-space:pre">发：DMA 从发送环读出来发走</text>
  <text x="682" y="1018" class="s" style="white-space:pre">同一机房往返约几十 µs</text>
  <text x="682" y="1036" class="tag"><a href="/maps/hardware-map.zh.html" target="_blank" rel="noopener"><tspan>硬件地图：网卡 → 中断 → 某个核</tspan></a></text>

<script>
const DATA = {"nodes": {"app": {"title": "你的进程", "lines": ["程序碰文件和网络，都要通过系统调用请内核去做：read、write 读写文件，send、recv 收发 socket 数据，mmap 把文件映射进自己的地址空间。", "系统调用是同一个线程从用户态切到内核态，一次来回约 100 ns 到几百 ns；数据没好、线程要睡下去等，才会切换线程，要几 µs。"], "tags": [[["进程地图", "/maps/process-map.zh.html"]]]}, "ubuf": {"title": "用户缓冲区 buf", "lines": ["read(fd, buf, n) 里的 buf：一块你自己的内存，在栈上或堆上。", "read、recv 把数据从内核的缓冲区拷进 buf；write、send 把 buf 里的数据拷进内核的缓冲区。这两次拷贝都是 CPU 在做，数据大时就是一笔实打实的开销。"], "tags": [[["进程地图：栈、堆", "/maps/process-map.zh.html"]]]}, "umap": {"title": "mmap 映射区", "lines": ["mmap 一个文件，内核在进程的 mmap 区登记一段地址；第一次访问某一页时缺页，内核把页缓存里那一页直接填进页表。", "之后读写这段内存就是读写页缓存本身，不经过 read、write，也没有拷进拷出。写过的页同样是脏页，由回写线程写回磁盘；msync 可以强制写回。"], "tags": [[["进程地图：mmap 区", "/maps/process-map.zh.html"]]]}, "models": {"title": "IO 模型：等数据的时候，线程在干什么", "lines": ["阻塞和非阻塞问的是：数据还没好时，这次调用等不等。同步和异步问的是：把数据从内核拷进你的 buf，是不是你的线程自己调用、自己等着做完。", "阻塞、非阻塞、IO 多路复用都是同步 IO：epoll 只告诉你哪些 fd 现在去读不会卡住，读还得自己调 recv。异步 IO 是把整件事交给内核，内核把数据拷进 buf 以后再通知你，Linux 上是 io_uring。"], "tags": [[["epoll：红黑树、就绪链表和回调", "/zh/ref/epoll-internals/"]]]}, "vfs": {"title": "VFS（虚拟文件系统）", "lines": ["fd 只是进程打开文件表里的一个下标。VFS 按它找到打开的文件，再把读写交给具体的文件系统（ext4、xfs……），由文件系统算出数据在磁盘的哪些块上。", "socket、管道也挂在同一套接口下，所以它们也能用 read、write、close，也能被 epoll 关注。"], "tags": []}, "pcache": {"title": "页缓存（page cache）", "lines": ["内核把读过、写过的文件内容按页（4 KiB）留在内存里，这就是页缓存。同一个文件第二次读，多半直接命中，不碰磁盘。", "write 也只是把数据拷进页缓存、标成脏页就返回，真正写到磁盘是之后的事。所以 write 返回不代表数据落盘，断电会丢。", "空闲内存都会被拿来当页缓存，内存紧张时再回收干净的页。free 命令里 buff/cache 那一栏大，不代表内存不够用。"], "tags": []}, "flush": {"title": "回写线程（writeback）", "lines": ["内核的回写线程定期把脏页写回磁盘：默认每 5 s 醒来一次，脏了超过约 30 s 的页一定写回；脏页占内存的比例太高时，写文件的线程会被拖住，帮着写。", "要确定数据落盘，调 fsync（或 fdatasync）：它等这个文件的脏页都写到磁盘、磁盘也确认了才返回，所以很慢，几百 µs 到几十 ms。数据库提交事务时就要 fsync。"], "tags": []}, "blk": {"title": "块设备层 + 磁盘驱动", "lines": ["页缓存没命中，或者要回写脏页时，文件系统算出磁盘块号，块设备层把这些块组成请求，排队、合并相邻的请求，再交给磁盘驱动。", "NVMe 盘有多条提交队列，每个核一条，请求直接放进队列，磁盘做完用中断通知。"], "tags": []}, "sock": {"title": "socket 缓冲区", "lines": ["每个 TCP socket 有两块内核缓冲区。接收缓冲放已经收到、还没被 recv 取走的数据；发送缓冲放 send 拷进来、还没被对方确认收到的数据。", "send 返回只代表数据拷进了发送缓冲，不代表对方收到，更不代表对方的程序读到了。发送缓冲满了（对方读得慢、网络慢），阻塞的 socket 上 send 会睡，非阻塞的返回 EAGAIN。", "接收缓冲满了，TCP 会把接收窗口告诉对方为 0，让对方停发，这就是流量控制。"], "tags": []}, "epollk": {"title": "epoll：就绪通知", "lines": ["epoll 登记一个 socket 时，在它的等待队列上挂了一个回调。数据进了接收缓冲，回调就把这个 socket 挂上 epoll 的就绪链表，再叫醒睡在 epoll_wait 里的线程。", "epoll 只负责告诉你“可以读了”，数据还在接收缓冲里，要你自己调 recv 拷出来。"], "tags": [[["epoll：红黑树、就绪链表和回调", "/zh/ref/epoll-internals/"]]]}, "tcp": {"title": "TCP/IP 协议栈", "lines": ["收包时，协议栈校验 IP 和 TCP 头，按（源 IP，源端口，目的 IP，目的端口）找到对应的 socket，把数据按序号放进接收缓冲，并回 ACK。", "发包时，按对方的接收窗口和拥塞窗口把发送缓冲里的数据切成段发出去；收到 ACK 才把那部分从发送缓冲里删掉，超时没确认就重传。"], "tags": []}, "drv": {"title": "网卡驱动 + 收发环", "lines": ["网卡和驱动之间用内存里的环形队列交接：收包环里放着空的缓冲区，网卡收到包就用 DMA 写进去；发送环里放着要发的包，网卡用 DMA 读出来发走。", "收到包，网卡发中断。中断处理只做一点点，真正的活交给软中断：NAPI 一次从收包环里取一批包往上送；包多的时候先关掉中断改成轮询，省得每个包都打断一次 CPU。"], "tags": []}, "zc": {"title": "零拷贝：把文件发到网络上", "lines": ["静态文件服务器、Kafka 这类要把文件原样发出去的程序，用 read + write 要走四次拷贝：磁盘到页缓存、页缓存到 buf、buf 到 socket 缓冲、socket 缓冲到网卡。中间两次是 CPU 在搬，而且数据根本没被程序看过。", "sendfile(out_fd, in_fd, …) 让内核直接把页缓存里的数据交给 socket。网卡支持分散收集（scatter-gather）DMA 时，socket 缓冲里只放页的地址和长度，网卡直接从页缓存读，CPU 一个字节都不拷，这就是“零拷贝”。", "零拷贝省的是 CPU 拷贝和切换次数，DMA 那两次省不掉。"], "tags": []}, "disk": {"title": "磁盘（NVMe SSD）", "lines": ["NVMe SSD 一次随机读约 10–100 µs，机械硬盘要寻道，约几 ms。比内存慢几百到几万倍，所以页缓存命中与否，决定了一次 read 是微秒还是毫秒。", "磁盘不经过 CPU，用 DMA 把数据直接写进内存里的页缓存，做完发中断告诉内核。"], "tags": [[["硬件地图：外部设备", "/maps/hardware-map.zh.html"]]]}, "mem": {"title": "内存（DRAM）", "lines": ["图上内核里的页缓存、socket 缓冲、网卡的收发环，物理上都是内存里的页。DMA 让磁盘和网卡直接读写这些页，CPU 只在拷贝（比如拷进你的 buf）时才动手。", "CPU 去读刚被 DMA 写进来的数据，走的就是硬件地图上那条 load 的路。"], "tags": [[["硬件地图：内存控制器 → 通道", "/maps/hardware-map.zh.html#load"]]]}, "nic": {"title": "网卡（NIC）", "lines": ["网卡收到包，用 DMA 写进内存里的收包环，再发中断；要发的包，驱动挂到发送环上，网卡用 DMA 读出来发走。", "中断交给哪个核处理，软中断、协议栈和唤醒就在哪个核上跑。多队列网卡按连接把包分到不同的队列，每个队列的中断交给不同的核。"], "tags": [[["硬件地图：网卡 → 中断 → 某个核", "/maps/hardware-map.zh.html"]]]}}, "ui": {"page_title": "IO 地图", "lead": "点一个框看它做什么、在哪篇讲过；选一条路径，一步一步看一次 read、一次 recv、一次 sendfile 怎么走。蓝字可以直接点开对应的文章或地图。", "other_lang": ["进程地图", "/maps/process-map.zh.html"], "static": ["静态图", "/images/ref/io-map.zh.svg"], "ref": ["速查页", "/zh/ref/cpp-linux/#io"], "prev": "上一步", "next": "下一步", "exit": "退出", "step": "第 {i} / {n} 步", "panel_empty": "点图里的任意一个框。", "zoom": ["看原尺寸", "适应宽度"], "panel_links": "在哪里讲过", "tours": {"read": ["读一个文件", [[["app", "e_app_vfs", "vfs"], "read(fd, buf, n)：系统调用进内核，VFS 按 fd 找到打开的文件，交给文件系统。"], [["e_vfs_pc", "pcache"], "先查页缓存。命中就直接跳到最后一步，整个 read 只要几百 ns 到几 µs。"], [["e_pc_blk", "blk", "e_blk_disk", "disk"], "没命中：块设备层组成请求，交给 NVMe 驱动。磁盘读一次约 10–100 µs，线程这时睡着。"], [["e_disk_mem", "mem"], "磁盘用 DMA 把数据直接写进内存里的页缓存，不占 CPU，写完发中断，内核把线程叫醒。"], [["e_pc_ubuf", "ubuf"], "内核把数据从页缓存拷进你的 buf，这一次是 CPU 拷贝。read 返回读到的字节数。"]]], "write": ["写一个文件", [[["app", "e_app_vfs", "vfs"], "write(fd, buf, n)：进内核，VFS 找到文件。"], [["pcache"], "数据从 buf 拷进页缓存，这一页标成脏页，write 就返回了。返回不代表落盘，这时断电数据会丢。"], [["e_pc_flush", "flush"], "回写线程过一会把脏页写回：默认每 5 s 查一次，脏了约 30 s 的一定写。"], [["e_flush_blk", "blk", "e_blk_disk", "disk"], "要确定落盘，调 fsync：等这个文件的脏页都写到磁盘、磁盘确认了才返回，几百 µs 到几十 ms。"]]], "mmap": ["映射一个文件", [[["app", "umap"], "mmap 只在进程的 mmap 区登记一段地址，还没有任何页。"], [["e_pc_umap", "pcache"], "第一次访问某一页：缺页，内核把页缓存里那一页直接填进你的页表，不拷贝。页缓存里没有，就先从磁盘读进来。"], [["umap"], "之后读写就是普通访存。写过的页同样是脏页，由回写线程写回；msync 强制写回。"]]], "recv": ["收一个包", [[["nic", "e_nic_mem", "mem"], "网卡收到包，用 DMA 写进内存里的收包环，再发中断。"], [["e_nic_drv", "drv"], "中断处理很短，真正的活交给软中断（NAPI）：一次从收包环里取一批包往上送。"], [["e_drv_tcp", "tcp"], "协议栈校验、去掉包头，按 IP 和端口找到对应的 socket，回 ACK。"], [["e_tcp_sock", "sock"], "数据放进这个 socket 的接收缓冲，唤醒等在它上面的线程。"], [["e_sock_ep", "epollk"], "如果它被 epoll 关注，回调把它挂上就绪链表，epoll_wait 返回。"], [["e_sock_ubuf", "ubuf"], "你调 recv，内核把数据从接收缓冲拷进 buf（CPU 拷贝）。"]]], "send": ["发一个包", [[["app", "e_app_sock", "sock"], "send 把 buf 里的数据拷进 socket 的发送缓冲就返回：返回只代表拷进去了，不代表对方收到。发送缓冲满了，send 就阻塞或返回 EAGAIN。"], [["tcp"], "TCP 按对方的接收窗口和拥塞窗口分段发出去，数据留在发送缓冲里，直到对方确认；超时没确认就重传。"], [["drv", "nic", "mem"], "驱动把包挂到发送环，网卡用 DMA 从内存读出来发走。"]]], "sendfile": ["把文件发到网络", [[["zc"], "要把一个文件原样发给客户端（静态文件服务器、Kafka），看两种写法各拷几次。"], [["disk", "e_disk_mem", "pcache", "e_pc_ubuf", "ubuf"], "read：磁盘 DMA 进页缓存，再由 CPU 拷进 buf。"], [["e_sock_ubuf", "sock", "drv", "nic"], "write 到 socket：CPU 再从 buf 拷进 socket 缓冲，网卡 DMA 发走。一共 4 次拷贝、4 次切换，其中两次 CPU 拷贝的数据程序根本没看过。"], [["pcache", "sock", "nic", "zc"], "sendfile：数据不出内核，socket 里只记页缓存里那些页的位置，网卡直接从页缓存 DMA。CPU 一次不拷，剩 2 次 DMA、2 次切换。"]]]}}};
const svg = document.querySelector('.map svg');
const panel = document.getElementById('panel');
const bar = document.getElementById('stepbar');
let tour = null, step = 0;
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function show(id){
  svg.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
  const n = DATA.nodes[id]; if (!n) return;
  document.getElementById(id).classList.add('sel');
  let h = '<h2>' + esc(n.title) + '</h2>' + n.lines.map(l => '<p>' + esc(l) + '</p>').join('');
  const links = [];
  n.tags.forEach(line => line.forEach(([txt, url]) => { if (url) links.push('<li><a href="' + url + '" target="_blank" rel="noopener">' + esc(txt.replace(/^ · /, '')) + '</a></li>'); }));
  if (links.length) h += '<h3>' + esc(DATA.ui.panel_links) + '</h3><ul>' + links.join('') + '</ul>';
  panel.innerHTML = h;
}
svg.querySelectorAll('.node').forEach(g => {
  g.addEventListener('click', e => { if (e.target.closest('a')) return; show(g.id); });
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(g.id); } });
});
function render(){
  svg.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.tours button[data-k]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === tour ? 'true' : 'false'));
  if (!tour) { svg.classList.remove('dim'); bar.classList.remove('on'); return; }
  const steps = DATA.ui.tours[tour][1];
  svg.classList.add('dim'); bar.classList.add('on');
  for (let i = 0; i <= step; i++) steps[i][0].forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('on'); });
  bar.querySelector('.count').textContent = DATA.ui.step.replace('{i}', step + 1).replace('{n}', steps.length);
  bar.querySelector('.cap').textContent = steps[step][1];
  bar.querySelector('.prev').disabled = step === 0;
  bar.querySelector('.next').disabled = step === steps.length - 1;
  const last = steps[step][0].map(id => document.getElementById(id)).filter(el => el && el.classList.contains('node')).pop();
  if (last) { show(last.id); last.scrollIntoView({block:'nearest', inline:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
}
document.querySelector('.tours .zoom').addEventListener('click', e => {
  const on = document.querySelector('.map').classList.toggle('full');
  e.currentTarget.setAttribute('aria-pressed', on ? 'true' : 'false');
  e.currentTarget.textContent = on ? DATA.ui.zoom[1] : DATA.ui.zoom[0];
});
document.querySelectorAll('.tours button[data-k]').forEach(b => b.addEventListener('click', () => { tour = tour === b.dataset.k ? null : b.dataset.k; step = 0; render(); }));
bar.querySelector('.prev').addEventListener('click', () => { step--; render(); });
bar.querySelector('.next').addEventListener('click', () => { step++; render(); });
bar.querySelector('.exit').addEventListener('click', () => { tour = null; render(); });
document.addEventListener('keydown', e => {
  if (!tour) return;
  const n = DATA.ui.tours[tour][1].length;
  if (e.key === 'ArrowRight' && step < n - 1) { step++; render(); }
  if (e.key === 'ArrowLeft' && step > 0) { step--; render(); }
  if (e.key === 'Escape') { tour = null; render(); }
});
const h = location.hash.slice(1);
if (DATA.ui.tours[h]) { tour = h; step = 0; render(); }
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
