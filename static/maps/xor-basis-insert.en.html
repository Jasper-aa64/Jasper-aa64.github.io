<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XOR basis insertion, step by step</title>
<link rel="icon" href="/images/logo.svg?v=20261008-rounded-brain-1">
<style>

:root { --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de; --card:#f6f8fa; --hl:#bf3989; --hlbg:#ffeff7;
  --x:#0969da; --xbg:#ddf4ff; --ok:#1a7f37; --okbg:#dafbe1; --bad:#cf222e; --badbg:#ffebe9; --piv:#8250df; --pivbg:#fbefff;
  --free:#eaeef2; --pri:#0969da; --prifg:#ffffff; --shadow:0 1px 2px rgba(31,35,40,.06); }
.dark { --bg:#17161b; --fg:#e9e7ef; --muted:#a19caf; --line:#3a3945; --card:#1f1e25; --hl:#ff7bb0; --hlbg:#3a1f2d;
  --x:#58a6ff; --xbg:#132a44; --ok:#3fb950; --okbg:#12301c; --bad:#ff7b72; --badbg:#4a1d22; --piv:#d2a8ff; --pivbg:#2e2148;
  --free:#2a2932; --pri:#58a6ff; --prifg:#0d1117; --shadow:none; }
html, body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
body { font: 15px/1.65 Segoe UI, Helvetica, Arial, sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 14px 16px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
.stage { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); overflow-x: auto; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
.seg button { border: 0; background: none; color: var(--muted); padding: 4px 14px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--bg); color: var(--fg); font-weight: 700; box-shadow: 0 0 0 1px var(--line), var(--shadow); }
.panel { box-sizing: border-box; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-left: 4px solid var(--hl); border-radius: 10px; }
.panel .ph { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.panel .badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: var(--hl); color: #fff; font-size: 12.5px; font-weight: 700; }
.panel .ptxt { margin: 6px 0 0; }
.panel.ok { border-left-color: var(--ok); } .panel.ok .badge { background: var(--ok); } .panel.ok .ptxt { color: var(--ok); }
.panel.bad { border-left-color: var(--bad); } .panel.bad .badge { background: var(--bad); } .panel.bad .ptxt { color: var(--bad); }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ib { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 14px; line-height: 1; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; box-shadow: var(--shadow); }
.ib svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ib svg .fill { fill: currentColor; stroke: none; }
.ib:hover { border-color: var(--pri); color: var(--pri); }
.ib.pri { background: var(--pri); border-color: var(--pri); color: var(--prifg); font-weight: 700; }
.ib.pri:hover { filter: brightness(1.08); color: var(--prifg); }
.ib:disabled { opacity: .38; cursor: default; filter: none; }
.ib:disabled:hover { border-color: var(--line); color: var(--fg); }
.ib.pri:disabled:hover { border-color: var(--pri); color: var(--prifg); }
.prog { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font: 13px Consolas, Menlo, monospace; white-space: nowrap; }
.prog .bar { width: 120px; height: 6px; border-radius: 999px; background: var(--free); overflow: hidden; }
.prog .bar i { display: block; height: 100%; width: 0; background: var(--pri); border-radius: 999px; transition: width .25s; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid; box-sizing: border-box; display: inline-block; }
.legend .kbd { margin-left: auto; }
kbd { font: 12px Consolas, Menlo, monospace; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--card); color: var(--fg); }
@media (max-width: 560px) { .prog { margin-left: 0; width: 100%; } .prog .bar { flex: 1; } .ib { padding: 7px 11px; } .legend .kbd { display: none; } }

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
input[type=text] { font: 14px Consolas, Menlo, monospace; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0; flex: 1 1 140px; }
input[type=text]:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px var(--xbg); }
.lab { color: var(--muted); font-size: 14px; }
.err { color: var(--bad); font-size: 13.5px; }
.queue { display: flex; flex-wrap: wrap; gap: 6px; }
.q { font: 13.5px Consolas, Menlo, monospace; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--bg); }
.q.cur { border-color: var(--x); color: var(--x); background: var(--xbg); font-weight: 700; }
.q.ok { border-color: var(--ok); color: var(--ok); }
.q.bad { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.grid { display: grid; gap: 5px; align-items: center; justify-content: center; }
.c { box-sizing: border-box; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; font: 15.5px Consolas, Menlo, monospace; border: 1px solid var(--line); background: var(--bg); transition: background .25s, border-color .25s; }
.c.h { border: 0; background: none; color: var(--muted); font-size: 12.5px; height: 20px; }
.c.h.col { color: var(--hl); font-weight: 700; }
.c.col { background: var(--hlbg); border-color: var(--hl); }
.c.piv { font-weight: 800; color: var(--piv); background: var(--pivbg); border-color: var(--piv); }
.c.e { border-style: dashed; background: none; }
.c.x { color: var(--x); background: var(--xbg); border-color: var(--x); font-weight: 700; }
.c.x.col { box-shadow: 0 0 0 2px var(--hl); }
.c.z { opacity: .35; }
.rl { font: 13.5px Consolas, Menlo, monospace; color: var(--muted); padding-right: 6px; white-space: nowrap; text-align: right; }
.rl.x { color: var(--x); font-weight: 700; }
.rv { font: 13.5px Consolas, Menlo, monospace; color: var(--muted); padding-left: 8px; white-space: nowrap; min-width: 56px; }
.rv.new { color: var(--ok); font-weight: 700; }
.sep { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 2px 0; }
.stat { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 14px; color: var(--muted); }
.stat b { color: var(--fg); font-family: Consolas, Menlo, monospace; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><span class="lab">Numbers to insert (space-separated, 0 to 255):</span><input type="text" id="inp" value="6 3 5 1" aria-label="Numbers to insert (space-separated, 0 to 255):"><button class="ib" id="apply">Use these</button><span class="err" id="err"></span></div>
  <div class="queue" id="queue"></div>
  <div class="stage"><div class="grid" id="grid"></div></div>
  <div class="panel" id="panel">
    <div class="ph"><span class="badge" id="badge"></span><span id="head"></span></div>
    <p class="ptxt" id="txt"></p>
    <div class="stat"><span>rank r = <b id="rk">0</b></span><span>reachable values: <b id="sp"></b></span></div>
  </div>
  <div class="ctl"><button class="ib" id="reset" title="Restart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.7-6.4"/><path d="M3 4v5h5"/></svg><span>Restart</span></button><button class="ib" id="prev" title="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Back</span></button><button class="ib" id="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M7 4.5v15l12.5-7.5z"/></svg><span>Play</span></button><button class="ib pri" id="next" title="Next"><span>Next</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button><div class="prog"><div class="bar"><i id="bar"></i></div><span id="cnt"></span></div></div>
  <div class="legend"><span><i style="background:var(--hlbg);border-color:var(--hl)"></i>bit being looked at</span><span><i style="background:var(--xbg);border-color:var(--x)"></i>x</span><span><i style="background:var(--pivbg);border-color:var(--piv)"></i>pivot bit (highest bit of b[i])</span><span><i style="border-color:var(--muted);border-style:dashed"></i>empty slot</span><span class="kbd"><kbd>←</kbd> <kbd>→</kbd> also step</span></div>
</div>
<script>
(function () {
  var L = {"h0": "Before we start", "hnum": "Insert number {j}: {v}", "hend": "All inserted", "empty": "empty", "many": "{c} in total", "err": "Enter 1 to 12 integers between 0 and 255", "start": "b is empty, rank 0, and the only reachable value is 0. Press Next or the right arrow key.", "take": "{v} = {bin}. x starts as this number; scan from the highest bit down.", "zero": "Bit {i} is 0, skip to the next bit.", "xor": "Bit {i} is 1 and b[{i}] = {bv} is occupied: x ^= b[{i}], {xo} ⊕ {bb} = {xn}, clearing bit {i}. This is one row operation.", "store": "Bit {i} is 1 and b[{i}] is empty: store x = {xb} in b[{i}]. Its highest bit differs from every other basis vector, so it is independent; the rank becomes {r} and the reachable values double to {c}.", "dead": "x is cleared to 0: the original {v} is an XOR of basis vectors, already in the span. The insertion fails and the space is unchanged.", "done": "Rank {r}, {c} distinct reachable values. Each of the {f} failed numbers can be written with the basis."}, UI = {"play": "Play", "pause": "Pause"};

  var root = document.documentElement;
  function theme() {
    var t = null;
    try { if (window.parent !== window) t = window.parent.document.documentElement.dataset.theme; } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    root.classList.toggle('dark', t !== 'light');
  }
  theme();
  try { if (window.parent !== window) new MutationObserver(theme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', theme);
  function fit() {
    try {
      var f = window.frameElement; if (!f) return;
      var h = Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height) + (f.offsetHeight - f.clientHeight);
      if (Math.abs(parseFloat(f.style.height || 0) - h) > 0.5) f.style.height = h + 'px';
    } catch (e) {}
  }
  var ICON_PLAY = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path class=\"fill\" d=\"M7 4.5v15l12.5-7.5z\"/></svg>", ICON_PAUSE = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect class=\"fill\" x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/><rect class=\"fill\" x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/></svg>";
  function playBtn(on) { document.getElementById('play').innerHTML = (on ? ICON_PAUSE : ICON_PLAY) + '<span>' + (on ? UI.pause : UI.play) + '</span>'; }
  function progress(k, n) {
    document.getElementById('cnt').textContent = (k + 1) + ' / ' + n;
    document.getElementById('bar').style.width = (n > 1 ? 100 * k / (n - 1) : 100) + '%';
    document.getElementById('prev').disabled = k === 0;
    document.getElementById('next').disabled = k === n - 1;
  }
  // give each element a min-height equal to its tallest state; measure(fn) must visit every state
  function lockHeights(els, visitAll) {
    els.forEach(function (el) { el.style.minHeight = ''; });
    var h = els.map(function () { return 0; });
    visitAll(function () { els.forEach(function (el, i) { h[i] = Math.max(h[i], Math.ceil(el.getBoundingClientRect().height)); }); });
    els.forEach(function (el, i) { el.style.minHeight = h[i] + 'px'; });
  }

  function fmt(s, o) { return s.replace(/\{(\w+)\}/g, function (_, k) { return o[k]; }); }

  var W = 3, nums = [], steps = [], k = 0, timer = null;
  function bin(v) { var s = v.toString(2); while (s.length < W) s = '0' + s; return s; }
  function build() {
    W = Math.max(3, Math.max.apply(null, nums.concat([1])).toString(2).length);
    var b = new Array(W).fill(0), fate = nums.map(function () { return ''; }), r = 0;
    steps = [];
    function push(o) { o.b = b.slice(); o.fate = fate.slice(); o.r = r; steps.push(o); }
    push({ x: null, col: -1, j: -1, head: L.h0, msg: L.start, cls: '' });
    nums.forEach(function (v, j) {
      var x = v, stored = false, head = fmt(L.hnum, { j: j + 1, v: v });
      push({ x: x, col: -1, j: j, head: head, msg: fmt(L.take, { j: j + 1, v: v, bin: bin(v) }), cls: '' });
      for (var i = W - 1; i >= 0 && x; i--) {
        if (!(x >> i & 1)) { push({ x: x, col: i, j: j, head: head, msg: fmt(L.zero, { i: i }), cls: '' }); continue; }
        if (!b[i]) {
          b[i] = x; r++; fate[j] = 'ok'; stored = true;
          push({ x: null, col: i, j: j, hi: i, head: head, msg: fmt(L.store, { i: i, xb: bin(x), r: r, c: 1 << r }), cls: 'ok' });
          break;
        }
        var xo = x; x ^= b[i];
        push({ x: x, col: i, j: j, head: head, msg: fmt(L.xor, { i: i, bv: bin(b[i]), xo: bin(xo), bb: bin(b[i]), xn: bin(x) }), cls: '' });
      }
      if (!stored) {
        fate[j] = 'bad';
        push({ x: 0, col: -1, j: j, head: head, msg: fmt(L.dead, { v: v }), cls: 'bad' });
      }
    });
    push({ x: null, col: -1, j: -1, head: L.hend, msg: fmt(L.done, { r: r, c: 1 << r, f: nums.length - r }), cls: 'ok' });
  }
  function spanOf(b) {
    var vals = [0];
    b.forEach(function (v) { if (v) vals = vals.concat(vals.map(function (u) { return u ^ v; })); });
    vals.sort(function (a, c) { return a - c; });
    return vals.length <= 16 ? '{' + vals.join(', ') + '}' : fmt(L.many, { c: vals.length });
  }
  var grid = document.getElementById('grid'), queue = document.getElementById('queue'), panel = document.getElementById('panel');
  function el(cls, txt) { var d = document.createElement('div'); d.className = cls; d.textContent = txt; return d; }
  function render(quiet) {
    var s = steps[k], c, i;
    grid.style.gridTemplateColumns = 'auto repeat(' + W + ', 34px) auto';
    grid.innerHTML = '';
    grid.appendChild(el('rl', ''));
    for (c = W - 1; c >= 0; c--) grid.appendChild(el('c h' + (c === s.col ? ' col' : ''), c));
    grid.appendChild(el('rv', ''));
    grid.appendChild(el('rl x', 'x'));
    for (c = W - 1; c >= 0; c--) {
      if (s.x === null) grid.appendChild(el('c e', ''));
      else grid.appendChild(el('c x' + (c === s.col ? ' col' : '') + (s.col >= 0 && c > s.col ? ' z' : ''), s.x >> c & 1));
    }
    grid.appendChild(el('rv', s.x === null ? '' : '= ' + s.x));
    grid.appendChild(el('sep', ''));
    for (i = W - 1; i >= 0; i--) {
      grid.appendChild(el('rl', 'b[' + i + ']'));
      var bv = s.b[i];
      for (c = W - 1; c >= 0; c--) {
        if (!bv) grid.appendChild(el('c e' + (c === s.col ? ' col' : ''), ''));
        else grid.appendChild(el('c' + (c === i ? ' piv' : '') + (c === s.col ? ' col' : ''), bv >> c & 1));
      }
      grid.appendChild(el('rv' + (s.hi === i ? ' new' : ''), bv ? '= ' + bv : L.empty));
    }
    queue.innerHTML = '';
    nums.forEach(function (v, j) {
      var d = document.createElement('span');
      d.className = 'q' + (j === s.j ? ' cur' : '') + (s.fate[j] ? ' ' + s.fate[j] : '');
      d.textContent = v + ' = ' + bin(v);
      queue.appendChild(d);
    });
    document.getElementById('badge').textContent = k + 1;
    document.getElementById('head').textContent = s.head;
    document.getElementById('txt').textContent = s.msg;
    panel.className = 'panel ' + s.cls;
    document.getElementById('rk').textContent = s.r;
    document.getElementById('sp').textContent = spanOf(s.b);
    progress(k, steps.length);
    if (!quiet) fit();
  }
  function show(n) { k = Math.max(0, Math.min(steps.length - 1, n)); render(); }
  function stop() { if (timer) { clearInterval(timer); timer = null; } playBtn(false); }
  function play() {
    if (timer) { stop(); return; }
    if (k === steps.length - 1) show(0);
    playBtn(true);
    timer = setInterval(function () { if (k >= steps.length - 1) stop(); else show(k + 1); }, 1800);
  }
  function lock() {
    var save = k;
    lockHeights([panel, queue], function (measure) { for (k = 0; k < steps.length; k++) { render(true); measure(); } });
    k = save; render();
  }
  function load() {
    var parts = document.getElementById('inp').value.trim().split(/[\s,，]+/).filter(Boolean).map(Number);
    var ok = parts.length >= 1 && parts.length <= 12 && parts.every(function (v) { return Number.isInteger(v) && v >= 0 && v <= 255; });
    document.getElementById('err').textContent = ok ? '' : L.err;
    if (!ok) return;
    stop(); nums = parts; build(); k = 0; lock();
  }
  document.getElementById('prev').onclick = function () { stop(); show(k - 1); };
  document.getElementById('next').onclick = function () { stop(); show(k + 1); };
  document.getElementById('play').onclick = play;
  document.getElementById('reset').onclick = function () { stop(); show(0); };
  document.getElementById('apply').onclick = load;
  document.getElementById('inp').addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); e.stopPropagation(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { stop(); show(k + 1); }
    if (e.key === 'ArrowLeft') { stop(); show(k - 1); }
  });
  var rz = null;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(lock, 120); });
  window.addEventListener('load', lock);
  load();
})();
</script>
</body>
</html>
