:root { --bg:#f6f7f9; --card:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de; --accent:#0969da; --hl:#bf3989; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1c1a19; --card:#26231f; --fg:#ece6df; --muted:#b3aaa0; --line:#463f38; --accent:#e9a0b4; --hl:#ff7bb0; } }

* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font: 15px/1.6 PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif; -webkit-tap-highlight-color: transparent; }
header { padding: 14px 16px 10px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; }
h1 { font-size: 22px; margin: 0; }
header .lead { flex: 1 1 420px; margin:0; color:var(--muted); font-size:14px; }
header nav { display:flex; gap:12px; font-size:14px; }
a { color: var(--accent); }
.tours { display:flex; flex-wrap:wrap; gap:8px; padding: 0 16px 10px; }
.tours button, .stepbar button { font: inherit; font-size:14px; padding: 5px 12px; border-radius: 999px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
.tours button[aria-pressed="true"] { border-color: var(--hl); color: var(--hl); }
.tours .zoom { margin-left: auto; }
.map.full svg { width: 1600px; max-width: none; }
.layout { display:grid; grid-template-columns: minmax(0,1fr) 340px; gap: 12px; padding: 0 16px 16px; align-items:start; }
.map { background:#ffffff; border:1px solid var(--line); border-radius:10px; overflow:auto; max-height: calc(100vh - 140px); }
.map svg { display:block; width:100%; height:auto; min-width: 1000px; }
.side { position: sticky; top: 12px; display:flex; flex-direction:column; gap:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding: 12px 14px; }
.card h2 { font-size:17px; margin:0 0 6px; }
.card p { margin: 4px 0; color: var(--muted); font-size:14px; }
.card h3 { font-size:13px; margin:10px 0 4px; color:var(--muted); font-weight:600; }
.card ul { margin:0; padding-left: 18px; font-size:14px; }
.stepbar { display:none; }
.stepbar.on { display:block; }
.stepbar .count { font-size:13px; color:var(--muted); }
.stepbar .cap { margin: 6px 0 10px; font-size:15px; color:var(--fg); }
.stepbar .btns { display:flex; gap:8px; }
.node { cursor:pointer; outline:none; }
.node:hover > rect:first-of-type, .node:focus-visible > rect:first-of-type { stroke:#bf3989; stroke-width:2.5; }
.node.sel > rect:first-of-type { stroke:#bf3989; stroke-width:3; }
svg .tag a tspan { text-decoration: underline; text-decoration-color: rgba(9,105,218,.35); }
svg .tag a:hover tspan { fill:#bf3989; }
svg.dim .node, svg.dim .edge { opacity:.18; transition: opacity .25s; }
svg.dim .node.on, svg.dim .edge.on { opacity:1; }
svg .edge.on { stroke:#bf3989; stroke-width:3; }
svg.dim .node.on > rect:first-of-type { stroke:#bf3989; stroke-width:3; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; order: -1; }
  .map { max-height: 70vh; }
}
@media (prefers-reduced-motion: reduce) { svg.dim .node, svg.dim .edge { transition:none; } }
</style>

<script>
const DATA = {"nodes": {"a_cx": {"title": "Complexity · STL", "lines": ["Read the limits first: n up to 1e5 needs O(n log n), 1e6 needs O(n), around 20 allows exponential.", "This is the first step in interviews and contests alike; know the costs of vector, map, priority_queue and unordered_map."], "tags": []}, "a_bs": {"title": "Binary search", "lines": ["If feasibility is monotone in the answer, binary-search the answer and turn optimisation into a yes/no check.", "Stick to one style (half-open) so the boundaries never go wrong."], "tags": []}, "a_tp": {"title": "Two pointers", "lines": ["When validity is monotone in the right end, the left end only moves right as well: O(n) in total.", "Longest substring without repeats and shortest subarray with sum at least k are this pattern."], "tags": []}, "a_ps": {"title": "Prefix sums", "lines": ["Prefix sums give range sums, difference arrays give range adds, in 2D as well.", "\"How many subarrays sum to k\" is prefix sums plus a hash map."], "tags": []}, "a_st": {"title": "Monotonic stack", "lines": ["A monotonic stack finds the nearest greater or smaller element on each side; a monotonic deque gives sliding-window maxima; both amortised O(n).", "Bracket matching and expression evaluation use a plain stack."], "tags": []}, "a_hp": {"title": "Heap · hash map", "lines": ["A heap gives the running min or max, a size-K heap gives top-K; a hash map answers membership and counts.", "HFT interviews use these for de-duplicating market data and best bid/ask."], "tags": []}, "a_gr": {"title": "Sorting · greedy", "lines": ["Greedy usually starts with a sort, and an exchange argument shows that swapping never helps. Interval scheduling and merging intervals come up a lot.", "Be able to write quicksort and merge sort by hand; merge sort also counts inversions."], "tags": []}, "a_bit": {"title": "Bit tricks", "lines": ["x & -x isolates the lowest set bit; loop over the subsets of m with s = (s - 1) & m.", "XOR cancels itself, which finds the element that appears once. Bitmask DP builds on these."], "tags": []}, "a_srch": {"title": "Search", "lines": ["BFS gives shortest paths on unweighted graphs; DFS with backtracking enumerates permutations, combinations and subsets, and pruning decides whether it passes.", "Grid problems and counting islands come up a lot."], "tags": []}, "a_tree": {"title": "Trees", "lines": ["Write pre-, in-, post-order and level-order traversals without recursion too; the diameter takes two DFS passes; LCA uses binary lifting.", "Most interview tree problems come down to what the recursive function returns."], "tags": []}, "a_graph": {"title": "Shortest paths", "lines": ["Dijkstra with a heap for non-negative weights (O(m log n)), Bellman-Ford with negative ones; on a DAG, sort topologically and then DP.", "Course schedules and task dependencies are topological sorts."], "tags": []}, "a_dsu": {"title": "Union-find", "lines": ["With path compression and union by rank, each operation is almost constant time.", "Use it for connectivity as edges are added, and for Kruskal's minimum spanning tree."], "tags": []}, "a_dp1": {"title": "DP: linear, knapsack", "lines": ["Fix what a state means first, then the transitions and the base cases.", "LIS, edit distance, 0/1 and unbounded knapsack are must-know templates; compress knapsack to one dimension."], "tags": []}, "a_dp2": {"title": "DP: tree, bitmask", "lines": ["Interval DP goes by increasing length; tree DP merges subtrees on the way back up the DFS; bitmask DP encodes a set as an integer, for n up to about 20."], "tags": []}, "a_str": {"title": "Strings", "lines": ["KMP matches with the prefix function; string hashing compares substrings in O(1); a trie stores prefixes, and a bitwise 0/1 trie finds the maximum XOR."], "tags": []}, "a_design": {"title": "Design", "lines": ["Common in HFT interviews: an LRU cache (hash map + doubly linked list, O(1)), an order book (a price-ordered map with a queue per level), a sliding-window rate limiter.", "What is tested is which structure you pick and the cost of each operation."], "tags": []}, "b_seg": {"title": "Segment trees", "lines": ["Point update with range query: Fenwick tree; range update with range query, or richer information: segment tree with lazy tags.", "Think of it whenever a problem mixes many updates with many range queries."], "tags": []}, "b_bst": {"title": "Balanced BST", "lines": ["For a dynamic k-th smallest or rank, use the pb_ds tree or a hand-written treap; prefer the library in contests."], "tags": []}, "b_tree": {"title": "Advanced trees", "lines": ["Path updates and queries: heavy-light decomposition over a segment tree; an answer for every root: rerooting DP; counting paths: centroid decomposition."], "tags": []}, "b_conn": {"title": "Connectivity", "lines": ["Condense strongly connected components into a DAG and DP on it; find cut vertices and bridges; a set of either-or constraints is 2-SAT."], "tags": []}, "b_flow": {"title": "Flows · matching", "lines": ["Assignment, matching and min-cut problems become flow networks; keep one Dinic template ready. The hard part is building the graph."], "tags": []}, "b_str": {"title": "Advanced strings", "lines": ["Many patterns at once: Aho-Corasick; counting distinct substrings: the suffix automaton; longest palindromes: Manacher."], "tags": []}, "b_geo": {"title": "Geometry", "lines": ["Everything starts from the cross product: convex hull, rotating calipers, half-plane intersection. Use eps, or integers when possible."], "tags": []}, "b_game": {"title": "Games", "lines": ["Impartial games: Nim is decided by the XOR of the piles; a sum of independent games has the XOR of their Grundy values. Tabulate small cases first."], "tags": []}, "b_dc": {"title": "Divide and conquer", "lines": ["CDQ divide and conquer removes one dimension from 3D dominance counting; parallel binary search answers many binary searches together."], "tags": []}, "b_off": {"title": "Offline tricks", "lines": ["If queries can be reordered, go offline: Mo's algorithm for range queries, a sweep line with a Fenwick tree for 2D counting and rectangle union."], "tags": []}, "b_lichao": {"title": "Li Chao · Cartesian", "lines": ["A Li Chao tree (insert lines, query the max at a point) is the general tool for convex-hull-trick DP; a Cartesian tree turns range-min problems into tree problems."], "tags": []}, "b_rand": {"title": "Stress testing", "lines": ["After a hard problem, stress-test it against a brute force; it beats reading the code. Random hashing and shuffling defeat adversarial tests."], "tags": []}, "c_pow": {"title": "Fast power · gcd · exgcd", "lines": ["Fast power is O(log n); extended Euclid solves ax + by = gcd(a, b), which gives inverses and solves linear congruences.", "Be able to write them in a minute."], "tags": [[["NT #1 GCD · CRT", "/posts/number-theory-1-elementary/"]]]}, "c_inv": {"title": "Inverses · CRT · Euler", "lines": ["Mod a prime, Fermat's little theorem gives the inverse; otherwise exgcd. All inverses of 1..n come out in linear time.", "CRT merges congruences (generalised CRT when moduli share factors); the extended Euler theorem reduces huge exponents."], "tags": [[["NT #1 GCD · CRT", "/posts/number-theory-1-elementary/"]]]}, "c_sieve": {"title": "Sieves", "lines": ["The linear sieve finds primes in O(n) and computes multiplicative functions such as φ, μ and the divisor count on the way; it covers precomputation up to about 1e7."], "tags": [[["NT #3 sieve → Möbius", "/posts/number-theory-3-sieve-mobius-inclusion-exclusion/"]]]}, "c_mult": {"title": "Multiplicative · Dirichlet", "lines": ["Dirichlet convolution ties these functions together: μ * 1 = ε, φ * 1 = id, 1 * 1 = d. Derivations substitute with these identities."], "tags": [[["NT #2 multiplicative", "/posts/number-theory-2-multiplicative-functions/"]]]}, "c_mob": {"title": "Möbius · floor blocks", "lines": ["For ∑∑[gcd(i, j) = 1] or ∑ gcd(i, j), replace the condition with [n = 1] = ∑_{d | n} μ(d) and swap the order of summation.", "What remains, ⌊n / d⌋, takes only O(√n) values, so sum block by block. It is inclusion-exclusion over divisors (see the counting lane)."], "tags": [[["NT #2-ex Möbius", "/posts/number-theory-2-ex-mobius-techniques/"]], [["NT #1.1 floor blocks", "/posts/number-theory-1-1-divisibility-blocking/"]]]}, "c_dujiao": {"title": "Du's sieve · Min_25", "lines": ["A linear sieve stops around 1e7. Beyond that, Du's sieve recurses on prefix sums through a Dirichlet convolution in O(n^{2/3}); Min_25 handles multiplicative functions that are easy at primes."], "tags": [[["NT #4 Min_25 · Du", "/posts/number-theory-4-min25-du-jiao-sieve/"]]]}, "c_root": {"title": "Primitive roots · BSGS", "lines": ["A primitive root turns multiplication into addition of exponents; baby-step giant-step solves a^x ≡ b (mod p) in O(√p).", "The primitive root 3 of 998244353 is the one NTT uses."], "tags": [[["C #2.2 roots · NTT", "/posts/combinatorics-2-2-primitive-roots-ntt/"]]]}, "c_mr": {"title": "Miller-Rabin · rho", "lines": ["Miller-Rabin tests numbers up to 1e18 (a fixed set of 7 bases makes it deterministic) and Pollard rho factors them; use __int128 for the products."], "tags": [[["NT #4 Miller-Rabin · rho", "/posts/number-theory-4-primality-factorisation-residues/"]]]}, "c_qr": {"title": "Square roots · Lucas", "lines": ["Cipolla solves x² ≡ a (mod p); Lucas's theorem computes binomials mod a small prime when n is huge, and the generalised version handles composite moduli."], "tags": [[["NT #4 Miller-Rabin · rho", "/posts/number-theory-4-primality-factorisation-residues/"]]]}, "c_ntfact": {"title": "Handy facts", "lines": ["Legendre's formula gives the power of p in n!; numbers below 1e9 have at most 1344 divisors and below 1e18 about 1e5, which decides whether enumerating divisors is feasible."], "tags": [[["NT #0 common formulae", "/posts/number-theory-0-common-formulae/"]]]}, "c_cnt": {"title": "Binomials mod p", "lines": ["Precompute n! and its inverse for O(1) binomials. Needs: inverses (number theory lane).", "Recognise stars and bars, multiset permutations and derangements at a glance."], "tags": [[["C #1.1 binomials", "/posts/combinatorics-1-1-permutations-combinations/"]], [["C #0 formulae", "/posts/combinatorics-0-common-formulae-conclusions/"]]]}, "c_ie": {"title": "Inclusion-exclusion", "lines": ["For counts with many restrictions, count without them and add or subtract by the set of restrictions violated.", "Bounded solutions of linear equations and derangements are the template problems."], "tags": [[["C #1.2 inclusion-exclusion", "/posts/combinatorics-1-2-inclusion-exclusion-diophantine-derangements/"]]]}, "c_binv": {"title": "Binomial inversion", "lines": ["The algebraic form of inclusion-exclusion: from g(k) = ∑ C(i, k) f(i) you can solve back for f.", "Min-max inversion gives the expected time until everything has appeared."], "tags": []}, "c_gf": {"title": "Generating functions", "lines": ["Put a counting sequence into a power series: choosing from several kinds of items multiplies their generating functions.", "Unlabelled objects use ordinary generating functions; labelled ones (arrangements) use exponential ones."], "tags": [[["C #3.1 OGF", "/posts/combinatorics-3-1-ordinary-generating-functions/"]]]}, "c_ntt": {"title": "FFT · NTT", "lines": ["Polynomial multiplication drops from O(n²) to O(n log n). Mod 998244353 use NTT, which is exact; for arbitrary moduli use three-modulus NTT or split FFT.", "Needs: primitive roots (number theory lane)."], "tags": [[["C #2.1 FFT", "/posts/combinatorics-2-1-fft-lagrange-interpolation/"]], [["C #2.2 roots · NTT", "/posts/combinatorics-2-2-primitive-roots-ntt/"]]]}, "c_poly": {"title": "Polynomial toolkit", "lines": ["With NTT, division, logarithm and exponential of power series are all O(n log n). Use templates in contests; the skill is reducing the problem to \"the n-th coefficient of some generating function\"."], "tags": [[["C #3.2 power series", "/posts/combinatorics-3-2-more-operations-on-formal-power-series/"]]]}, "c_model": {"title": "Balls into boxes", "lines": ["Whether balls and boxes are distinguishable and whether boxes may be empty gives twelve cases, each with its formula (binomials, Stirling numbers, partitions).", "Catalan numbers count bracket sequences, stack orders and binary trees."], "tags": []}, "c_polya": {"title": "Pólya · Burnside", "lines": ["When colourings equal under rotation or reflection count once, Burnside averages the fixed points over the group. Necklace counting is the template."], "tags": []}, "c_prob": {"title": "Probability · expectation", "lines": ["Split an expectation into a sum by linearity; expectation DP usually runs backwards from the end. Fractions are printed modulo p with inverses."], "tags": []}, "c_fwt": {"title": "FWT · SOS", "lines": ["Convolutions where indices combine by a bitwise operation use FWT; sums over all subsets (high-dimensional prefix sums) use SOS DP in O(n·2^n)."], "tags": []}, "c_mpow": {"title": "Matrix fast power", "lines": ["A recurrence where each term depends on the previous k (Fibonacci, counting DPs with a short memory) becomes a k × k matrix raised to the n-th power, for n up to 1e18."], "tags": [[["M #1 fast power · Kitamasa", "/posts/matrix-1-fast-exponentiation/"]]]}, "c_semi": {"title": "DP semirings", "lines": ["Swap multiplication for addition and addition for min, and matrix power computes shortest walks of exactly k steps; boolean matrices give reachability."], "tags": [[["M #1 fast power · Kitamasa", "/posts/matrix-1-fast-exponentiation/"]]]}, "c_gauss": {"title": "Gaussian elimination", "lines": ["Solves linear systems in O(n³); mod p, division becomes multiplication by an inverse; XOR systems speed up with bitset.", "Detect inconsistency and count free variables: the number of solutions is p to that power."], "tags": [[["M #2 Gaussian elimination", "/posts/matrix-2-gaussian-elimination/"]]]}, "c_det": {"title": "Determinants", "lines": ["The determinant is the product of the diagonal after elimination to triangular form; for a composite modulus, eliminate with a Euclid-style exchange between rows."], "tags": []}, "c_mtt": {"title": "Matrix-tree · LGV", "lines": ["The number of spanning trees is a cofactor of the Laplacian; the LGV lemma turns counting non-intersecting path systems into a determinant."], "tags": []}, "c_bm": {"title": "BM · Kitamasa", "lines": ["When the recurrence is unknown, Berlekamp-Massey recovers it from the first 2k terms; for large k, the characteristic polynomial (Kitamasa) cuts O(k³ log n) to O(k² log n), and NTT goes further."], "tags": [[["M #1 fast power · Kitamasa", "/posts/matrix-1-fast-exponentiation/"]]]}, "c_mprob": {"title": "Matrix problems", "lines": ["Range add with range Fibonacci sums: each segment-tree node stores a matrix, and so does the lazy tag."], "tags": [[["M #4 problems", "/posts/matrix-4-problems/"]]]}, "c_basis": {"title": "Linear basis", "lines": ["The XORs of all subsets form a vector space; a linear basis (at most 64 numbers) answers the maximum XOR, whether x is reachable, and the k-th smallest."], "tags": [[["M #3 linear basis", "/posts/matrix-3-linear-basis/"]]]}}, "ui": {"page_title": "Algorithm Map", "lead": "Click a box to see what it solves and when to reach for it. Pick a route to step through what to learn first. Blue labels open the notes.", "other_lang": ["中文", "algo-map.zh.html"], "static": ["Static image", "/images/algo/algo-map.en.svg"], "ref": ["Algorithms", "/algo/"], "prev": "Back", "next": "Next", "exit": "Exit", "step": "Step {i} of {n}", "panel_empty": "Click any box in the map.", "zoom": ["Actual size", "Fit width"], "panel_links": "Notes on this site", "tours": {"interview": ["Interview route", [[["a_cx"], "Start with \"read the limits, pick the complexity\", and learn the costs of the STL containers. Every problem starts here."], [["a_bs", "a_tp", "a_ps"], "The array trio: binary search, two pointers, prefix sums. Most interview problems combine them."], [["a_st", "a_hp", "a_gr", "a_bit"], "Stacks, heaps, hash maps, sorting and greedy, bit tricks: pick the right container and the complexity follows."], [["a_srch", "a_tree", "a_graph", "a_dsu"], "Search, trees, graphs, union-find: make recursion and BFS automatic, and decide what a recursive call returns."], [["a_dp1", "a_dp2"], "DP: write down what a state means before anything else; the transition follows."], [["a_str", "a_design"], "Finish with strings and design. HFT interviews often end on design: LRU, order book, rate limiter."]]], "nt": ["Number theory line", [[["c_pow"], "Start with fast power, gcd and exgcd: every later box uses them."], [["e_c_pow_c_inv", "c_inv"], "Inverses and CRT: division and merging congruences mod m. Primitive roots hang off here."], [["e_c_inv_c_sieve", "c_sieve"], "The linear sieve: primes in O(n), multiplicative functions on the way."], [["e_c_sieve_c_mult", "c_mult"], "Multiplicative functions and Dirichlet convolution: the identities used in derivations."], [["e_c_mult_c_mob", "c_mob"], "Möbius inversion with floor blocks: the standard contest route for sums over gcd; derive it on the spot."], [["e_c_mob_c_dujiao", "c_dujiao"], "n up to 1e10: Du's sieve and Min_25."]]], "comb": ["Counting line", [[["c_cnt"], "Binomials mod p: precompute factorials and inverse factorials. Classic models (balls into boxes, Catalan) hang off here."], [["e_c_cnt_c_ie", "c_ie"], "Inclusion-exclusion: add and subtract by the set of violated restrictions."], [["e_c_ie_c_binv", "c_binv"], "Binomial inversion: trade \"exactly k\" for \"at least k\"."], [["e_c_binv_c_gf", "c_gf"], "Generating functions: \"pick some of each to reach a total\" becomes a product of polynomials."], [["e_c_gf_c_ntt", "c_ntt"], "NTT makes that product O(n log n)."], [["e_c_ntt_c_poly", "c_poly"], "The polynomial toolkit: inverse, ln, exp. The skill is reducing to \"the n-th coefficient\"."]]], "la": ["Linear algebra line", [[["c_mpow"], "Matrix fast power: linear recurrences for n up to 1e18. If the recurrence is unknown, BM recovers it."], [["e_c_mpow_c_semi", "c_semi"], "DP semirings: swap (+, ×) for (min, +) to get shortest walks of exactly k steps."], [["e_c_semi_c_gauss", "c_gauss"], "Gaussian elimination over reals, mod p and XOR; XOR systems lead to the linear basis."], [["e_c_gauss_c_det", "c_det"], "Determinants: eliminate to triangular form."], [["e_c_det_c_mtt", "c_mtt"], "Matrix-tree theorem and LGV: determinants in counting problems."]]], "signals": ["Contest signals", [[["c_mob", "c_dujiao"], "A sum over gcd or a [gcd = 1] condition: Möbius inversion removes it, floor blocks sum it; for n up to 1e10 add Du's sieve."], [["c_ie", "c_binv"], "Counting with \"none of them may...\": inclusion-exclusion; \"exactly k\": count \"at least k\", then invert."], [["c_gf", "c_ntt", "c_poly"], "\"Choose some of each kind to total n\", with n up to 1e5: multiply generating functions with NTT."], [["c_mpow", "c_bm"], "n up to 1e18 and each term depends on a few before it: matrix fast power; unknown recurrence: BM."], [["c_gauss", "c_basis"], "Switches, XOR, equations mod 2: Gaussian elimination or a linear basis."]]]}}};
const svg = document.querySelector('.map svg');
const panel = document.getElementById('panel');
const bar = document.getElementById('stepbar');
let tour = null, step = 0;
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function show(id){
  svg.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
  const n = DATA.nodes[id]; if (!n) return;
  document.getElementById(id).classList.add('sel');
  let h = '<h2>' + esc(n.title) + '</h2>' + n.lines.map(l => '<p>' + esc(l) + '</p>').join('');
  const links = [];
  n.tags.forEach(line => line.forEach(([txt, url]) => { if (url) links.push('<li><a href="' + url + '" target="_blank" rel="noopener">' + esc(txt.replace(/^ · /, '')) + '</a></li>'); }));
  if (links.length) h += '<h3>' + esc(DATA.ui.panel_links) + '</h3><ul>' + links.join('') + '</ul>';
  panel.innerHTML = h;
}
svg.querySelectorAll('.node').forEach(g => {
  g.addEventListener('click', e => { if (e.target.closest('a')) return; show(g.id); });
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(g.id); } });
});
function render(){
  svg.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.tours button[data-k]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === tour ? 'true' : 'false'));
  if (!tour) { svg.classList.remove('dim'); bar.classList.remove('on'); return; }
  const steps = DATA.ui.tours[tour][1];
  svg.classList.add('dim'); bar.classList.add('on');
  for (let i = 0; i <= step; i++) steps[i][0].forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('on'); });
  bar.querySelector('.count').textContent = DATA.ui.step.replace('{i}', step + 1).replace('{n}', steps.length);
  bar.querySelector('.cap').textContent = steps[step][1];
  bar.querySelector('.prev').disabled = step === 0;
  bar.querySelector('.next').disabled = step === steps.length - 1;
  const last = steps[step][0].map(id => document.getElementById(id)).filter(el => el && el.classList.contains('node')).pop();
  if (last) { show(last.id); last.scrollIntoView({block:'nearest', inline:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
}
document.querySelector('.tours .zoom').addEventListener('click', e => {
  const on = document.querySelector('.map').classList.toggle('full');
  e.currentTarget.setAttribute('aria-pressed', on ? 'true' : 'false');
  e.currentTarget.textContent = on ? DATA.ui.zoom[1] : DATA.ui.zoom[0];
});
document.querySelectorAll('.tours button[data-k]').forEach(b => b.addEventListener('click', () => { tour = tour === b.dataset.k ? null : b.dataset.k; step = 0; render(); }));
bar.querySelector('.prev').addEventListener('click', () => { step--; render(); });
bar.querySelector('.next').addEventListener('click', () => { step++; render(); });
bar.querySelector('.exit').addEventListener('click', () => { tour = null; render(); });
document.addEventListener('keydown', e => {
  if (!tour) return;
  const n = DATA.ui.tours[tour][1].length;
  if (e.key === 'ArrowRight' && step < n - 1) { step++; render(); }
  if (e.key === 'ArrowLeft' && step > 0) { step--; render(); }
  if (e.key === 'Escape') { tour = null; render(); }
});
const h = location.hash.slice(1);
if (DATA.ui.tours[h]) { tour = h; step = 0; render(); }
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
