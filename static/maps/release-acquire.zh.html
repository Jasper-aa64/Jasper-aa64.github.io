<div class="panel" id="panel"><div class="ph"><span class="badge" id="badge"></span><span id="head"></span></div><p class="ptxt" id="txt"></p>
  <p class="note" id="note" hidden><b>为什么这样就对了</b><br><b>release 管写方</b>：ready 不会比 data 先被别的核看见（第 2、4 步）。<b>acquire 管读方</b>：读到 ready 之后，排着的作废先处理完，后面读 data 拿不到旧值（第 6 步）。两边各管一半，少一个都不行：只有 release，核 1 照样可能从没作废的旧行里读到 0；只有 acquire，ready 可能比 data 先可见。</p>

<div class="ctl"><button class="ib" id="reset" title="重来"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.7-6.4"/><path d="M3 4v5h5"/></svg><span>重来</span></button><button class="ib" id="prev" title="上一步"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>上一步</span></button><button class="ib" id="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M7 4.5v15l12.5-7.5z"/></svg><span>自动播放</span></button><button class="ib pri" id="next" title="下一步"><span>下一步</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button><div class="prog"><div class="bar"><i id="bar"></i></div><span id="cnt"></span></div></div>
<div class="legend"><span><b class="lM">M</b>已修改</span><span><b class="lE">E</b>独占</span><span><b class="lS">S</b>共享</span><span><b class="lI">I</b>无效</span><span class="kbd"><kbd>←</kbd> <kbd>→</kbd> 也能翻页</span></div>
</div>
<script>
(function () {
  var D = {"texts": ["代码和上一个动画一样，只改了两处：写 ready 用 release，读 ready 用 acquire。开始时 data 在两个核的缓存里各有一份（S），ready 只在核 0 的缓存里（E）。点“下一步”或按键盘右方向键往下走。", "核 0 执行 data = 42。核 1 也有 data 这一行，得先让它作废，所以这个写先记进 store buffer，等 ACK。到这里和上一个动画一样。", "ready.store 带着 release：它前面的写（data = 42）被别的核看见之前，它不能被看见。ready 这一行只在核 0 里（E），本来可以直接写进 L1D，现在也只能进 store buffer，排在 data 后面。x86 的 store buffer 本来就按顺序往外写，release 编出来是普通的 mov；ARM 的写可以乱序可见，要用 stlr。", "核 0 发出 invalidate 请求，snoop filter 只转给核 1；核 1 把请求放进 invalidate queue，马上回 ACK。核 1 的 L1D 里 data 还是旧的 0，没有被标成无效。这一步也和上一个动画一样。", "核 0 收齐 ACK，先把 data = 42 写进 L1D（变成 M），然后才轮到 ready = 1（也变成 M）。release 要的就是这个先后：别的核看见 ready = 1 的时候，data = 42 一定已经可见了。", "核 1 用 acquire 读 ready：本地没有这一行，发 Read 请求，核 0 经互连把整行转过来，两边都变成 S。读到 1，退出循环。", "acquire 规定它后面的读不能跑到它前面去。在这个模型里，核 1 要先把 invalidate queue 里排着的请求处理完，再执行后面的读：data 这一行被作废，变成 I。x86 本来就禁止读和读乱序，acquire 编出来是普通的 mov；ARM 上要用 ldar。", "核 1 读 data：这一行已经是 I，未命中，发 Read 请求。核 0 手里是 M，经互连把整行转过来，两边都变成 S。读到 42。和上一个动画相比，多出来的只有第 2 步和第 6 步这两个顺序约束。"], "titles": ["开始之前", "写先进 store buffer", "release：ready 排在 data 后面", "invalidate 请求和 ACK", "收齐 ACK，按顺序写进 L1D", "acquire 读到 ready = 1", "acquire：先处理 invalidate queue", "读 data，拿到 42"], "step": "第 {k} 步，共 7 步：", "colors": {"1": "#1f2328", "2": "#8250df", "3": "#bc4c00", "4": "#1f2328", "5": "#0969da", "6": "#8250df", "7": "#1a7f37"}, "play": "自动播放", "pause": "暂停"};
  var UI = { play: D.play, pause: D.pause };

  var root = document.documentElement;
  function theme() {
    var t = null;
    try { if (window.parent !== window) t = window.parent.document.documentElement.dataset.theme; } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    root.classList.toggle('dark', t !== 'light');
  }
  theme();
  try { if (window.parent !== window) new MutationObserver(theme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', theme);
  function fit() {
    try {
      var f = window.frameElement; if (!f) return;
      var h = Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height) + (f.offsetHeight - f.clientHeight);
      if (Math.abs(parseFloat(f.style.height || 0) - h) > 0.5) f.style.height = h + 'px';
    } catch (e) {}
  }
  var ICON_PLAY = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path class=\"fill\" d=\"M7 4.5v15l12.5-7.5z\"/></svg>", ICON_PAUSE = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect class=\"fill\" x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/><rect class=\"fill\" x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"/></svg>";
  function playBtn(on) { document.getElementById('play').innerHTML = (on ? ICON_PAUSE : ICON_PLAY) + '<span>' + (on ? UI.pause : UI.play) + '</span>'; }
  function progress(k, n) {
    document.getElementById('cnt').textContent = (k + 1) + ' / ' + n;
    document.getElementById('bar').style.width = (n > 1 ? 100 * k / (n - 1) : 100) + '%';
    document.getElementById('prev').disabled = k === 0;
    document.getElementById('next').disabled = k === n - 1;
  }
  // give each element a min-height equal to its tallest state; measure(fn) must visit every state
  function lockHeights(els, visitAll) {
    els.forEach(function (el) { el.style.minHeight = ''; });
    var h = els.map(function () { return 0; });
    visitAll(function () { els.forEach(function (el, i) { h[i] = Math.max(h[i], Math.ceil(el.getBoundingClientRect().height)); }); });
    els.forEach(function (el, i) { el.style.minHeight = h[i] + 'px'; });
  }

  var svg = document.getElementById('sp'), LAST = 7, k = 0, timer = null;
  var parts = svg.querySelectorAll('[data-from]');
  svg.querySelectorAll('.inv, .ack, .data, .go, .pend, .acq').forEach(function (p) {
    p.style.setProperty('--len', Math.ceil(p.getTotalLength ? p.getTotalLength() : 600));
  });
  var head = document.getElementById('head'), txt = document.getElementById('txt'), note = document.getElementById('note');
  var badge = document.getElementById('badge'), panel = document.getElementById('panel');
  function fill(n) {
    badge.hidden = n === 0;
    badge.textContent = n;
    var c = D.colors[n];
    badge.style.background = !c || c === '#1f2328' ? 'var(--muted)' : c;
    head.textContent = D.titles[n];
    txt.textContent = D.texts[n];
    note.hidden = n !== LAST;
  }
  function show(n, quiet) {
    k = Math.max(0, Math.min(LAST, n));
    parts.forEach(function (el) {
      var on = k >= +el.dataset.from && k <= +el.dataset.to;
      el.classList.toggle('hide', !on);
      el.classList.remove('cur');
      if (on && el.dataset.step !== undefined && +el.dataset.step === k) { void el.getBBox(); el.classList.add('cur'); }
    });
    fill(k);
    progress(k, LAST + 1);
    document.getElementById('cnt').textContent = k + ' / ' + LAST;
    if (!quiet) fit();
  }
  function lock() {
    var save = k;
    lockHeights([panel], function (measure) { for (var n = 0; n <= LAST; n++) { fill(n); measure(); } });
    show(save);
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } playBtn(false); }
  function play() {
    if (timer) { stop(); return; }
    if (k === LAST) show(0);
    playBtn(true);
    timer = setInterval(function () { if (k >= LAST) stop(); else show(k + 1); }, 2400);
  }
  document.getElementById('prev').onclick = function () { stop(); show(k - 1); };
  document.getElementById('next').onclick = function () { stop(); show(k + 1); };
  document.getElementById('play').onclick = play;
  document.getElementById('reset').onclick = function () { stop(); show(0); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { stop(); show(k + 1); }
    if (e.key === 'ArrowLeft') { stop(); show(k - 1); }
  });
  var rz = null;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(lock, 120); });
  window.addEventListener('load', lock);
  show(0, true);
  lock();
})();
</script>
