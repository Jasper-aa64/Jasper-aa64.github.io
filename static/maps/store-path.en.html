  <rect x="0" y="0" width="1100" height="1030" fill="#ffffff"/>
  <text x="40" y="40" class="h">The store path: how a write becomes visible to another core</text>

  <text x="60" y="86" class="cm">// at the start: data = 0, ready = false</text>
  <text x="60" y="110" class="cm">// core 0 (writer)</text>

  <text x="60" y="154" class="code">ready = true;</text>
  <text x="630" y="110" class="cm">// core 1 (reader)</text>
  <text x="630" y="132" class="code">while (!ready) {}</text>
  <text x="630" y="154" class="code">use(data);   // expects 42</text>

  <text x="265" y="521" class="f" text-anchor="middle">L2 (private)</text>

  <text x="638" y="419" class="code">data</text>
  <text x="710" y="419" class="code">0</text>

  <text x="853" y="418.5" class="stt" text-anchor="middle">S</text>
  <text x="900" y="419" class="red">stale</text>

  <g data-from="0" data-to="4">
  <rect x="624" y="436" width="422" height="28" rx="4" class="row"/>
  <text x="638" y="455" class="code">ready</text>
  <text x="710" y="455" class="code">none</text>
  <rect x="820" y="441" width="66" height="18" rx="4" class="st"/>
  <text x="853" y="454.5" class="stt" text-anchor="middle">I</text>
  </g>
  <g data-from="5" data-to="6" data-step="5">
  <rect x="624" y="436" width="422" height="28" rx="4" class="row"/>
  <text x="638" y="455" class="code">ready</text>
  <text x="710" y="455" class="code">1</text>
  <rect x="820" y="441" width="66" height="18" rx="4" class="st"/>
  <text x="853" y="454.5" class="stt" text-anchor="middle">S</text>
  </g>
  <rect x="610" y="496" width="450" height="40" rx="6" class="cache"/>
  <text x="835" y="521" class="f" text-anchor="middle">L2 (private)</text>
  <g data-from="5" data-to="6" data-step="5">
  <line x1="265" y1="478" x2="265" y2="494" class="data"/>
  <line x1="265" y1="536" x2="265" y2="584" class="data" marker-end="url(#ad)"/>
  <line x1="835" y1="584" x2="835" y2="540" class="data" marker-end="url(#ad)"/>
  <line x1="835" y1="496" x2="835" y2="482" class="data" marker-end="url(#ad)"/>
  <circle cx="810" cy="562" r="11" fill="#0969da"/>
  <text x="810" y="566.5" class="dt" text-anchor="middle">5</text>
  <text x="850" y="566" class="lab">ready's line moves to core 1</text>
  </g>
  <g data-from="2" data-to="6" data-step="2">
  <path d="M490,278 H510 V584" class="inv"/>
  <path d="M590,584 V278 H606" class="inv" marker-end="url(#ai)"/>
  <circle cx="550" cy="408" r="11" fill="#bc4c00"/>
  <text x="550" y="412.5" class="dt" text-anchor="middle">2</text>
  </g>
  <g data-from="3" data-to="6" data-step="3">
  <path d="M610,322 H570 V584" class="ack"/>
  <path d="M530,584 V322 H494" class="ack" marker-end="url(#aa)"/>
  <circle cx="550" cy="452" r="11" fill="#1a7f37"/>
  <text x="550" y="456.5" class="dt" text-anchor="middle">3</text>
  </g>
  <g data-from="6" data-to="6" data-step="6">
  <circle cx="1020" cy="414" r="11" fill="#cf222e"/>
  <text x="1020" y="418.5" class="dt" text-anchor="middle">6</text>
  <text x="1046" y="388" class="red" text-anchor="end">core 1 reads the old 0 here</text>
  </g>
  <rect x="40" y="586" width="1020" height="40" rx="6" class="ban"/>
  <text x="550" y="611" class="f" text-anchor="middle">On-chip interconnect (ring or mesh): Read, RFO, invalidate, ACK and cache-to-cache lines all go here</text>
  <line x1="550" y1="626" x2="550" y2="650" class="line"/>
  <rect x="40" y="650" width="1020" height="74" rx="6" class="cache"/>
  <text x="60" y="676" class="t">L3 (shared by all cores) + snoop filter</text>
  <text x="60" y="702" class="s">The snoop filter records which cores hold each line, so invalidations go only to cores with a copy (②). It never pushes new values into another core: core 1 fetches ready itself (⑤).</text>
  <rect x="40" y="748" width="1020" height="200" rx="8" class="ban"/>
  <g data-from="0" data-to="0">
  <text x="60" y="784" class="caph">Before it starts</text>
  <text x="60" y="814" class="cap">At the start, data is in both cores' caches (S) and ready only in core 0's (E). Press Next, or use the arrow keys.</text>
  </g>
  <g data-from="1" data-to="1">
  <circle cx="66" cy="778" r="11" fill="#1f2328"/>
  <text x="66" y="782.5" class="dt" text-anchor="middle">1</text>
  <text x="88" y="784" class="caph">Step 1 of 6</text>
  <text x="60" y="814" class="cap">Core 0 runs data = 42: the store goes into the store buffer and retires; ready = true queues behind it.</text>
  </g>
  <g data-from="2" data-to="2">
  <circle cx="66" cy="778" r="11" fill="#bc4c00"/>
  <text x="66" y="782.5" class="dt" text-anchor="middle">2</text>
  <text x="88" y="784" class="caph">Step 2 of 6</text>
  <text x="60" y="814" class="cap">Core 0 already holds data (S) and only needs ownership, so no RFO for the data, just an invalidate; the snoop filter</text>
  <text x="60" y="838" class="cap">sends it to core 1 only.</text>
  </g>
  <g data-from="3" data-to="3">
  <circle cx="66" cy="778" r="11" fill="#1a7f37"/>
  <text x="66" y="782.5" class="dt" text-anchor="middle">3</text>
  <text x="88" y="784" class="caph">Step 3 of 6</text>
  <text x="60" y="814" class="cap">Core 1 puts the invalidation in its invalidate queue and ACKs at once. data in its L1D is untouched, still 0.</text>
  </g>
  <g data-from="4" data-to="4">
  <circle cx="66" cy="778" r="11" fill="#1f2328"/>
  <text x="66" y="782.5" class="dt" text-anchor="middle">4</text>
  <text x="88" y="784" class="caph">Step 4 of 6</text>
  <text x="60" y="814" class="cap">With all ACKs in, core 0's data line turns M and 42 lands in L1D. ready is in core 0's cache only, so it is written</text>
  <text x="60" y="838" class="cap">next.</text>
  </g>
  <g data-from="5" data-to="5">
  <circle cx="66" cy="778" r="11" fill="#0969da"/>
  <text x="66" y="782.5" class="dt" text-anchor="middle">5</text>
  <text x="88" y="784" class="caph">Step 5 of 6</text>
  <text x="60" y="814" class="cap">Core 1 reads ready: the line isn't local, so it sends a Read; core 0 forwards the line cache to cache; the loop exits;</text>
  <text x="60" y="838" class="cap">both copies turn S.</text>
  </g>
  <g data-from="6" data-to="6">
  <circle cx="66" cy="778" r="11" fill="#cf222e"/>
  <text x="66" y="782.5" class="dt" text-anchor="middle">6</text>
  <text x="88" y="784" class="caph">Step 6 of 6</text>
  <text x="60" y="814" class="cap">Core 1 reads data: an L1D hit, but the invalidation is still queued, so it reads the old 0.</text>
  <text x="60" y="860" class="t">Whether ⑥ can happen depends on which reorderings the CPU allows</text>
  <text x="60" y="882" class="s">data, read later, is older than ready, read earlier: a load-load reordering. x86 forbids it; the hardware makes ⑥ read 42.</text>
  <text x="60" y="899" class="s">ARM allows it: ready must be read with acquire so later loads wait for the invalidation. ARM also lets two stores reorder,</text>
  <text x="60" y="916" class="s">so ready may become visible before data, and the store to ready needs release. On x86 the code is still wrong: ready isn't atomic,</text>
  <text x="60" y="933" class="s">so the compiler may hoist the load out of the loop or swap the two stores. Fix: std::atomic&lt;bool&gt; ready, release store, acquire load.</text>
  </g>

<script>
(function () {
  var svg = document.getElementById('sp'), LAST = 6, k = 0, timer = null;
  var parts = svg.querySelectorAll('[data-from]');
  svg.querySelectorAll('.inv, .ack, .data').forEach(function (p) {
    p.style.setProperty('--len', Math.ceil(p.getTotalLength ? p.getTotalLength() : 600));
  });
  var playLabel = 'Play', pauseLabel = 'Pause';
  function show(n) {
    k = Math.max(0, Math.min(LAST, n));
    parts.forEach(function (el) {
      var on = k >= +el.dataset.from && k <= +el.dataset.to;
      el.classList.toggle('hide', !on);
      var cur = on && el.dataset.step !== undefined && +el.dataset.step === k;
      el.classList.remove('cur');
      if (cur) { void el.getBBox(); el.classList.add('cur'); }
    });
    document.getElementById('b-prev').classList.toggle('off', k === 0);
    document.getElementById('b-next').classList.toggle('off', k === LAST);
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } document.querySelector('#b-play text').textContent = playLabel; }
  function play() {
    if (timer) { stop(); return; }
    if (k === LAST) show(0);
    document.querySelector('#b-play text').textContent = pauseLabel;
    timer = setInterval(function () { if (k >= LAST) stop(); else show(k + 1); }, 2400);
  }
  function on(id, f) {
    var b = document.getElementById(id);
    b.addEventListener('click', f);
    b.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } });
  }
  on('b-prev', function () { stop(); show(k - 1); });
  on('b-next', function () { stop(); show(k + 1); });
  on('b-play', play);
  on('b-reset', function () { stop(); show(0); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { stop(); show(k + 1); }
    if (e.key === 'ArrowLeft') { stop(); show(k - 1); }
  });
  show(0);
})();
</script>
