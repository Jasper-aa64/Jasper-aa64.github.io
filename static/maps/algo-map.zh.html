* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font: 15px/1.6 PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif; -webkit-tap-highlight-color: transparent; }
header { padding: 14px 16px 10px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; }

a { color: var(--accent); }
.tours { display:flex; flex-wrap:wrap; gap:8px; padding: 0 16px 10px; }
.tours button, .stepbar button { font: inherit; font-size:14px; padding: 5px 12px; border-radius: 999px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
.tours button[aria-pressed="true"] { border-color: var(--hl); color: var(--hl); }
.tours .zoom { margin-left: auto; }
.map.full svg { width: 1600px; max-width: none; }
.layout { display:grid; grid-template-columns: minmax(0,1fr) 340px; gap: 12px; padding: 0 16px 16px; align-items:start; }
.map { background:#ffffff; border:1px solid var(--line); border-radius:10px; overflow:auto; max-height: calc(100vh - 140px); }
.map svg { display:block; width:100%; height:auto; min-width: 1000px; }
.side { position: sticky; top: 12px; display:flex; flex-direction:column; gap:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding: 12px 14px; }
.card h2 { font-size:17px; margin:0 0 6px; }
.card p { margin: 4px 0; color: var(--muted); font-size:14px; }
.card h3 { font-size:13px; margin:10px 0 4px; color:var(--muted); font-weight:600; }
.card ul { margin:0; padding-left: 18px; font-size:14px; }
.stepbar { display:none; }
.stepbar.on { display:block; }
.stepbar .count { font-size:13px; color:var(--muted); }
.stepbar .cap { margin: 6px 0 10px; font-size:15px; color:var(--fg); }
.stepbar .btns { display:flex; gap:8px; }
.node { cursor:pointer; outline:none; }
.node:hover > rect:first-of-type, .node:focus-visible > rect:first-of-type { stroke:#bf3989; stroke-width:2.5; }
.node.sel > rect:first-of-type { stroke:#bf3989; stroke-width:3; }
svg .tag a tspan { text-decoration: underline; text-decoration-color: rgba(9,105,218,.35); }
svg .tag a:hover tspan { fill:#bf3989; }
svg.dim .node, svg.dim .edge { opacity:.18; transition: opacity .25s; }
svg.dim .node.on, svg.dim .edge.on { opacity:1; }
svg .edge.on { stroke:#bf3989; stroke-width:3; }
svg.dim .node.on > rect:first-of-type { stroke:#bf3989; stroke-width:3; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; order: -1; }
  .map { max-height: 70vh; }
}
@media (prefers-reduced-motion: reduce) { svg.dim .node, svg.dim .edge { transition:none; } }
</style>

<script>
const DATA = {"nodes": {"a_cx": {"title": "复杂度 · STL", "lines": ["先看数据范围：n 到 1e5 要 O(n log n)，1e6 要 O(n)，20 以内可以指数。", "面试和比赛的第一步都是这一步；vector、map、priority_queue、unordered_map 的复杂度要背熟。"], "tags": [[["A1 第 1 节", "/zh/algo/a1-complexity-binary-search-two-pointers-prefix-sums/"]]]}, "a_bs": {"title": "二分", "lines": ["答案单调（能做到 x，就能做到比 x 更松的）就二分答案，把求最优变成判定可行。", "固定用一种写法（左闭右开），边界才不会错。"], "tags": [[["A1 第 2 节", "/zh/algo/a1-complexity-binary-search-two-pointers-prefix-sums/"]]]}, "a_tp": {"title": "双指针 · 滑窗", "lines": ["区间合法与否随右端点单调时，左端点也只会往右走，总共 O(n)。", "最长无重复子串、和至少为 k 的最短子数组都是这一类。"], "tags": [[["A1 第 3 节", "/zh/algo/a1-complexity-binary-search-two-pointers-prefix-sums/"]]]}, "a_ps": {"title": "前缀和 · 差分", "lines": ["区间和用前缀和，区间加用差分，二维同理。", "“和为 k 的子数组有几个”用前缀和加哈希表。"], "tags": [[["A1 第 4 节", "/zh/algo/a1-complexity-binary-search-two-pointers-prefix-sums/"]]]}, "a_st": {"title": "栈 · 单调栈", "lines": ["单调栈求每个数左右第一个更大或更小的数，单调队列求滑窗最值，都是均摊 O(n)。", "括号匹配、表达式求值用普通栈。"], "tags": []}, "a_hp": {"title": "堆 · 哈希表", "lines": ["动态取最值用堆，Top-K 用大小为 K 的堆；查有没有、数出现几次用哈希表。", "HFT 面试常拿这两个问行情去重、订单簿最优价。"], "tags": []}, "a_gr": {"title": "排序 · 贪心", "lines": ["贪心一般先排序，再用交换论证说明“换一下不会更好”。区间调度、合并区间是高频题。", "快排和归并要能手写，归并顺带求逆序对。"], "tags": []}, "a_bit": {"title": "位运算", "lines": ["x & -x 取最低位的 1；枚举 m 的子集：for (s = m; s; s = (s - 1) & m)。", "异或自反，找只出现一次的数。这些是状压 DP 的基础。"], "tags": []}, "a_srch": {"title": "搜索 · 回溯", "lines": ["无权图最短路用 BFS；排列、组合、子集用 DFS 回溯，剪枝决定能不能过。", "网格题、岛屿数量是高频题。"], "tags": []}, "a_tree": {"title": "树", "lines": ["二叉树的前、中、后序和层序遍历要能不用递归写出来；树的直径两遍 DFS；LCA 用倍增。", "面试里的树题，难点大多在递归函数返回什么。"], "tags": []}, "a_graph": {"title": "图 · 最短路", "lines": ["非负权用 Dijkstra（堆优化 O(m log n)），有负权用 Bellman-Ford；有向无环图先拓扑排序再 DP。", "课程表、任务依赖就是拓扑排序。"], "tags": []}, "a_dsu": {"title": "并查集", "lines": ["路径压缩加按秩合并，每次操作几乎是常数。", "动态加边问两点是否连通、Kruskal 求最小生成树都用它。"], "tags": []}, "a_dp1": {"title": "DP：线性 · 背包", "lines": ["先定状态的含义，再写转移和边界。", "最长上升子序列、编辑距离、01 背包和完全背包是必会的模板，背包要会压成一维。"], "tags": []}, "a_dp2": {"title": "DP：区间 · 树 · 状压", "lines": ["区间 DP 按长度从小到大算；树形 DP 在 DFS 回溯时合并子树；状压 DP 用一个整数表示集合，n 到 20 左右。"], "tags": []}, "a_str": {"title": "字符串", "lines": ["KMP 求前缀函数做匹配；字符串哈希 O(1) 比较两个子串；Trie 存前缀，按位存的 01-Trie 求最大异或。"], "tags": []}, "a_design": {"title": "设计题", "lines": ["HFT 面试常考：LRU（哈希表 + 双向链表，O(1)）、订单簿（按价格有序的表，每一档一个队列）、滑动窗口限流。", "考的是选什么数据结构、每个操作多少复杂度。"], "tags": []}, "b_seg": {"title": "树状数组 · 线段树", "lines": ["单点改、区间查用树状数组；区间改、区间查，或者要维护复杂信息，用线段树加懒标记。", "题里有“多次修改 + 多次区间询问”就想到它。"], "tags": []}, "b_bst": {"title": "平衡树 · pb_ds", "lines": ["要动态求第 k 小、求排名，用 pb_ds 的 tree 或手写 Treap。比赛里优先用库。"], "tags": []}, "b_tree": {"title": "树上进阶", "lines": ["路径上修改、查询用树链剖分套线段树；每个点都当一次根算答案用换根 DP；统计满足条件的路径用点分治。"], "tags": []}, "b_conn": {"title": "连通性", "lines": ["有向图的强连通分量缩成 DAG 再 DP；无向图求割点和桥；一堆“二选一”约束是 2-SAT。"], "tags": []}, "b_flow": {"title": "网络流 · 二分图", "lines": ["分配、匹配、最小割都能建模成网络流，Dinic 写熟一份板子。难点在建图，不在算法本身。"], "tags": []}, "b_str": {"title": "字符串进阶", "lines": ["多模式串匹配用 AC 自动机；子串计数、本质不同子串用后缀自动机；最长回文用 Manacher。"], "tags": []}, "b_geo": {"title": "计算几何", "lines": ["一切从叉积判方向开始：凸包、旋转卡壳、半平面交。精度问题用 eps，能用整数就用整数。"], "tags": []}, "b_game": {"title": "博弈", "lines": ["公平组合游戏：Nim 看各堆的异或和；几个独立游戏合起来，SG 值是各自 SG 值的异或。先打表找规律。"], "tags": []}, "b_dc": {"title": "分治", "lines": ["三维偏序用 CDQ 分治降掉一维；很多询问各自要二分时，整体二分把它们一起二分。"], "tags": []}, "b_off": {"title": "离线技巧", "lines": ["询问可以重排就离线做：区间询问按块排序用莫队；二维数点、矩形面积并用扫描线加树状数组。"], "tags": []}, "b_lichao": {"title": "李超树 · 笛卡尔树", "lines": ["斜率优化 DP 的通用解法是李超线段树（动态加直线、求某点最值）；笛卡尔树把区间最值问题变成树上问题。"], "tags": []}, "b_rand": {"title": "对拍 · 随机化", "lines": ["写完难题先写暴力程序对拍，比肉眼查错快得多；随机哈希、随机打乱防止被构造的数据卡掉。"], "tags": []}, "c_pow": {"title": "快速幂 · gcd · exgcd", "lines": ["快速幂 O(log n)；扩展欧几里得解 ax + by = gcd(a, b)，用来求逆元、解线性同余方程。", "赛场上要能一分钟写出来。"], "tags": [[["NT #1 GCD · CRT", "/posts/number-theory-1-elementary/"]]]}, "c_inv": {"title": "逆元 · CRT · 欧拉定理", "lines": ["模数是质数用费马小定理求逆元，不是就用 exgcd；1 到 n 的逆元能线性求出。", "中国剩余定理合并几个同余式（模数不互质用扩展 CRT）；扩展欧拉定理把很大的指数降下来。"], "tags": [[["NT #1 GCD · CRT", "/posts/number-theory-1-elementary/"]]]}, "c_sieve": {"title": "筛法", "lines": ["线性筛 O(n) 求出质数，同时筛出 φ、μ、约数个数这些积性函数。n 到 1e7 都靠它预处理。"], "tags": [[["NT #3 sieve → Möbius", "/posts/number-theory-3-sieve-mobius-inclusion-exclusion/"]]]}, "c_mult": {"title": "积性函数 · 狄利克雷卷积", "lines": ["狄利克雷卷积把这些函数连成一张网：μ * 1 = ε，φ * 1 = id，1 * 1 = d。推式子时靠这些恒等式换元。"], "tags": [[["NT #2 multiplicative", "/posts/number-theory-2-multiplicative-functions/"]]]}, "c_mob": {"title": "莫比乌斯反演 · 数论分块", "lines": ["看到 ∑∑[gcd(i, j) = 1] 或 ∑ gcd(i, j)，用 [n = 1] = ∑_{d | n} μ(d) 换掉条件，再交换求和顺序。", "剩下的 ⌊n / d⌋ 只有 O(√n) 种取值，按块算。它本质上是在约数上做容斥（组合计数那一列）。"], "tags": [[["NT #2-ex Möbius", "/posts/number-theory-2-ex-mobius-techniques/"]], [["NT #1.1 floor blocks", "/posts/number-theory-1-1-divisibility-blocking/"]]]}, "c_dujiao": {"title": "杜教筛 · min_25", "lines": ["线性筛只够到 1e7。n 再大，杜教筛用狄利克雷卷积把积性函数前缀和递归下去，O(n^{2/3})；min_25 处理在质数处好算的积性函数。"], "tags": [[["NT #4 Min_25 · Du", "/posts/number-theory-4-min25-du-jiao-sieve/"]]]}, "c_root": {"title": "原根 · BSGS", "lines": ["原根把乘法变成指数上的加法；BSGS 在 O(√p) 内解 a^x ≡ b (mod p)。", "998244353 的原根 3 就是 NTT 用的那个。"], "tags": [[["C #2.2 roots · NTT", "/posts/combinatorics-2-2-primitive-roots-ntt/"]]]}, "c_mr": {"title": "Miller-Rabin · rho", "lines": ["1e18 级别的数判素用 Miller-Rabin（固定 7 个底就是确定性的），分解用 Pollard rho。乘法要用 __int128 防溢出。"], "tags": [[["NT #4 Miller-Rabin · rho", "/posts/number-theory-4-primality-factorisation-residues/"]]]}, "c_qr": {"title": "二次剩余 · Lucas", "lines": ["Cipolla 解 x² ≡ a (mod p)；Lucas 定理算 n 很大、p 不大的组合数取模，扩展 Lucas 处理合数模。"], "tags": [[["NT #4 Miller-Rabin · rho", "/posts/number-theory-4-primality-factorisation-residues/"]]]}, "c_ntfact": {"title": "常用结论", "lines": ["n! 里质因子 p 的次数用勒让德公式；1e9 以内的数约数最多 1344 个，1e18 以内约 1e5 个，决定能不能枚举约数。"], "tags": [[["NT #0 common formulae", "/posts/number-theory-0-common-formulae/"]]]}, "c_cnt": {"title": "排列组合 · 组合数取模", "lines": ["预处理 n! 和它的逆元，组合数 O(1)。先修：逆元（数论那一列）。", "插板法、多重集排列、错位排列这些模型要能一眼认出来。"], "tags": [[["C #1.1 binomials", "/posts/combinatorics-1-1-permutations-combinations/"]], [["C #0 formulae", "/posts/combinatorics-0-common-formulae-conclusions/"]]]}, "c_ie": {"title": "容斥 · 错排 · 不定方程", "lines": ["限制很多的计数：先算不管限制的，再按违反了哪些限制加加减减。", "有上界的不定方程解数、错排都是容斥的模板题。"], "tags": [[["C #1.2 inclusion-exclusion", "/posts/combinatorics-1-2-inclusion-exclusion-diophantine-derangements/"]]]}, "c_binv": {"title": "二项式反演 · min-max 反演", "lines": ["容斥的代数形式：已知 g(k) = ∑ C(i, k) f(i)，就能反过来解出 f。", "min-max 反演用来求“所有东西都出现一次的期望时间”。"], "tags": []}, "c_gf": {"title": "生成函数", "lines": ["把计数序列装进幂级数：几类物品各选若干个，就是几个生成函数相乘。", "无标号用普通生成函数，有标号（排列）用指数生成函数。"], "tags": [[["C #3.1 OGF", "/posts/combinatorics-3-1-ordinary-generating-functions/"]]]}, "c_ntt": {"title": "FFT · NTT", "lines": ["两个多项式相乘从 O(n²) 降到 O(n log n)。模 998244353 用 NTT，不丢精度；任意模数用三模 NTT 或拆系数 FFT。", "先修：原根（数论那一列）。"], "tags": [[["C #2.1 FFT", "/posts/combinatorics-2-1-fft-lagrange-interpolation/"]], [["C #2.2 roots · NTT", "/posts/combinatorics-2-2-primitive-roots-ntt/"]]]}, "c_poly": {"title": "多项式全家桶", "lines": ["有了 NTT，生成函数的除法、对数、指数都是 O(n log n)。比赛直接用板子；要会的是把题目化成“求某个生成函数的第 n 项”。"], "tags": [[["C #3.2 power series", "/posts/combinatorics-3-2-more-operations-on-formal-power-series/"]]]}, "c_model": {"title": "球盒 · 斯特林 · 卡特兰", "lines": ["球和盒子有没有区别、盒子能不能空，十二种情况各对应一个公式（组合数、斯特林数、分拆数）。", "卡特兰数对应括号序列、出栈序列、二叉树个数。"], "tags": []}, "c_polya": {"title": "Polya · Burnside", "lines": ["旋转或翻转后相同的染色算一种时，用 Burnside：对每个置换数不动点，再取平均。项链计数是模板。"], "tags": []}, "c_prob": {"title": "概率 · 期望 DP", "lines": ["期望能拆成各部分期望之和（线性性）；期望 DP 一般从终点往回推。分数结果用逆元取模输出。"], "tags": []}, "c_fwt": {"title": "FWT · 子集卷积 · SOS", "lines": ["下标做位运算的卷积用 FWT；对所有子集求和（高维前缀和）用 SOS DP，O(n·2^n)。"], "tags": []}, "c_mpow": {"title": "矩阵乘法 · 快速幂", "lines": ["n 到 1e18、每一项只依赖前 k 项的递推（斐波那契、只看前几项的计数 DP），写成 k × k 矩阵做快速幂。"], "tags": [[["M #1 fast power · Kitamasa", "/posts/matrix-1-fast-exponentiation/"]]]}, "c_semi": {"title": "DP 半环", "lines": ["把乘法换成加法、加法换成取 min，矩阵快速幂就能算“恰好走 k 步的最短路”；布尔矩阵算可达性。"], "tags": [[["M #1 fast power · Kitamasa", "/posts/matrix-1-fast-exponentiation/"]]]}, "c_gauss": {"title": "高斯消元", "lines": ["O(n³) 解线性方程组；模 p 时除法换成乘逆元；异或方程组用 bitset 加速。", "要会判无解、数自由元：方案数 = p 的自由元个数次方。"], "tags": [[["M #2 Gaussian elimination", "/posts/matrix-2-gaussian-elimination/"]]]}, "c_det": {"title": "行列式", "lines": ["行列式 = 消成上三角以后对角线的乘积。模数不是质数时，两行之间做辗转相除来消元。"], "tags": []}, "c_mtt": {"title": "矩阵树定理 · LGV", "lines": ["生成树个数 = 拉普拉斯矩阵去掉一行一列后的行列式；LGV 引理把不相交路径组的计数变成一个行列式。"], "tags": []}, "c_bm": {"title": "BM · 特征多项式", "lines": ["不知道递推式时用 Berlekamp-Massey 从前 2k 项求出来；k 大时用特征多项式（Kitamasa）把 O(k³ log n) 降到 O(k² log n)，再配 NTT 更快。"], "tags": [[["M #1 fast power · Kitamasa", "/posts/matrix-1-fast-exponentiation/"]]]}, "c_mprob": {"title": "矩阵题型", "lines": ["区间加、区间求斐波那契和：线段树每个节点存一个矩阵，懒标记也是矩阵。"], "tags": [[["M #4 problems", "/posts/matrix-4-problems/"]]]}, "c_basis": {"title": "线性基", "lines": ["一组数所有子集的异或和构成一个线性空间，线性基是它的一组基（至多 64 个数）：求最大异或、能否异或出 x、第 k 小。"], "tags": [[["M #3 linear basis", "/posts/matrix-3-linear-basis/"]]]}}, "ui": {"page_title": "算法地图", "lead": "点一个框看它解决什么、什么时候想到它；选一条路线，一步一步看先学什么。蓝字可以直接点开对应的笔记。", "other_lang": ["English", "algo-map.en.html"], "static": ["静态图", "/images/algo/algo-map.zh.svg"], "ref": ["算法", "/zh/algo/"], "prev": "上一步", "next": "下一步", "exit": "退出", "step": "第 {i} / {n} 步", "panel_empty": "点图里的任意一个框。", "zoom": ["看原尺寸", "适应宽度"], "panel_links": "站内笔记", "tours": {"interview": ["面试刷题路线", [[["a_cx"], "先练“看数据范围定复杂度”，再把 STL 容器的复杂度背熟。后面每道题都从这一步开始。"], [["a_bs", "a_tp", "a_ps"], "数组上的三件套：二分、双指针、前缀和。面试题一大半是它们的组合。"], [["a_st", "a_hp", "a_gr", "a_bit"], "栈、堆、哈希表、排序贪心、位运算：选对容器，复杂度就对了。"], [["a_srch", "a_tree", "a_graph", "a_dsu"], "搜索、树、图、并查集：递归和 BFS 写熟，树题想清楚递归返回什么。"], [["a_dp1", "a_dp2"], "DP：每道题先写下“状态是什么意思”，转移自然就出来了。"], [["a_str", "a_design"], "字符串和设计题收尾。HFT 面试常落在设计题：LRU、订单簿、限流。"]]], "nt": ["数论主线", [[["c_pow"], "从快速幂、gcd、exgcd 开始：后面每一格都要用。"], [["e_c_pow_c_inv", "c_inv"], "逆元和 CRT：模意义下怎么做除法、怎么合并同余。旁边的原根接在这里。"], [["e_c_inv_c_sieve", "c_sieve"], "线性筛：O(n) 筛质数，顺带筛积性函数。"], [["e_c_sieve_c_mult", "c_mult"], "积性函数和狄利克雷卷积：推式子用的那几个恒等式。"], [["e_c_mult_c_mob", "c_mob"], "莫比乌斯反演加数论分块：赛场上 ∑ gcd 类题目的标准路线，这一格要能当场推。"], [["e_c_mob_c_dujiao", "c_dujiao"], "n 到 1e10：杜教筛和 min_25。"]]], "comb": ["组合计数主线", [[["c_cnt"], "组合数取模：预处理阶乘和逆阶乘。经典模型（球盒、卡特兰）接在这里。"], [["e_c_cnt_c_ie", "c_ie"], "容斥：限制多的计数，按违反了哪些限制加减。"], [["e_c_ie_c_binv", "c_binv"], "二项式反演：“恰好 k 个”和“至少 k 个”互相换。"], [["e_c_binv_c_gf", "c_gf"], "生成函数：把“各选若干个凑总数”变成多项式相乘。"], [["e_c_gf_c_ntt", "c_ntt"], "NTT：让多项式乘法变成 O(n log n)。"], [["e_c_ntt_c_poly", "c_poly"], "多项式全家桶：求逆、ln、exp。要练的是把题化成“求第 n 项系数”。"]]], "la": ["线性代数主线", [[["c_mpow"], "矩阵快速幂：n 到 1e18 的线性递推。递推式不知道时用旁边的 BM。"], [["e_c_mpow_c_semi", "c_semi"], "DP 半环：把 (+, ×) 换成 (min, +)，算恰好走 k 步的最短路。"], [["e_c_semi_c_gauss", "c_gauss"], "高斯消元：实数、模 p、异或三种。异或方程组接到旁边的线性基。"], [["e_c_gauss_c_det", "c_det"], "行列式：消成上三角。"], [["e_c_det_c_mtt", "c_mtt"], "矩阵树定理和 LGV：计数题里的行列式。"]]], "signals": ["赛场上怎么想到", [[["c_mob", "c_dujiao"], "式子里有 ∑ gcd 或 [gcd = 1]：莫比乌斯反演换掉条件，数论分块求和；n 到 1e10 再上杜教筛。"], [["c_ie", "c_binv"], "计数带“每一个都不能……”的限制：容斥；问“恰好 k 个”：先算“至少 k 个”，再二项式反演。"], [["c_gf", "c_ntt", "c_poly"], "“若干种物品各选几个、凑出总和 n”，n 到 1e5：生成函数相乘，用 NTT。"], [["c_mpow", "c_bm"], "n 到 1e18、每项只依赖前几项：矩阵快速幂；递推式不知道就用 BM 求。"], [["c_gauss", "c_basis"], "一组开关、异或、模 2 的方程：高斯消元或线性基。"]]]}}};
const svg = document.querySelector('.map svg');
const panel = document.getElementById('panel');
const bar = document.getElementById('stepbar');
let tour = null, step = 0;
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function show(id){
  svg.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
  const n = DATA.nodes[id]; if (!n) return;
  document.getElementById(id).classList.add('sel');
  let h = '<h2>' + esc(n.title) + '</h2>' + n.lines.map(l => '<p>' + esc(l) + '</p>').join('');
  const links = [];
  n.tags.forEach(line => line.forEach(([txt, url]) => { if (url) links.push('<li><a href="' + url + '" target="_blank" rel="noopener">' + esc(txt.replace(/^ · /, '')) + '</a></li>'); }));
  if (links.length) h += '<h3>' + esc(DATA.ui.panel_links) + '</h3><ul>' + links.join('') + '</ul>';
  panel.innerHTML = h;
}
svg.querySelectorAll('.node').forEach(g => {
  g.addEventListener('click', e => { if (e.target.closest('a')) return; show(g.id); });
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(g.id); } });
});
function render(){
  svg.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.tours button[data-k]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === tour ? 'true' : 'false'));
  if (!tour) { svg.classList.remove('dim'); bar.classList.remove('on'); return; }
  const steps = DATA.ui.tours[tour][1];
  svg.classList.add('dim'); bar.classList.add('on');
  for (let i = 0; i <= step; i++) steps[i][0].forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('on'); });
  bar.querySelector('.count').textContent = DATA.ui.step.replace('{i}', step + 1).replace('{n}', steps.length);
  bar.querySelector('.cap').textContent = steps[step][1];
  bar.querySelector('.prev').disabled = step === 0;
  bar.querySelector('.next').disabled = step === steps.length - 1;
  const last = steps[step][0].map(id => document.getElementById(id)).filter(el => el && el.classList.contains('node')).pop();
  if (last) { show(last.id); last.scrollIntoView({block:'nearest', inline:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
}
document.querySelector('.tours .zoom').addEventListener('click', e => {
  const on = document.querySelector('.map').classList.toggle('full');
  e.currentTarget.setAttribute('aria-pressed', on ? 'true' : 'false');
  e.currentTarget.textContent = on ? DATA.ui.zoom[1] : DATA.ui.zoom[0];
});
document.querySelectorAll('.tours button[data-k]').forEach(b => b.addEventListener('click', () => { tour = tour === b.dataset.k ? null : b.dataset.k; step = 0; render(); }));
bar.querySelector('.prev').addEventListener('click', () => { step--; render(); });
bar.querySelector('.next').addEventListener('click', () => { step++; render(); });
bar.querySelector('.exit').addEventListener('click', () => { tour = null; render(); });
document.addEventListener('keydown', e => {
  if (!tour) return;
  const n = DATA.ui.tours[tour][1].length;
  if (e.key === 'ArrowRight' && step < n - 1) { step++; render(); }
  if (e.key === 'ArrowLeft' && step > 0) { step--; render(); }
  if (e.key === 'Escape') { tour = null; render(); }
});
const h = location.hash.slice(1);
if (DATA.ui.tours[h]) { tour = h; step = 0; render(); }
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
