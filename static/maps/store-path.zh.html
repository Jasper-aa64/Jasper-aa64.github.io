<script>
(function () {
  var svg = document.getElementById('sp'), LAST = 6, k = 0, timer = null;
  var parts = svg.querySelectorAll('[data-from]');
  svg.querySelectorAll('.inv, .ack, .data').forEach(function (p) {
    p.style.setProperty('--len', Math.ceil(p.getTotalLength ? p.getTotalLength() : 600));
  });
  var playLabel = '自动播放', pauseLabel = '暂停';
  function show(n) {
    k = Math.max(0, Math.min(LAST, n));
    parts.forEach(function (el) {
      var on = k >= +el.dataset.from && k <= +el.dataset.to;
      el.classList.toggle('hide', !on);
      var cur = on && el.dataset.step !== undefined && +el.dataset.step === k;
      el.classList.remove('cur');
      if (cur) { void el.getBBox(); el.classList.add('cur'); }
    });
    document.getElementById('b-prev').classList.toggle('off', k === 0);
    document.getElementById('b-next').classList.toggle('off', k === LAST);
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } document.querySelector('#b-play text').textContent = playLabel; }
  function play() {
    if (timer) { stop(); return; }
    if (k === LAST) show(0);
    document.querySelector('#b-play text').textContent = pauseLabel;
    timer = setInterval(function () { if (k >= LAST) stop(); else show(k + 1); }, 2400);
  }
  function on(id, f) {
    var b = document.getElementById(id);
    b.addEventListener('click', f);
    b.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } });
  }
  on('b-prev', function () { stop(); show(k - 1); });
  on('b-next', function () { stop(); show(k + 1); });
  on('b-play', play);
  on('b-reset', function () { stop(); show(0); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { stop(); show(k + 1); }
    if (e.key === 'ArrowLeft') { stop(); show(k - 1); }
  });
  show(0);
})();
</script>
</body>
</html>
