<div class="panel">
  <div class="head" id="head"></div>
  <p class="txt" id="txt"></p>
  <p class="note" id="note" hidden><b>⑥ 会不会发生，看 CPU 允许哪些乱序</b><br>后读的 data 比先读的 ready 还旧，这是读和读乱序（LoadLoad）。x86 不允许它，硬件保证 ⑥ 读到 42。ARM 允许：读 ready 要用 acquire，后面的读才会等失效处理完。ARM 还允许两个写乱序（StoreStore），ready 可能先于 data 被别的核看见，所以写 ready 要用 release。x86 上这段代码也是错的：ready 不是 atomic，编译器可以把循环里的读提到循环外，或者调换两个写。修法：std::atomic&lt;bool&gt; ready，写 release，读 acquire。</p>

<script>
(function () {
  var root = document.documentElement, svg = document.getElementById('sp'), LAST = 6, k = 0, timer = null;
  var D = {"texts": ["开始时 data 在两个核的缓存里（S），ready 只在核 0 的缓存里（E）。点“下一步”开始，也可以用键盘的左右方向键。", "核 0 执行 data = 42：写进 store buffer，指令就退休了，后面的 ready = true 排在它后面。", "核 0 已有 data（S），只差独占权，不用 RFO 取数据，只发 invalidate 请求；snoop filter 只把它发给核 1。", "核 1 把 invalidate 请求放进 invalidate queue，马上回 ACK。L1D 里的 data 没动，还是旧的 0。", "核 0 收齐 ACK，data 行变 M，42 写进 L1D。ready 只在核 0 的缓存里，不用问别人，接着写进去。", "核 1 读 ready：本地没有这条行，发 Read；行在核 0 里，核 0 经互连直接转过来（缓存间转发），退出循环。两边都变 S。", "核 1 读 data：L1D 命中，可 invalidate 请求还排在队列里，读到旧值 0。"], "step": "第 {k} 步，共 6 步", "step0": "开始之前", "colors": {"1": "#1f2328", "2": "#bc4c00", "3": "#1a7f37", "4": "#1f2328", "5": "#0969da", "6": "#cf222e"}, "play": "自动播放", "pause": "暂停"};
  var parts = svg.querySelectorAll('[data-from]');
  svg.querySelectorAll('.inv, .ack, .data').forEach(function (p) {
    p.style.setProperty('--len', Math.ceil(p.getTotalLength ? p.getTotalLength() : 600));
  });
  function theme() {
    var t = null;
    try { if (window.parent !== window) t = window.parent.document.documentElement.dataset.theme; } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    root.classList.toggle('dark', t !== 'light');
  }
  theme();
  try { if (window.parent !== window) new MutationObserver(theme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', theme);
  function fit() {
    try { if (window.frameElement) window.frameElement.style.height = document.body.scrollHeight + 'px'; } catch (e) {}
  }
  var head = document.getElementById('head'), txt = document.getElementById('txt'), note = document.getElementById('note');
  var bPrev = document.getElementById('prev'), bNext = document.getElementById('next'), bPlay = document.getElementById('play');
  function show(n) {
    k = Math.max(0, Math.min(LAST, n));
    parts.forEach(function (el) {
      var on = k >= +el.dataset.from && k <= +el.dataset.to;
      el.classList.toggle('hide', !on);
      el.classList.remove('cur');
      if (on && el.dataset.step !== undefined && +el.dataset.step === k) { void el.getBBox(); el.classList.add('cur'); }
    });
    head.innerHTML = k ? '<span class="num" style="background:' + D.colors[k] + '">' + k + '</span>' + D.step.replace('{k}', k) : D.step0;
    txt.textContent = D.texts[k];
    note.hidden = k !== LAST;
    bPrev.disabled = k === 0;
    bNext.disabled = k === LAST;
    fit();
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } bPlay.textContent = D.play; }
  function play() {
    if (timer) { stop(); return; }
    if (k === LAST) show(0);
    bPlay.textContent = D.pause;
    timer = setInterval(function () { if (k >= LAST) stop(); else show(k + 1); }, 2400);
  }
  bPrev.onclick = function () { stop(); show(k - 1); };
  bNext.onclick = function () { stop(); show(k + 1); };
  bPlay.onclick = play;
  document.getElementById('reset').onclick = function () { stop(); show(0); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { stop(); show(k + 1); }
    if (e.key === 'ArrowLeft') { stop(); show(k - 1); }
  });
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  show(0);
})();
</script>
