<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="1100" height="450" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<style>.t{font-size:14px;font-weight:600;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.h{font-size:18px;font-weight:700;fill:#1f2328}.m{font-size:12.5px;fill:#1f2328;font-family:Menlo,Consolas,monospace}.ln{stroke-width:1.6;fill:none}</style></defs>
<rect x="0" y="0" width="1100" height="450" fill="#ffffff"/>
<text x="20" y="34" class="h">The SPMC broadcast ring: three readers, three cases, at the same moment</text>
<text x="20" y="58" class="s">CNT = 8, the producer has written 11 messages. Message n goes to slot n mod 8; each slot records which message it holds (its stamp). Readers decide with int(stamp − next_idx).</text>
<rect x="150" y="160" width="100" height="64" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="200" y="152" text-anchor="middle" class="s">slot 0</text>
<text x="200" y="188" text-anchor="middle" class="t">stamp 8</text>
<text x="200" y="208" text-anchor="middle" class="s">msg 8</text>
<rect x="250" y="160" width="100" height="64" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="300" y="152" text-anchor="middle" class="s">slot 1</text>
<text x="300" y="188" text-anchor="middle" class="t">stamp 9</text>
<text x="300" y="208" text-anchor="middle" class="s">msg 9</text>
<rect x="350" y="160" width="100" height="64" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="400" y="152" text-anchor="middle" class="s">slot 2</text>
<text x="400" y="188" text-anchor="middle" class="t">stamp 10</text>
<text x="400" y="208" text-anchor="middle" class="s">msg 10</text>
<rect x="450" y="160" width="100" height="64" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="500" y="152" text-anchor="middle" class="s">slot 3</text>
<text x="500" y="188" text-anchor="middle" class="t">stamp 11</text>
<text x="500" y="208" text-anchor="middle" class="s">msg 11</text>
<rect x="550" y="160" width="100" height="64" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="600" y="152" text-anchor="middle" class="s">slot 4</text>
<text x="600" y="188" text-anchor="middle" class="t">stamp 4</text>
<text x="600" y="208" text-anchor="middle" class="s">msg 4</text>
<rect x="650" y="160" width="100" height="64" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="700" y="152" text-anchor="middle" class="s">slot 5</text>
<text x="700" y="188" text-anchor="middle" class="t">stamp 5</text>
<text x="700" y="208" text-anchor="middle" class="s">msg 5</text>
<rect x="750" y="160" width="100" height="64" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="800" y="152" text-anchor="middle" class="s">slot 6</text>
<text x="800" y="188" text-anchor="middle" class="t">stamp 6</text>
<text x="800" y="208" text-anchor="middle" class="s">msg 6</text>
<rect x="850" y="160" width="100" height="64" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="900" y="152" text-anchor="middle" class="s">slot 7</text>
<text x="900" y="188" text-anchor="middle" class="t">stamp 7</text>
<text x="900" y="208" text-anchor="middle" class="s">msg 7</text>
<text x="20" y="188" class="t">Ring</text><text x="20" y="208" class="s">CNT = 8</text>
<path d="M500,98 L500,136" class="ln" stroke="#1a7f37" marker-end="url(#a)"/>
<text x="510" y="108" class="t" style="fill:#1a7f37">Producer: write_idx = 11</text>
<text x="510" y="126" class="s">message 12 goes into slot 4, overwriting message 4</text>
<text x="20" y="432" class="s">blue = written this lap (8–11)   grey = left from the last lap (4–7)   green = just written</text>
<path d="M187,290 L187,276 L400,276 L400,230" class="ln" stroke="#cf222e" stroke-dasharray="5 3" marker-end="url(#a)"/>
<rect x="20" y="290" width="334" height="112" rx="6" fill="#ffffff" stroke="#cf222e" stroke-width="1.3"/>
<text x="34" y="314" class="t" style="fill:#cf222e">Reader C: next_idx = 2 — lapped</text>
<text x="34" y="336" class="m">stamp 10 − 2 = +8 &gt; 0</text>
<text x="34" y="358" class="s">returns message 10, next_idx becomes 11;</text>
<text x="34" y="380" class="s">messages 2–9 silently lost (a multiple of 8)</text>
<path d="M550,290 L550,276 L600,276 L600,230" class="ln" stroke="#57606a" stroke-dasharray="5 3" marker-end="url(#a)"/>
<rect x="383" y="290" width="334" height="112" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.3"/>
<text x="397" y="314" class="t" style="fill:#57606a">Reader A: next_idx = 12 — not written yet</text>
<text x="397" y="336" class="m">stamp 4 − 12 = −8 &lt; 0</text>
<text x="397" y="358" class="s">the slot still holds last lap's message,</text>
<text x="397" y="380" class="s">returns nullptr</text>
<path d="M913,290 L913,276 L800,276 L800,230" class="ln" stroke="#1a7f37" stroke-dasharray="5 3" marker-end="url(#a)"/>
<rect x="746" y="290" width="334" height="112" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.3"/>
<text x="760" y="314" class="t" style="fill:#1a7f37">Reader B: next_idx = 6 — exactly right</text>
<text x="760" y="336" class="m">stamp 6 − 6 = 0</text>
<text x="760" y="358" class="s">returns message 6,</text>
<text x="760" y="380" class="s">next_idx becomes 7</text>
</svg>