<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="1100" height="450" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<style>.t{font-size:14px;font-weight:600;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.h{font-size:18px;font-weight:700;fill:#1f2328}.m{font-size:12.5px;fill:#1f2328;font-family:Menlo,Consolas,monospace}.ln{stroke-width:1.6;fill:none}</style></defs>
<rect x="0" y="0" width="1100" height="450" fill="#ffffff"/>
<text x="20" y="34" class="h">SPMC 广播环:同一时刻,三个读者看到三种情形</text>
<text x="20" y="58" class="s">CNT = 8,生产者已经写了 11 条:第 n 条写在槽 n mod 8,槽里记着"我装的是第几条"(戳)。读者各自用 int(戳 − next_idx) 判断。</text>
<rect x="150" y="160" width="100" height="64" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="200" y="152" text-anchor="middle" class="s">槽 0</text>
<text x="200" y="188" text-anchor="middle" class="t">戳 8</text>
<text x="200" y="208" text-anchor="middle" class="s">第 8 条</text>
<rect x="250" y="160" width="100" height="64" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="300" y="152" text-anchor="middle" class="s">槽 1</text>
<text x="300" y="188" text-anchor="middle" class="t">戳 9</text>
<text x="300" y="208" text-anchor="middle" class="s">第 9 条</text>
<rect x="350" y="160" width="100" height="64" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="400" y="152" text-anchor="middle" class="s">槽 2</text>
<text x="400" y="188" text-anchor="middle" class="t">戳 10</text>
<text x="400" y="208" text-anchor="middle" class="s">第 10 条</text>
<rect x="450" y="160" width="100" height="64" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="500" y="152" text-anchor="middle" class="s">槽 3</text>
<text x="500" y="188" text-anchor="middle" class="t">戳 11</text>
<text x="500" y="208" text-anchor="middle" class="s">第 11 条</text>
<rect x="550" y="160" width="100" height="64" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="600" y="152" text-anchor="middle" class="s">槽 4</text>
<text x="600" y="188" text-anchor="middle" class="t">戳 4</text>
<text x="600" y="208" text-anchor="middle" class="s">第 4 条</text>
<rect x="650" y="160" width="100" height="64" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="700" y="152" text-anchor="middle" class="s">槽 5</text>
<text x="700" y="188" text-anchor="middle" class="t">戳 5</text>
<text x="700" y="208" text-anchor="middle" class="s">第 5 条</text>
<rect x="750" y="160" width="100" height="64" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="800" y="152" text-anchor="middle" class="s">槽 6</text>
<text x="800" y="188" text-anchor="middle" class="t">戳 6</text>
<text x="800" y="208" text-anchor="middle" class="s">第 6 条</text>
<rect x="850" y="160" width="100" height="64" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="900" y="152" text-anchor="middle" class="s">槽 7</text>
<text x="900" y="188" text-anchor="middle" class="t">戳 7</text>
<text x="900" y="208" text-anchor="middle" class="s">第 7 条</text>
<text x="20" y="188" class="t">环</text><text x="20" y="208" class="s">CNT = 8</text>
<path d="M500,98 L500,136" class="ln" stroke="#1a7f37" marker-end="url(#a)"/>
<text x="510" y="108" class="t" style="fill:#1a7f37">生产者:write_idx = 11</text>
<text x="510" y="126" class="s">下一条(第 12 条)写进槽 4,覆盖第 4 条</text>
<text x="20" y="432" class="s">蓝 = 这一圈新写的(8–11)   灰 = 上一圈留下的(4–7)   绿 = 刚写好的</text>
<path d="M187,290 L187,276 L400,276 L400,230" class="ln" stroke="#cf222e" stroke-dasharray="5 3" marker-end="url(#a)"/>
<rect x="20" y="290" width="334" height="112" rx="6" fill="#ffffff" stroke="#cf222e" stroke-width="1.3"/>
<text x="34" y="314" class="t" style="fill:#cf222e">读者 C:next_idx = 2 —— 被套圈</text>
<text x="34" y="336" class="m">戳 10 − 2 = +8 &gt; 0</text>
<text x="34" y="358" class="s">返回第 10 条,next_idx 变成 11;</text>
<text x="34" y="380" class="s">第 2–9 条无声地丢了(差值总是 8 的倍数)</text>
<path d="M550,290 L550,276 L600,276 L600,230" class="ln" stroke="#57606a" stroke-dasharray="5 3" marker-end="url(#a)"/>
<rect x="383" y="290" width="334" height="112" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.3"/>
<text x="397" y="314" class="t" style="fill:#57606a">读者 A:next_idx = 12 —— 还没写到</text>
<text x="397" y="336" class="m">戳 4 − 12 = −8 &lt; 0</text>
<text x="397" y="358" class="s">槽里还是上一圈的旧消息,</text>
<text x="397" y="380" class="s">返回 nullptr</text>
<path d="M913,290 L913,276 L800,276 L800,230" class="ln" stroke="#1a7f37" stroke-dasharray="5 3" marker-end="url(#a)"/>
<rect x="746" y="290" width="334" height="112" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.3"/>
<text x="760" y="314" class="t" style="fill:#1a7f37">读者 B:next_idx = 6 —— 正好</text>
<text x="760" y="336" class="m">戳 6 − 6 = 0</text>
<text x="760" y="358" class="s">返回第 6 条,</text>
<text x="760" y="380" class="s">next_idx 变成 7</text>
</svg>