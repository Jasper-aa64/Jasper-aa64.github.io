<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 670" width="1100" height="670" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><style>.h{font-size:18px;font-weight:700;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.p{font-size:14px;font-weight:700;fill:#1f2328}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#1f2328}.l{font-size:12.5px;fill:#1f2328}.lb{font-size:12.5px;font-weight:700;fill:#1f2328}.b{font-size:12.5px;font-weight:700;fill:#2a78d6}.v{font-size:12px;fill:#57606a}.vb{font-size:12px;font-weight:700;fill:#2a78d6}.r{font-size:12.5px;font-weight:700;fill:#cf222e}</style></defs>
<rect x="0" y="0" width="1100" height="670" fill="#ffffff"/>
<text class="h" x="20" y="32">Disruptor: one flag per slot, one edge per item straight to the consumer, no edge between producers</text>
<text class="s" x="20" y="54">A gets 5, B gets 6; B finishes first; consumer in the middle. Grey = order within a thread, blue = a release read by an acquire. Blue boxes: the data's path.</text>
<rect x="20" y="70" width="330" height="490" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="p" x="36" y="96">Producer A: gets 5</text>
<rect x="385" y="70" width="330" height="490" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="p" x="401" y="96">Consumer (only one)</text>
<rect x="750" y="70" width="330" height="490" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="p" x="766" y="96">Producer B: gets 6</text>
<rect x="36" y="112" width="298" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="46" y="130">claim_.fetch_add(1, relaxed)→5 ①</text>
<rect x="36" y="170" width="298" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="46" y="188">consumed_.load(acquire)≥5−N  ②</text>
<text class="v" x="46" y="213">not full: slot 5's last-lap item was read</text>
<rect x="36" y="228" width="298" height="26" rx="5" fill="#ddf4ff" stroke="#2a78d6" stroke-width="2"/>
<text class="c" x="46" y="246">slot(5) = v;                 ③</text>
<rect x="36" y="286" width="298" height="26" rx="5" fill="#ddf4ff" stroke="#2a78d6" stroke-width="2"/>
<text class="c" x="46" y="304">avail_[5].store(lap, release)④</text>
<line x1="298" y1="138" x2="298" y2="167" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="298" y1="196" x2="298" y2="225" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="298" y1="254" x2="298" y2="283" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<rect x="766" y="112" width="298" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="776" y="130">claim_.fetch_add(1, relaxed)→6 ①</text>
<rect x="766" y="170" width="298" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="776" y="188">consumed_.load(acquire)≥6−N  ②</text>
<rect x="766" y="228" width="298" height="26" rx="5" fill="#ddf4ff" stroke="#2a78d6" stroke-width="2"/>
<text class="c" x="776" y="246">slot(6) = v;                 ③</text>
<rect x="766" y="286" width="298" height="26" rx="5" fill="#ddf4ff" stroke="#2a78d6" stroke-width="2"/>
<text class="c" x="776" y="304">avail_[6].store(lap, release)④</text>
<text class="v" x="776" y="329">done first: flags it and returns, no wait for A</text>
<line x1="1028" y1="138" x2="1028" y2="167" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="1028" y1="196" x2="1028" y2="225" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="1028" y1="254" x2="1028" y2="283" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<text class="v" x="411" y="130">until now avail_[5] held the last lap: stops here</text>
<rect x="401" y="344" width="298" height="26" rx="5" fill="#ddf4ff" stroke="#2a78d6" stroke-width="2"/>
<text class="c" x="411" y="362">avail_[5].load(acquire) == lap</text>
<text class="vb" x="411" y="387">reads A's flag</text>
<rect x="401" y="402" width="298" height="26" rx="5" fill="#ddf4ff" stroke="#2a78d6" stroke-width="2"/>
<text class="c" x="411" y="420">out = buf_[5];</text>
<rect x="401" y="460" width="298" height="26" rx="5" fill="#ddf4ff" stroke="#2a78d6" stroke-width="2"/>
<text class="c" x="411" y="478">avail_[6].load(acquire) == lap</text>
<text class="vb" x="411" y="503">reads B's flag</text>
<rect x="401" y="518" width="298" height="26" rx="5" fill="#ddf4ff" stroke="#2a78d6" stroke-width="2"/>
<text class="c" x="411" y="536">out = buf_[6];</text>
<line x1="663" y1="370" x2="663" y2="399" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="663" y1="428" x2="663" y2="457" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="663" y1="486" x2="663" y2="515" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="334" y1="299" x2="398" y2="357" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ab)"/>
<line x1="766" y1="299" x2="702" y2="473" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ab)"/>
<text class="lb" x="20" y="596">One edge per slot: slot 5 goes from A's ④ to the acquire that reads avail_[5], slot 6 from B's ④ to the one that reads avail_[6]; nobody relays.</text>
<text class="r" x="20" y="622">No edge between A and B, and none needed; the cost lands on the consumer: until avail_[5] shows this lap, it stops at that slot and can't skip ahead to 6.</text>
<text class="l" x="20" y="648">① only hands out numbers, so relaxed; ② acquires the consumed_ the consumer released after reading, so old data is read before it's overwritten (2.4's backpressure).</text>
</svg>
