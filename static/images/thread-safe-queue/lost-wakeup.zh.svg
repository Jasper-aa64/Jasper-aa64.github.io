<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs><marker id="a57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="acf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="a1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><style>
.h{font-size:20px;font-weight:700;fill:#1f2328}.s{font-size:13px;fill:#57606a}.lane{font-size:14px;font-weight:700;fill:#1f2328}
.t{font-size:15px;font-weight:700;fill:#1f2328}.b{font-size:12.5px;font-weight:600;fill:#1f2328}.k{font-size:13px;fill:#57606a}
.bad{font-size:13px;font-weight:600;fill:#cf222e}
</style></defs>
<rect x="0" y="0" width="1240" height="560" fill="#ffffff"/>
<text x="24" y="36" class="h" text-anchor="start">丢失唤醒：通知落在“查过条件、还没睡下”的空档里</text>
<text x="24" y="62" class="s" text-anchor="start">消费者：加锁 → 查 cursor &gt;= seq → 不满足就睡（cv.wait 睡下的同时放锁）。生产者：cursor.store(seq) → notify_all()。</text>
<line x1="130" y1="84" x2="1210" y2="84" stroke="#8c959f" stroke-width="1.2" marker-end="url(#a57606a)"/>
<text x="1210" y="78" class="k" text-anchor="end">时间 →</text>
<text x="24" y="112" class="t" text-anchor="start">生产者不拿锁：通知可以落进空档</text>
<rect x="452" y="126" width="268" height="112" rx="8" fill="#ffebe9" fill-opacity="0.45" stroke="#cf222e" stroke-dasharray="5 4"/>
<text x="586" y="119" class="bad" text-anchor="middle">空档：查过了，还没睡下</text>
<text x="118" y="157" class="lane" text-anchor="end">消费者</text>
<text x="118" y="217" class="lane" text-anchor="end">生产者</text>
<rect x="130" y="136" width="90" height="32" rx="6" fill="#eaeef2" stroke="#8c959f" stroke-width="1.3"/>
<text x="175.0" y="157" class="b" text-anchor="middle">加锁</text>
<rect x="220" y="136" width="230" height="32" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="335.0" y="157" class="b" text-anchor="middle">查条件：不满足</text>
<rect x="722" y="136" width="178" height="32" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.3"/>
<text x="811.0" y="157" class="b" text-anchor="middle">睡下（同时放锁）</text>
<rect x="900" y="136" width="310" height="32" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.3"/>
<text x="1055.0" y="157" class="b" text-anchor="middle">一直睡：没人再叫它</text>
<rect x="470" y="196" width="110" height="32" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
<text x="525.0" y="217" class="b" text-anchor="middle">cursor = seq</text>
<rect x="590" y="196" width="120" height="32" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.3"/>
<text x="650.0" y="217" class="b" text-anchor="middle">notify</text>
<line x1="650" y1="194" x2="650" y2="170" stroke="#cf222e" stroke-width="1.6" marker-end="url(#acf222e)"/>
<text x="590" y="252" class="bad" text-anchor="start">notify：没人在睡，落空</text>
<text x="24" y="300" class="t" text-anchor="start">生产者通知前先拿一下锁：通知只能在它睡下之后</text>
<text x="118" y="345" class="lane" text-anchor="end">消费者</text>
<text x="118" y="405" class="lane" text-anchor="end">生产者</text>
<rect x="130" y="324" width="90" height="32" rx="6" fill="#eaeef2" stroke="#8c959f" stroke-width="1.3"/>
<text x="175.0" y="345" class="b" text-anchor="middle">加锁</text>
<rect x="220" y="324" width="230" height="32" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
<text x="335.0" y="345" class="b" text-anchor="middle">查条件：不满足</text>
<rect x="450" y="324" width="180" height="32" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.3"/>
<text x="540.0" y="345" class="b" text-anchor="middle">睡下（同时放锁）</text>
<rect x="630" y="324" width="210" height="32" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.3"/>
<text x="735.0" y="345" class="b" text-anchor="middle">睡着</text>
<rect x="860" y="324" width="350" height="32" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
<text x="1035.0" y="345" class="b" text-anchor="middle">被叫醒，重新加锁，再查：满足</text>
<rect x="330" y="384" width="110" height="32" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
<text x="385.0" y="405" class="b" text-anchor="middle">cursor = seq</text>
<rect x="440" y="384" width="190" height="32" rx="6" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.3"/>
<text x="535.0" y="405" class="b" text-anchor="middle">加锁：等它放锁</text>
<rect x="630" y="384" width="70" height="32" rx="6" fill="#eaeef2" stroke="#8c959f" stroke-width="1.3"/>
<text x="665.0" y="405" class="b" text-anchor="middle">放锁</text>
<rect x="710" y="384" width="90" height="32" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
<text x="755.0" y="405" class="b" text-anchor="middle">notify</text>
<line x1="630" y1="358" x2="630" y2="382" stroke="#57606a" stroke-width="1.6" marker-end="url(#a57606a)"/>
<line x1="800" y1="392" x2="856" y2="350" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#a1a7f37)"/>
<line x1="24" y1="462" x2="1216" y2="462" stroke="#d0d7de"/>
<text x="24" y="494" class="k" text-anchor="start">消费者从查条件到睡下一直拿着锁，生产者要拿到这把锁，只能等它睡下；修法就是在 store 之后加一句 { std::lock_guard lk(m); }。</text>
</svg>
