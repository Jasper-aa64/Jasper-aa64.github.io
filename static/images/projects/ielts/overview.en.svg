<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><style>.h{font-size:19px;font-weight:700;fill:#1f2328}.t{font-size:15px;font-weight:700;fill:#1f2328}.b{font-size:13px;font-weight:600;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.k{font-size:12px;fill:#57606a}.lane{font-size:14px;font-weight:700;fill:#1f2328}</style></defs>
<rect x="0" y="0" width="1000" height="630" fill="#ffffff"/>
<text x="20" y="34" class="h" text-anchor="start">Today: a desktop shell around the web app, with real-time voice in a C++ engine</text>
<rect x="20" y="60" width="440" height="392" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
<text x="34" y="84" class="t" text-anchor="start">Qt desktop shell (desktop/, QtWebEngine)</text>
<rect x="36" y="98" width="408" height="118" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="50" y="122" class="t" text-anchor="start">Web front end (web/static, SPA)</text>
<text x="50" y="144" class="s" text-anchor="start">IELTS speaking, writing; interview mode in desktop only</text>
<text x="50" y="164" class="s" text-anchor="start">Recording: MediaRecorder; playback: howler.js</text>
<text x="50" y="184" class="s" text-anchor="start">Preprocessing: audio_core built to WASM</text>
<text x="50" y="204" class="s" text-anchor="start">interview-voice.js: read, listen, captions</text>
<rect x="36" y="230" width="408" height="56" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="50" y="253" class="b" text-anchor="start">QWebChannel bridge</text>
<text x="50" y="274" class="s" text-anchor="start">studioNative reports; studioVoice: control and text only</text>
<rect x="36" y="300" width="408" height="136" rx="10" fill="#fbefff" stroke="#c297ff"/>
<text x="50" y="324" class="t" text-anchor="start">Real-time voice engine voice_engine (C++)</text>
<text x="50" y="346" class="s" text-anchor="start">VoiceSession: control, capture, playback threads</text>
<text x="50" y="366" class="s" text-anchor="start">RealtimeClient: one I/O thread owns the connection</text>
<text x="50" y="386" class="s" text-anchor="start">PortAudio: 20 ms mic reads, 40 ms speaker writes</text>
<text x="50" y="406" class="s" text-anchor="start">Interview pressure mode: read + listen; else captions</text>
<path d="M240,216 L240,230" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M240,286 L240,300" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="500" y="60" width="240" height="150" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
<text x="514" y="84" class="t" text-anchor="start">Django (ASGI)</text>
<text x="514" y="106" class="s" text-anchor="start">speaking · writing · interview</text>
<text x="514" y="126" class="s" text-anchor="start">ai · billing · accounts</text>
<text x="514" y="146" class="s" text-anchor="start">Questions, follow-ups, scoring</text>
<text x="514" y="166" class="s" text-anchor="start">PCM WebSocket relay (off by default)</text>
<rect x="500" y="228" width="240" height="70" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
<text x="514" y="252" class="t" text-anchor="start">AI worker</text>
<text x="514" y="274" class="s" text-anchor="start">Scans AITask: section scores, writing</text>
<rect x="500" y="314" width="240" height="36" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="620" y="337" class="s" text-anchor="middle">SQLite · audio files · question banks</text>
<rect x="770" y="60" width="210" height="292" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="6 4"/>
<text x="784" y="84" class="t" text-anchor="start">Outside services</text>
<text x="784" y="106" class="s" text-anchor="start">LLM over HTTP (OpenAI API)</text>
<text x="784" y="126" class="s" text-anchor="start">Codex CLI (fallback)</text>
<text x="784" y="146" class="s" text-anchor="start">Volcengine TTS</text>
<text x="784" y="166" class="s" text-anchor="start">Volcengine ASR (Python)</text>
<text x="784" y="186" class="s" text-anchor="start">Volcengine real-time dialogue</text>
<path d="M444,150 L500,150" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="472" y="142" class="k" text-anchor="middle">HTTP / SSE</text>
<path d="M740,130 L770,130" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M740,262 L770,240" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M620,210 L620,228" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M444,400 L875,400 L875,352" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="660" y="392" class="k" text-anchor="middle">WebSocket (TLS, certificate checked)</text>
<rect x="20" y="476" width="960" height="134" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-dasharray="6 4"/>
<text x="34" y="502" class="t" text-anchor="start" style="fill:#cf222e">Other native C++ voice code: not in the product</text>
<rect x="36" y="518" width="300" height="76" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="50" y="542" class="b" text-anchor="start">March prototype (src/interview)</text>
<text x="50" y="564" class="s" text-anchor="start">Shares RealtimeClient with the engine</text>
<text x="50" y="584" class="s" text-anchor="start">Own threads and state machine unchanged</text>
<rect x="350" y="518" width="300" height="76" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="364" y="542" class="b" text-anchor="start">IELTS command line (src/ielts)</text>
<text x="364" y="564" class="s" text-anchor="start">Reuses the recognition half of it</text>
<text x="364" y="584" class="s" text-anchor="start">Examiner audio arrives and is dropped</text>
<rect x="664" y="518" width="300" height="76" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="678" y="542" class="b" text-anchor="start">native_voice (new, 10-05)</text>
<text x="678" y="564" class="s" text-anchor="start">Device layer only, echoes the mic</text>
<text x="678" y="584" class="s" text-anchor="start">Separate project, not in any product build</text>
</svg>
