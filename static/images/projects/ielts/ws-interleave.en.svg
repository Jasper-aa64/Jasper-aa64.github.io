<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><style>.h{font-size:19px;font-weight:700;fill:#1f2328}.t{font-size:15px;font-weight:700;fill:#1f2328}.b{font-size:13px;font-weight:600;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.k{font-size:12px;fill:#57606a}.lane{font-size:14px;font-weight:700;fill:#1f2328}</style></defs>
<rect x="0" y="0" width="1000" height="330" fill="#ffffff"/>
<text x="20" y="34" class="h" text-anchor="start">Collision 1: what the server receives when two writes interleave</text>
<text x="20" y="85" class="b" text-anchor="start">Microphone sends</text>
<rect x="190" y="60" width="170" height="40" rx="4" fill="#dafbe1" stroke="#4ac26b"/>
<text x="275.0" y="85" class="b" text-anchor="middle">header A (len 6400+)</text>
<rect x="360" y="60" width="420" height="40" rx="4" fill="#dafbe1" stroke="#4ac26b"/>
<text x="570.0" y="85" class="b" text-anchor="middle">6400+ bytes of audio</text>
<text x="20" y="145" class="b" text-anchor="start">Playback sends</text>
<rect x="190" y="120" width="100" height="40" rx="4" fill="#fff8c5" stroke="#d4a72c"/>
<text x="240.0" y="145" class="b" text-anchor="middle">header B</text>
<rect x="290" y="120" width="160" height="40" rx="4" fill="#fff8c5" stroke="#d4a72c"/>
<text x="370.0" y="145" class="b" text-anchor="middle">text query</text>
<text x="20" y="215" class="b" text-anchor="start">On TCP it may be</text>
<rect x="190" y="190" width="170" height="40" rx="4" fill="#dafbe1" stroke="#4ac26b"/>
<text x="275.0" y="215" class="b" text-anchor="middle">header A (len 6400+)</text>
<rect x="360" y="190" width="170" height="40" rx="4" fill="#dafbe1" stroke="#4ac26b"/>
<text x="445.0" y="215" class="b" text-anchor="middle">audio, 1st half</text>
<rect x="530" y="190" width="100" height="40" rx="4" fill="#fff8c5" stroke="#d4a72c"/>
<text x="580.0" y="215" class="b" text-anchor="middle">header B</text>
<rect x="630" y="190" width="160" height="40" rx="4" fill="#fff8c5" stroke="#d4a72c"/>
<text x="710.0" y="215" class="b" text-anchor="middle">text query</text>
<rect x="790" y="190" width="170" height="40" rx="4" fill="#dafbe1" stroke="#4ac26b"/>
<text x="875.0" y="215" class="b" text-anchor="middle">audio, 2nd half</text>
<path d="M360,240 L360,250 L890,250 L890,240" fill="none" stroke="#cf222e" stroke-width="2"/>
<text x="190" y="278" class="s" text-anchor="start" style="fill:#cf222e">The server reads 6400+ bytes after header A: the text query is taken as audio</text>
<text x="190" y="300" class="s" text-anchor="start" style="fill:#cf222e">The rest of the audio is parsed as the next header → protocol error, close</text>
</svg>
