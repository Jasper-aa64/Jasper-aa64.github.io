<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><style>.h{font-size:19px;font-weight:700;fill:#1f2328}.t{font-size:15px;font-weight:700;fill:#1f2328}.b{font-size:13px;font-weight:600;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.k{font-size:12px;fill:#57606a}.lane{font-size:14px;font-weight:700;fill:#1f2328}</style></defs>
<rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
<text x="20" y="34" class="h" text-anchor="start">三个进程、四类外部服务、一个数据库：实时的事在请求里做，慢的事交给 worker</text>
<rect x="20" y="64" width="270" height="300" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
<text x="155" y="90" class="t" text-anchor="middle">浏览器：单页前端</text>
<text x="36" y="122" class="s" text-anchor="start">录音（MediaRecorder）</text>
<text x="36" y="152" class="s" text-anchor="start">浏览器自带听写出转写</text>
<text x="36" y="182" class="s" text-anchor="start">播考官语音（howler.js）</text>
<text x="36" y="212" class="s" text-anchor="start">可选：WASM 音频预处理</text>
<text x="36" y="242" class="s" text-anchor="start">  （VAD、裁静音、重采样）</text>
<text x="36" y="272" class="s" text-anchor="start">可选：16 kHz PCM 实时上行</text>
<text x="36" y="302" class="s" text-anchor="start">每 2.5 秒查一次评分任务</text>
<rect x="360" y="64" width="300" height="210" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
<text x="510" y="90" class="t" text-anchor="middle">Django 进程（ASGI）</text>
<text x="376" y="120" class="s" text-anchor="start">开场：抽题，建练习和每一轮</text>
<text x="376" y="147" class="s" text-anchor="start">收录音、提交一轮</text>
<text x="376" y="174" class="s" text-anchor="start">流式追问：SSE 逐字下发</text>
<text x="376" y="201" class="s" text-anchor="start">考官语音：合成、按句缓存、预热</text>
<text x="376" y="228" class="s" text-anchor="start">报告、语料库、写作、计费接口</text>
<text x="376" y="255" class="s" text-anchor="start">WebSocket：PCM 上行 → 实时识别</text>
<rect x="420" y="300" width="240" height="110" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
<text x="540" y="326" class="t" text-anchor="middle">AI worker 进程</text>
<text x="434" y="352" class="s" text-anchor="start">每 1–2.5 秒扫一次任务表</text>
<text x="434" y="374" class="s" text-anchor="start">认领 → 调模型 → 写回报告</text>
<text x="434" y="396" class="s" text-anchor="start">超过 900 秒没做完的任务收回重排</text>
<rect x="730" y="64" width="250" height="346" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="6 4"/>
<text x="855" y="90" class="t" text-anchor="middle">外部服务</text>
<rect x="746" y="104" width="218" height="62" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="855" y="129" class="b" text-anchor="middle">语音合成</text>
<text x="855" y="150" class="k" text-anchor="middle">考官和示范回答的语音</text>
<rect x="746" y="179" width="218" height="62" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="855" y="204" class="b" text-anchor="middle">语音识别</text>
<text x="855" y="225" class="k" text-anchor="middle">录音转写的后备、实时转写</text>
<rect x="746" y="254" width="218" height="62" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="855" y="279" class="b" text-anchor="middle">大模型 HTTP 流式接口</text>
<text x="855" y="300" class="k" text-anchor="middle">追问、评分的首选</text>
<rect x="746" y="329" width="218" height="62" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="855" y="354" class="b" text-anchor="middle">本机命令行编码代理</text>
<text x="855" y="375" class="k" text-anchor="middle">HTTP 失败时兜底，慢</text>
<path d="M290,130 L360,130" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="325" y="122" class="k" text-anchor="middle">HTTP / SSE</text>
<path d="M290,250 L360,250" fill="none" stroke="#57606a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="325" y="242" class="k" text-anchor="middle">WS（可选）</text>
<path d="M660,135 L746,135" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M660,190 L746,210" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M660,250 L746,279" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<text x="690" y="246" class="k" text-anchor="start">追问</text>
<path d="M660,330 L746,295" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M660,370 L746,360" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<text x="672" y="392" class="k" text-anchor="start">整节评分</text>
<rect x="20" y="450" width="960" height="172" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="36" y="476" class="t" text-anchor="start">数据</text>
<rect x="340" y="490" width="340" height="116" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="354" y="514" class="b" text-anchor="start">SQLite（几张主表）</text>
<text x="354" y="540" class="s" text-anchor="start">练习 Attempt → 每一轮 Turn → 报告</text>
<text x="354" y="562" class="s" text-anchor="start">AI 任务表 AITask：状态、重试、来源</text>
<text x="354" y="584" class="s" text-anchor="start">钱包、预留、流水；语料库、拼写词</text>
<rect x="36" y="490" width="284" height="116" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="50" y="514" class="b" text-anchor="start">文件</text>
<text x="50" y="540" class="s" text-anchor="start">候选人录音、合成好的语音</text>
<text x="50" y="562" class="s" text-anchor="start">表里只存路径</text>
<rect x="700" y="490" width="264" height="116" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="714" y="514" class="b" text-anchor="start">题库 JSON</text>
<text x="714" y="540" class="s" text-anchor="start">口语按季度、写作按来源</text>
<text x="714" y="562" class="s" text-anchor="start">启动时导入</text>
<path d="M385,274 L385,490" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M480,410 L480,490" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M600,410 L600,490" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="608" y="452" class="k" text-anchor="start">轮询任务表</text>
</svg>
