<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><style>.h{font-size:19px;font-weight:700;fill:#1f2328}.t{font-size:15px;font-weight:700;fill:#1f2328}.b{font-size:13px;font-weight:600;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.k{font-size:12px;fill:#57606a}.lane{font-size:14px;font-weight:700;fill:#1f2328}</style></defs>
<rect x="0" y="0" width="1000" height="630" fill="#ffffff"/>
<text x="20" y="34" class="h" text-anchor="start">现在的样子：桌面壳套网页，实时语音由壳里的 C++ 引擎做；其余 C++ 语音还没接进来</text>
<rect x="20" y="60" width="440" height="392" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
<text x="34" y="84" class="t" text-anchor="start">Qt 桌面壳（desktop/，QtWebEngine）</text>
<rect x="36" y="98" width="408" height="118" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="50" y="122" class="t" text-anchor="start">网页前端（web/static，单页）</text>
<text x="50" y="144" class="s" text-anchor="start">IELTS 口语、写作；面试模式只在桌面版显示</text>
<text x="50" y="164" class="s" text-anchor="start">录音 MediaRecorder，播放 howler.js</text>
<text x="50" y="184" class="s" text-anchor="start">录音预处理：audio_core 编成的 WASM</text>
<text x="50" y="204" class="s" text-anchor="start">interview-voice.js：念题、收听、字幕</text>
<rect x="36" y="230" width="408" height="56" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="50" y="253" class="b" text-anchor="start">QWebChannel 桥</text>
<text x="50" y="274" class="s" text-anchor="start">studioNative 报能力；studioVoice 只传控制和文字，不传 PCM</text>
<rect x="36" y="300" width="408" height="136" rx="10" fill="#fbefff" stroke="#c297ff"/>
<text x="50" y="324" class="t" text-anchor="start">实时语音引擎 voice_engine（C++）</text>
<text x="50" y="346" class="s" text-anchor="start">VoiceSession：控制、采集、播放三个线程，不含题目内容</text>
<text x="50" y="366" class="s" text-anchor="start">RealtimeClient：一个 I/O 线程独占连接</text>
<text x="50" y="386" class="s" text-anchor="start">PortAudio：20 ms 读麦克风，40 ms 写扬声器</text>
<text x="50" y="406" class="s" text-anchor="start">面试追问压力：念题加收听；其余练习：只出字幕</text>
<path d="M240,216 L240,230" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M240,286 L240,300" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="500" y="60" width="240" height="150" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
<text x="514" y="84" class="t" text-anchor="start">Django（ASGI）</text>
<text x="514" y="106" class="s" text-anchor="start">speaking · writing · interview</text>
<text x="514" y="126" class="s" text-anchor="start">ai · billing · accounts</text>
<text x="514" y="146" class="s" text-anchor="start">出题、追问、评分</text>
<text x="514" y="166" class="s" text-anchor="start">PCM WebSocket 中转（默认关）</text>
<rect x="500" y="228" width="240" height="70" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
<text x="514" y="252" class="t" text-anchor="start">AI worker</text>
<text x="514" y="274" class="s" text-anchor="start">扫 AITask 表：整节评分、写作批改</text>
<rect x="500" y="314" width="240" height="36" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="620" y="337" class="s" text-anchor="middle">SQLite · 录音和语音文件 · 题库</text>
<rect x="770" y="60" width="210" height="292" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="6 4"/>
<text x="784" y="84" class="t" text-anchor="start">外部服务</text>
<text x="784" y="106" class="s" text-anchor="start">大模型 HTTP（OpenAI 兼容）</text>
<text x="784" y="126" class="s" text-anchor="start">Codex 命令行（兜底）</text>
<text x="784" y="146" class="s" text-anchor="start">火山 TTS</text>
<text x="784" y="166" class="s" text-anchor="start">火山 ASR（Python 重写的协议）</text>
<text x="784" y="186" class="s" text-anchor="start">火山实时语音对话</text>
<path d="M444,150 L500,150" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="472" y="142" class="k" text-anchor="middle">HTTP / SSE</text>
<path d="M740,130 L770,130" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M740,262 L770,240" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M620,210 L620,228" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M444,400 L875,400 L875,352" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="660" y="392" class="k" text-anchor="middle">WebSocket（TLS 校验证书）</text>
<rect x="20" y="476" width="960" height="134" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-dasharray="6 4"/>
<text x="34" y="502" class="t" text-anchor="start" style="fill:#cf222e">其余 C++ 语音：都没接进产品</text>
<rect x="36" y="518" width="300" height="76" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="50" y="542" class="b" text-anchor="start">3 月旧实时原型（src/interview）</text>
<text x="50" y="564" class="s" text-anchor="start">连接层和引擎共用 RealtimeClient</text>
<text x="50" y="584" class="s" text-anchor="start">自己的线程模型和状态机没改</text>
<rect x="350" y="518" width="300" height="76" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="364" y="542" class="b" text-anchor="start">IELTS 命令行（src/ielts）</text>
<text x="364" y="564" class="s" text-anchor="start">复用旧原型的识别那一半</text>
<text x="364" y="584" class="s" text-anchor="start">考官语音收到后被丢掉</text>
<rect x="664" y="518" width="300" height="76" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="678" y="542" class="b" text-anchor="start">native_voice（10-05 新写）</text>
<text x="678" y="564" class="s" text-anchor="start">只有设备层，把麦克风原样回放</text>
<text x="678" y="584" class="s" text-anchor="start">独立工程，产品构建不引用</text>
</svg>
