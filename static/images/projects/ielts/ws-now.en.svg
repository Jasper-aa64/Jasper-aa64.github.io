<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><style>.h{font-size:19px;font-weight:700;fill:#1f2328}.t{font-size:15px;font-weight:700;fill:#1f2328}.b{font-size:13px;font-weight:600;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.k{font-size:12px;fill:#57606a}.lane{font-size:14px;font-weight:700;fill:#1f2328}</style></defs>
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
<text x="20" y="34" class="h" text-anchor="start">Today: four threads use the same ws_ directly, with no lock around it</text>
<rect x="20" y="64" width="320" height="72" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
<text x="34" y="88" class="t" text-anchor="start">Microphone thread</text>
<text x="34" y="111" class="s" text-anchor="start">every 200 ms: ws_-&gt;write(audio frame)</text>
<text x="326" y="129" class="k" text-anchor="end">:161</text>
<rect x="20" y="150" width="320" height="72" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
<text x="34" y="174" class="t" text-anchor="start">Playback thread</text>
<text x="34" y="197" class="s" text-anchor="start">once per turn: ws_-&gt;write(text query)</text>
<text x="326" y="215" class="k" text-anchor="end">:190</text>
<rect x="20" y="236" width="320" height="72" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
<text x="34" y="260" class="t" text-anchor="start">Receive thread</text>
<text x="34" y="283" class="s" text-anchor="start">always blocked in ws_-&gt;read</text>
<text x="326" y="301" class="k" text-anchor="end">:205</text>
<rect x="20" y="322" width="320" height="72" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
<text x="34" y="346" class="t" text-anchor="start">Thread calling Stop (UI on close)</text>
<text x="34" y="369" class="s" text-anchor="start">Close(): end frames, ws_-&gt;close, join</text>
<text x="326" y="387" class="k" text-anchor="end">:282–329</text>
<rect x="400" y="64" width="330" height="330" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="565" y="90" class="t" text-anchor="middle">One object ws_ (:495)</text>
<rect x="416" y="108" width="298" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="565" y="140" class="b" text-anchor="middle">websocket::stream</text>
<text x="565" y="164" class="s" text-anchor="middle">frame headers, write buffer, frame state</text>
<rect x="416" y="202" width="298" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="565" y="234" class="b" text-anchor="middle">ssl_stream</text>
<text x="565" y="258" class="s" text-anchor="middle">OpenSSL session: cipher state, seq</text>
<rect x="416" y="296" width="298" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="565" y="328" class="b" text-anchor="middle">tcp::socket</text>
<text x="565" y="352" class="s" text-anchor="middle">kernel send buffer</text>
<path d="M340,100 L416,140" fill="none" stroke="#cf222e" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M340,186 L416,150" fill="none" stroke="#cf222e" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M416,250 L340,272" fill="none" stroke="#57606a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M340,358 L416,260" fill="none" stroke="#cf222e" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="790" y="64" width="190" height="330" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="6 4"/>
<text x="885" y="200" class="s" text-anchor="middle">Volcengine dialogue</text>
<text x="885" y="224" class="s" text-anchor="middle">sees only bytes</text>
<text x="885" y="248" class="s" text-anchor="middle">cannot tell the threads apart</text>
<path d="M730,230 L790,230" fill="none" stroke="#57606a" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="20" y="418" width="475" height="122" rx="10" fill="#ffebe9" stroke="#ff8182"/>
<text x="36" y="446" class="t" text-anchor="start" style="fill:#cf222e">Collision 1: mic write + playback write</text>
<text x="36" y="474" class="s" text-anchor="start">frame bytes interleave, or TLS state changed twice</text>
<text x="36" y="498" class="s" text-anchor="start">→ server sees a protocol or TLS error, disconnects</text>
<rect x="505" y="418" width="475" height="122" rx="10" fill="#ffebe9" stroke="#ff8182"/>
<text x="521" y="446" class="t" text-anchor="start" style="fill:#cf222e">Collision 2: Close write + receive read</text>
<text x="521" y="474" class="s" text-anchor="start">one TLS session used by two threads at once</text>
<text x="521" y="498" class="s" text-anchor="start">no read deadline (idle_timeout = 0) → join never ends, window hangs</text>
</svg>
