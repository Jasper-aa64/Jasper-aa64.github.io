<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaeef2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#afb8c1" stroke-width="3"/></pattern><style>.h{font-size:19px;font-weight:700;fill:#1f2328}.t{font-size:14px;font-weight:600;fill:#1f2328}.s{font-size:13px;fill:#57606a}.c{font-size:13px;font-weight:600;fill:#1f2328}.red{fill:#cf222e}.k{font-size:12px;fill:#57606a}</style></defs>
<rect x="0" y="0" width="1200" height="450" fill="#ffffff"/>
<text x="20" y="34" class="t">The same process(), two different hints: the machine code GCC -O2 lays out (addresses grow downward; stack adjustments omitted)</text>
<text x="60" y="72" class="t">if (UNLIKELY(n &lt;= 0)): hint right</text>
<rect x="60" y="96" width="300" height="26" rx="4" fill="#ffffff" stroke="#d0d7de"/>
<text x="70" y="114" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">test %esi, %esi</text>
<rect x="60" y="126" width="300" height="26" rx="4" fill="#fff1c2" stroke="#d4a72c"/>
<text x="70" y="144" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">jle .L9</text>
<rect x="60" y="156" width="300" height="26" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
<text x="70" y="174" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">movslq %esi, %rsi</text>
<rect x="60" y="186" width="300" height="26" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
<text x="70" y="204" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">movl (%rdi), %eax</text>
<rect x="60" y="216" width="300" height="26" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
<text x="70" y="234" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">addl -4(%rdi,%rsi,4), %eax</text>
<rect x="60" y="246" width="300" height="26" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
<text x="70" y="264" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">ret</text>
<rect x="60" y="276" width="300" height="26" rx="4" fill="#f6f8fa" stroke="#afb8c1"/>
<text x="70" y="294" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">.L9:  call report_error</text>
<rect x="60" y="306" width="300" height="26" rx="4" fill="#f6f8fa" stroke="#afb8c1"/>
<text x="70" y="324" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">movl $-1, %eax</text>
<rect x="60" y="336" width="300" height="26" rx="4" fill="#f6f8fa" stroke="#afb8c1"/>
<text x="70" y="354" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">ret</text>
<path d="M368,156 h6 V272 h-6" fill="none" stroke="#0969da"/>
<text x="380" y="219.0" class="s" style="fill:#0969da">hot path</text>
<path d="M368,276 h6 V362 h-6" fill="none" stroke="#57606a"/>
<text x="380" y="324.0" class="s" style="fill:#57606a">error path</text>
<path d="M60,139.0 h-28 V289.0 h24" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="26" y="214.0" class="k" transform="rotate(-90 24 214.0)" text-anchor="middle" style="fill:#8c959f">rarely taken</text>
<text x="60" y="388" class="s" style="fill:#0969da">the hot path falls straight through</text>
<text x="590" y="72" class="t">if (LIKELY(n &lt;= 0)): hint backwards</text>
<rect x="590" y="96" width="300" height="26" rx="4" fill="#ffffff" stroke="#d0d7de"/>
<text x="600" y="114" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">test %esi, %esi</text>
<rect x="590" y="126" width="300" height="26" rx="4" fill="#fff1c2" stroke="#d4a72c"/>
<text x="600" y="144" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">jg .L11</text>
<rect x="590" y="156" width="300" height="26" rx="4" fill="#f6f8fa" stroke="#afb8c1"/>
<text x="600" y="174" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">call report_error</text>
<rect x="590" y="186" width="300" height="26" rx="4" fill="#f6f8fa" stroke="#afb8c1"/>
<text x="600" y="204" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">movl $-1, %eax</text>
<rect x="590" y="216" width="300" height="26" rx="4" fill="#f6f8fa" stroke="#afb8c1"/>
<text x="600" y="234" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">ret</text>
<rect x="590" y="246" width="300" height="26" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
<text x="600" y="264" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">.L11:  movslq %esi, %rsi</text>
<rect x="590" y="276" width="300" height="26" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
<text x="600" y="294" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">movl (%rdx), %eax</text>
<rect x="590" y="306" width="300" height="26" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
<text x="600" y="324" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">addl -4(%rdx,%rsi,4), %eax</text>
<rect x="590" y="336" width="300" height="26" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
<text x="600" y="354" class="c" style="font-family:Menlo,Consolas,monospace;font-weight:400">ret</text>
<path d="M898,246 h6 V362 h-6" fill="none" stroke="#0969da"/>
<text x="910" y="309.0" class="s" style="fill:#0969da">hot path</text>
<path d="M898,156 h6 V242 h-6" fill="none" stroke="#57606a"/>
<text x="910" y="204.0" class="s" style="fill:#57606a">error path</text>
<path d="M590,139.0 h-28 V259.0 h24" fill="none" stroke="#cf222e" stroke-width="2" marker-end="url(#a)"/>
<text x="556" y="199.0" class="k" transform="rotate(-90 554 199.0)" text-anchor="middle" style="fill:#cf222e">taken every time</text>
<text x="590" y="388" class="s" style="fill:#cf222e">the hot path jumps over the error code every time</text>
<text x="20" y="428" class="s">The predictor guesses both layouts well: it uses this jump's history, not the hint. The difference is whether the hot path jumps: falling through keeps fetch going and packs the hot code into fewer cache lines.</text>
</svg>
