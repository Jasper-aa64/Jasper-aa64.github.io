<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><style>
.h{font-size:20px;font-weight:700;fill:#1f2328}.s{font-size:13px;fill:#57606a}.lane{font-size:15px;font-weight:700;fill:#1f2328}
.bar{font-size:13px;font-weight:600;fill:#1f2328}.op{font-size:12.5px;font-weight:600;fill:#1f2328}.val{font-size:12.5px;fill:#57606a}
.num{font-size:13px;font-weight:700;fill:#ffffff}.chip{font-size:13.5px;font-weight:600;fill:#1f2328}.bad{font-size:13.5px;font-weight:600;fill:#cf222e}
.k{font-size:13px;fill:#57606a}.t{font-size:15px;font-weight:700;fill:#1f2328}.pt{font-size:12.5px;font-weight:600;fill:#bc4c00}
</style></defs>
<rect x="0" y="0" width="1100" height="500" fill="#ffffff"/>
<text x="24" y="36" class="h" text-anchor="start">CAS 失败：不重试，而是“我排在它后面”</text>
<text x="24" y="62" class="s" text-anchor="start">每条横条是一次调用，从调用到返回；圆点是它碰内存的那一步；菱形是给它挑的点：当作它在这一刻一次做完，按菱形从左到右排先后。</text>
<line x1="330" y1="96" x2="330" y2="290" stroke="#d0d7de" stroke-dasharray="4 4"/>
<line x1="560" y1="96" x2="560" y2="290" stroke="#d0d7de" stroke-dasharray="4 4"/>
<line x1="790" y1="96" x2="790" y2="290" stroke="#d0d7de" stroke-dasharray="4 4"/>
<line x1="160" y1="92" x2="1060" y2="92" stroke="#8c959f" stroke-width="1.2" marker-end="url(#a)"/>
<text x="1060" y="84" class="k" text-anchor="end">时间 →</text>
<text x="140" y="155" class="lane" text-anchor="end">T1</text>
<text x="140" y="235" class="lane" text-anchor="end">T2</text>
<rect x="250" y="133" width="630" height="34" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="252" y="125" class="bar" text-anchor="start">decrement → false</text>
<circle cx="330" cy="150" r="6" fill="#cf222e"/>
<circle cx="790" cy="150" r="6" fill="#cf222e"/>
<rect x="420" y="213" width="280" height="34" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="422" y="205" class="bar" text-anchor="start">increment → true</text>
<circle cx="560" cy="230" r="6" fill="#1a7f37"/>
<path d="M560,200 l9,9 l-9,9 l-9,-9 z" fill="#fb8f44" stroke="#bc4c00"/>
<path d="M790,120 l9,9 l-9,9 l-9,-9 z" fill="#fb8f44" stroke="#bc4c00"/>
<text x="804" y="129" class="pt" text-anchor="start">挑的点</text>
<text x="574" y="209" class="pt" text-anchor="start">挑的点</text>
<text x="140" y="320" class="lane" text-anchor="end">内存里的值</text>
<rect x="258" y="290" width="144" height="52" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="330" y="311" class="op" text-anchor="middle">T1 fetch_sub</text>
<text x="330" y="331" class="val" text-anchor="middle">1 → 0</text>
<rect x="488" y="290" width="144" height="52" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="560" y="311" class="op" text-anchor="middle">T2 fetch_add</text>
<text x="560" y="331" class="val" text-anchor="middle">0 → 1</text>
<rect x="718" y="290" width="144" height="52" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="790" y="311" class="op" text-anchor="middle">T1 CAS 失败</text>
<text x="790" y="331" class="val" text-anchor="middle">读回 1，没有 helped</text>
<rect x="160" y="380" width="120" height="40" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="220.0" y="405" class="chip" text-anchor="middle">初始 1</text>
<line x1="284" y1="400" x2="310" y2="400" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="314" y="380" width="160" height="40" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="394.0" y="405" class="chip" text-anchor="middle">T2 加 → 2</text>
<line x1="478" y1="400" x2="504" y2="400" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="508" y="380" width="300" height="40" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
<text x="658.0" y="405" class="chip" text-anchor="middle">T1 减 → 1，没到零，false ✓</text>
<text x="160" y="456" class="k" text-anchor="start">T1 的点选在 CAS 那一刻，还在它自己的横条里，所以可以排在 T2 的加后面。</text>
</svg>
