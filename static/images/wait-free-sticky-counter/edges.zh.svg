<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 348" width="1100" height="348" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><style>.h{font-size:18px;font-weight:700;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.p{font-size:14px;font-weight:700;fill:#1f2328}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#1f2328}.n{font-size:12px;fill:#57606a}.bw{font-size:12px;font-weight:700;fill:#ffffff}.l{font-size:12.5px;fill:#1f2328}.lb{font-size:12.5px;font-weight:700;fill:#1f2328}</style></defs>
<rect x="0" y="0" width="1100" height="348" fill="#ffffff"/>
<text class="h" x="20" y="32">认领的线程从哪次读接上 release：是钉零的 CAS，不是 fetch_sub</text>
<text class="s" x="20" y="54">两个线程各调一次 decrement()，白底是 decrement() 里的代码（有删减）。黄底是调用方的代码，不在计数器里：obj 是这个计数管着的对象。</text>
<text class="s" x="20" y="74">步骤号是 1.7 那个例子里的全局先后。蓝色是横边，灰色是竖边；蓝框里的两句合起来是一次 acquire：先有一次读到值的操作，后面跟一道 acquire 栅栏。</text>
<rect x="20" y="84" width="500" height="244" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="580" y="84" width="500" height="244" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="44" y="192" width="466" height="22" rx="5" fill="#ddf4ff" stroke="#2a78d6"/>
<rect x="604" y="192" width="466" height="48" rx="5" fill="#ddf4ff" stroke="#2a78d6"/>
<text class="p" x="36" y="104">线程 T2：窗口里加回去，写一下对象，再放手</text>
<rect x="44" y="113" width="466" height="24" fill="#fff8c5"/>
<rect x="44" y="139" width="466" height="24" fill="#fff8c5"/>
<rect x="44" y="165" width="466" height="24" fill="#fff8c5"/>
<text class="c" x="50.0" y="130">cnt.increment_if_not_zero();</text>
<text class="n" x="424" y="130">步骤 2：0 → 1</text>
<text class="c" x="50.0" y="156">obj-&gt;x = 42;</text>
<text class="c" x="50.0" y="182">cnt.decrement();</text>
<text class="n" x="424" y="182">返回 false</text>
<text class="c" x="65.1" y="208">if (counter.fetch_sub(1, release) == 1) {</text>
<text class="n" x="424" y="208">步骤 4：1 → 0</text>
<text class="c" x="80.2" y="234">expect = 0;</text>
<text class="c" x="80.2" y="260">if (counter.CAS(expect, is_zero, relaxed))</text>
<text class="n" x="424" y="260">步骤 6：失败</text>
<text class="c" x="65.1" y="286">}</text>
<text class="c" x="65.1" y="312">return false;</text>
<text class="p" x="596" y="104">线程 T1：认领成功，负责销毁对象</text>
<rect x="604" y="113" width="466" height="24" fill="#fff8c5"/>
<rect x="604" y="295" width="466" height="24" fill="#fff8c5"/>
<text class="c" x="610.0" y="130">if (cnt.decrement())</text>
<text class="n" x="984" y="130">返回 true</text>
<text class="c" x="625.1" y="156">if (counter.fetch_sub(1, release) == 1) {</text>
<text class="n" x="984" y="156">步骤 1：1 → 0</text>
<text class="c" x="640.2" y="182">expect = 0;</text>
<text class="c" x="640.2" y="208">if (counter.CAS(expect, is_zero, relaxed)) {</text>
<text class="n" x="984" y="208">步骤 5：成功</text>
<text class="c" x="655.3" y="234">atomic_thread_fence(acquire);</text>
<text class="c" x="655.3" y="260">return true;</text>
<text class="c" x="640.2" y="286">}</text>
<text class="c" x="625.1" y="312">delete obj;</text>
<rect x="180" y="141" width="130" height="20" rx="10" fill="#bc4c00"/>
<text class="bw" x="245" y="155" text-anchor="middle">写 ① 对象里的内容</text>
<rect x="760" y="297" width="130" height="20" rx="10" fill="#bc4c00"/>
<text class="bw" x="825" y="311" text-anchor="middle">读、写 ① 的内容</text>
<line x1="34" y1="150" x2="34" y2="204" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="594" y1="206" x2="594" y2="308" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<path d="M510,203 H588" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ab)"/>
<path d="M522,203 C552,203 550,151 586,151" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="549" y="183" text-anchor="middle" style="fill:#cf222e;font-size:15px;font-weight:700">✕</text>
</svg>
