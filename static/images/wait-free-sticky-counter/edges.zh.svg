<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 452" width="1100" height="452" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><style>.h{font-size:18px;font-weight:700;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.p{font-size:14px;font-weight:700;fill:#1f2328}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#1f2328}.n{font-size:12px;fill:#57606a}.bw{font-size:12px;font-weight:700;fill:#ffffff}.l{font-size:12.5px;fill:#1f2328}.lb{font-size:12.5px;font-weight:700;fill:#1f2328}</style></defs>
<rect x="0" y="0" width="1100" height="452" fill="#ffffff"/>
<text class="h" x="20" y="32">认领的线程从哪次读接上 release：是钉零的 CAS，不是 fetch_sub</text>
<text class="s" x="20" y="54">1.7 的 6 步例子里 T2 和 T1 各自执行的语句（步骤号是全局的先后）。蓝色是横边，灰色是竖边。</text>
<rect x="20" y="68" width="500" height="198" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="p" x="36" y="92">线程 T2：窗口里加回去，用一下对象，再放手</text>
<rect x="580" y="68" width="500" height="198" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="p" x="596" y="92">线程 T1：认领成功，负责销毁对象</text>
<rect x="44" y="154" width="346" height="22" rx="5" fill="#ddf4ff" stroke="#2a78d6"/>
<rect x="604" y="154" width="296" height="48" rx="5" fill="#ddf4ff" stroke="#2a78d6"/>
<text class="c" x="50" y="118">counter.fetch_add(1, relaxed);</text>
<text class="n" x="352" y="118">步骤 2：0 → 1，没有边通到</text>
<text class="c" x="50" y="144">obj-&gt;x = 42;</text>
<text class="c" x="50" y="170">counter.fetch_sub(1, release);  // 步骤 4：1 → 0</text>
<text class="c" x="50" y="196">counter.CAS(expect, is_zero, relaxed);</text>
<text class="n" x="352" y="196">步骤 6：失败，返回 false</text>
<text class="c" x="610" y="118">counter.fetch_sub(1, release);</text>
<text class="n" x="912" y="118">步骤 1：1 → 0，比步骤 4 早</text>
<text class="c" x="610" y="144">expect = 0;</text>
<text class="c" x="610" y="170">counter.CAS(expect, is_zero, relaxed);</text>
<text class="n" x="912" y="170">步骤 5：读到 0，认领成功</text>
<text class="c" x="610" y="196">atomic_thread_fence(acquire);</text>
<text class="n" x="912" y="196">acquire 从这一句起生效</text>
<text class="c" x="610" y="222">return true;</text>
<text class="c" x="610" y="248">delete obj;  // 调用方</text>
<rect x="352" y="129" width="130" height="20" rx="10" fill="#bc4c00"/>
<text class="bw" x="417" y="143" text-anchor="middle">写 ① 对象里的内容</text>
<rect x="912" y="233" width="130" height="20" rx="10" fill="#bc4c00"/>
<text class="bw" x="977" y="247" text-anchor="middle">读、写 ① 的内容</text>
<line x1="34" y1="138" x2="34" y2="166" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="594" y1="168" x2="594" y2="244" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<path d="M390,165 H588" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ab)"/>
<path d="M520,165 C552,165 548,113 586,113" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="lb" x="544" y="143" text-anchor="middle" style="fill:#cf222e;font-size:15px">✕</text>
<line x1="24" y1="296" x2="64" y2="296" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ab)"/>
<text class="l" x="74" y="300"><tspan class="lb">横边</tspan>：T2 的 release 减 1，到读到它写的 0 的那次操作，也就是 T1 钉零的 CAS。CAS 自己是 relaxed 也算数。</text>
<line x1="24" y1="322" x2="64" y2="322" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<text class="l" x="74" y="326"><tspan class="lb">竖边</tspan>：同一个线程里，前一句到后一句。蓝框里两句合起来是一次 acquire：先有一次读到值的操作，后面跟一道 acquire 栅栏。</text>
<text class="l" x="24" y="354"><tspan class="lb">走一遍</tspan>：写 ① → 竖边 → T2 的 release → 横边 → T1 的 CAS → 竖边 → 栅栏 → delete，走得通，T1 销毁时看得到 T2 写的内容。</text>
<text class="l" x="24" y="380"><tspan class="lb">虚线连不上</tspan>：T1 的 fetch_sub 在步骤 1，T2 的 release 在步骤 4，早的读读不到晚的写。栅栏紧跟 fetch_sub 的话，T1 接不上 T2。</text>
<text class="l" x="24" y="406"><tspan class="lb">没有边通到</tspan>：T2 的 fetch_add。它之后要用对象，靠的是它拿到这个指针时已有的同步，不靠计数。</text>
</svg>
