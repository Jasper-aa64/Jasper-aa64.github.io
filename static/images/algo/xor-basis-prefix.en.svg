<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="40" y="40" font-size="15" fill="#1f2328" text-anchor="start" font-weight="700">Array (1-indexed)</text>
<rect x="230" y="18" width="70" height="32" rx="5" fill="#ffffff" stroke="#0969da"/><text x="265.0" y="39.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#0969da" font-weight="700">101</text>
<text x="265" y="68" font-size="13" fill="#57606a" text-anchor="middle">a₁ = 5</text>
<rect x="340" y="18" width="70" height="32" rx="5" fill="#ffffff" stroke="#0969da"/><text x="375.0" y="39.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#0969da" font-weight="700">110</text>
<text x="375" y="68" font-size="13" fill="#57606a" text-anchor="middle">a₂ = 6</text>
<rect x="450" y="18" width="70" height="32" rx="5" fill="#ffffff" stroke="#0969da"/><text x="485.0" y="39.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#0969da" font-weight="700">011</text>
<text x="485" y="68" font-size="13" fill="#57606a" text-anchor="middle">a₃ = 3</text>
<rect x="560" y="18" width="70" height="32" rx="5" fill="#ffffff" stroke="#0969da"/><text x="595.0" y="39.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#0969da" font-weight="700">100</text>
<text x="595" y="68" font-size="13" fill="#57606a" text-anchor="middle">a₄ = 4</text>
<rect x="20" y="84" width="960" height="270" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="112" font-size="15" fill="#1f2328" text-anchor="start" font-weight="700">Basis after each insertion: value@position</text>
<text x="960" y="112" font-size="13" fill="#1a7f37" text-anchor="end">Green: placed in this step</text>
<text x="220" y="142" font-size="14" fill="#57606a" text-anchor="middle" font-weight="700">after a₁</text>
<text x="120" y="176" font-size="14" fill="#57606a" text-anchor="end" font-family="Consolas, Menlo, monospace">b[2]</text>
<rect x="150" y="154" width="140" height="34" rx="5" fill="#dafbe1" stroke="#1a7f37"/><text x="220.0" y="176.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1a7f37" font-weight="700">101 @1</text>
<text x="120" y="218" font-size="14" fill="#57606a" text-anchor="end" font-family="Consolas, Menlo, monospace">b[1]</text>
<rect x="150" y="196" width="140" height="34" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 3"/><text x="220.0" y="218.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#57606a"></text>
<text x="120" y="260" font-size="14" fill="#57606a" text-anchor="end" font-family="Consolas, Menlo, monospace">b[0]</text>
<rect x="150" y="238" width="140" height="34" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 3"/><text x="220.0" y="260.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#57606a"></text>
<text x="425" y="142" font-size="14" fill="#57606a" text-anchor="middle" font-weight="700">after a₂</text>
<rect x="355" y="154" width="140" height="34" rx="5" fill="#dafbe1" stroke="#1a7f37"/><text x="425.0" y="176.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1a7f37" font-weight="700">110 @2</text>
<rect x="355" y="196" width="140" height="34" rx="5" fill="#dafbe1" stroke="#1a7f37"/><text x="425.0" y="218.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1a7f37" font-weight="700">011 @1</text>
<rect x="355" y="238" width="140" height="34" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 3"/><text x="425.0" y="260.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#57606a"></text>
<text x="630" y="142" font-size="14" fill="#57606a" text-anchor="middle" font-weight="700">after a₃</text>
<rect x="560" y="154" width="140" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/><text x="630.0" y="176.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1f2328">110 @2</text>
<rect x="560" y="196" width="140" height="34" rx="5" fill="#dafbe1" stroke="#1a7f37"/><text x="630.0" y="218.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1a7f37" font-weight="700">011 @3</text>
<rect x="560" y="238" width="140" height="34" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 3"/><text x="630.0" y="260.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#57606a"></text>
<text x="835" y="142" font-size="14" fill="#57606a" text-anchor="middle" font-weight="700">after a₄</text>
<rect x="765" y="154" width="140" height="34" rx="5" fill="#dafbe1" stroke="#1a7f37"/><text x="835.0" y="176.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1a7f37" font-weight="700">100 @4</text>
<rect x="765" y="196" width="140" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/><text x="835.0" y="218.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1f2328">011 @3</text>
<rect x="765" y="238" width="140" height="34" rx="5" fill="#dafbe1" stroke="#1a7f37"/><text x="835.0" y="260.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1a7f37" font-weight="700">001 @2</text>
<text x="40" y="312" font-size="13.5" fill="#1f2328" text-anchor="start">③ a₃ = 011 is further right, swaps out the old 011@1, which reduces to 0 and is dropped</text>
<text x="40" y="336" font-size="13.5" fill="#1f2328" text-anchor="start">④ a₄ = 100 takes b[2]; 110@2 is pushed down, reduces to 001 and lands in b[0]</text>
<rect x="20" y="370" width="960" height="174" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="398" font-size="15" fill="#1f2328" text-anchor="start" font-weight="700">Query [3, 4]: use only basis vectors at position ≥ 3</text>
<text x="120" y="434" font-size="14" fill="#57606a" text-anchor="end" font-family="Consolas, Menlo, monospace">b[2]</text>
<rect x="150" y="412" width="140" height="34" rx="5" fill="#fbefff" stroke="#8250df"/><text x="220.0" y="434.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#8250df" font-weight="700">100 @4</text>
<text x="120" y="474" font-size="14" fill="#57606a" text-anchor="end" font-family="Consolas, Menlo, monospace">b[1]</text>
<rect x="150" y="452" width="140" height="34" rx="5" fill="#fbefff" stroke="#8250df"/><text x="220.0" y="474.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#8250df" font-weight="700">011 @3</text>
<text x="120" y="514" font-size="14" fill="#57606a" text-anchor="end" font-family="Consolas, Menlo, monospace">b[0]</text>
<g opacity="0.45"><rect x="150" y="492" width="140" height="34" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 3"/><text x="220.0" y="514.5" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#57606a">001 @2</text></g>
<text x="306" y="514" font-size="13.5" fill="#57606a" text-anchor="start">position 2 &lt; 3, unused</text>
<text x="330" y="448" font-size="14.5" fill="#1f2328" text-anchor="start">100 ⊕ 011 = 111 = 7, the same as using a₃ = 3 and a₄ = 4 directly</text>
</svg>