<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1768" width="1200" height="1768" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 600; fill: #1f2328; }
      .s  { font-size: 11px; fill: #57606a; }
      .h  { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .tag{ font-size: 11px; fill: #0969da; }
      .box   { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; rx: 6; }
      .core  { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
      .sock  { fill: #fbfbfc; stroke: #1f2328; stroke-width: 2; }
      .cache { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.2; }
      .buf   { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.2; }
      .mem   { fill: #ffebe9; stroke: #ff8182; stroke-width: 1.2; }
      .line  { stroke: #555; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1768" fill="#ffffff"/>
  <text x="20" y="38" class="h" style="font-size:22px">Hardware map: the layers one memory access passes through</text>
  <text x="20" y="60" class="s">Blue = where it is covered (#N = Trading System Notes #N; MESI = the MESI topic post; Ref N.N = a section of the Reference page). Numbers are typical x86 (Zen 3) magnitudes.</text>

  <!-- ===== Socket 0 ===== -->
  <rect x="20" y="75" width="840" height="700" rx="10" class="sock"/>
  <text x="36" y="98" class="h">CPU socket 0 = one NUMA node</text>
  <text x="300" y="98" class="tag">#1 pinning / isolation · NUMA</text>

  <!-- Core 0 -->
  <rect x="40" y="110" width="390" height="460" rx="8" class="core"/>
  <text x="56" y="132" class="t">Core 0</text>
  <text x="110" y="132" class="tag">2 hardware threads share this core (SMT, #1)</text>

  <rect x="60" y="145" width="350" height="62" class="box"/>
  <text x="72" y="168" class="t">Pipeline: fetch → decode → execute → retire</text>
  <text x="72" y="186" class="tag">#2 dependency chains · multiple accumulators</text>
  

  <rect x="60" y="220" width="165" height="62" class="box"/>
  <text x="72" y="243" class="t">Registers</text>
  <text x="72" y="261" class="tag">#2 register spills</text>
  <text x="72" y="275" class="tag">#6 storage classes</text>

  <rect x="245" y="220" width="165" height="62" class="buf"/>
  <text x="257" y="243" class="t">Store buffer</text>
  <text x="257" y="261" class="tag">#2 store buffer</text>
  <text x="257" y="275" class="tag">#2 store-to-load forwarding</text>

  <rect x="60" y="295" width="165" height="62" class="buf"/>
  <text x="72" y="318" class="t">TLB (translation)</text>
  <text x="72" y="336" class="tag">#6 2 MiB alignment</text>
  <text x="72" y="350" class="tag">#3 TLB shootdown</text>

  <rect x="245" y="295" width="165" height="62" class="buf"/>
  <text x="257" y="318" class="t">Invalidate queue</text>
  <text x="257" y="336" class="tag">#2 invalidate queue</text>
  <text x="257" y="350" class="tag">#2 acquire</text>

  <rect x="60" y="370" width="165" height="70" class="cache"/>
  <text x="72" y="393" class="t">L1I 32 KiB</text>
  <text x="72" y="411" class="s">instruction cache</text>
  <text x="72" y="428" class="tag">#6 function grouping</text>

  <rect x="245" y="370" width="165" height="70" class="cache"/>
  <text x="257" y="393" class="t">L1D 32 KiB · 8-way</text>
  <text x="257" y="411" class="tag">#6 alignment · sets</text>
  <text x="257" y="428" class="tag">Ref 2.3 fill buffer</text>

  <rect x="60" y="455" width="350" height="62" class="cache"/>
  <text x="72" y="478" class="t">L2 512 KiB · 8-way (private to the core)</text>
  <text x="72" y="497" class="tag">#6 critical stride 64 KiB · #2 private L1/L2</text>

  <text x="56" y="545" class="s">Caches and memory move data in whole 64 B cache lines</text>
  <text x="56" y="561" class="tag">#2 · #6 how many lines one access touches</text>

  <!-- Core 1..5 -->
  <rect x="450" y="110" width="390" height="460" rx="8" class="core"/>
  <text x="466" y="132" class="t">Core 1 … Core 5 (same structure)</text>
  <text x="466" y="175" class="s">One cache line can have a copy in several cores' L1/L2.</text>
  <text x="466" y="193" class="s">To write it, a core must first invalidate the others:</text>
  <text x="466" y="219" class="t">MESI: one writer or many readers</text>
  <text x="466" y="239" class="tag">MESI topic post</text>
  <text x="466" y="257" class="tag">#2 false sharing (two cores fight over a line)</text>
  <text x="466" y="275" class="tag">#4 cached cursor · #5 more readers, costlier writes</text>
  <text x="466" y="293" class="tag">#6 alignas(64) gives an object its own line</text>

  <rect x="660" y="370" width="165" height="70" class="cache"/>
  <text x="672" y="393" class="t">L1D</text>
  <text x="672" y="411" class="s">(L1I, TLB and store</text>
  <text x="672" y="427" class="s">buffer are per core too)</text>

  <rect x="470" y="455" width="350" height="62" class="cache"/>
  <text x="482" y="478" class="t">L2 (private)</text>
  <text x="482" y="497" class="s">one per core</text>

  <!-- coherence arrow -->
  <line x1="412" y1="486" x2="468" y2="486" class="line" marker-start="url(#arr)" marker-end="url(#arr)" stroke-dasharray="5 3"/>
  <text x="413" y="476" class="tag" style="font-size:9px">coherence</text>

  <!-- L3 -->
  <rect x="40" y="590" width="800" height="62" class="cache"/>
  <text x="56" y="614" class="t">L3 16 MiB · 16-way (shared by all cores)</text>
  <text x="56" y="634" class="tag">#2 shared L3 · #6 hashed set selection</text>
  <line x1="380" y1="517" x2="380" y2="588" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="645" y1="517" x2="645" y2="588" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Memory controller -->
  <rect x="40" y="680" width="800" height="62" class="mem"/>
  <text x="56" y="704" class="t">Memory controller: spreads consecutive addresses across channels (interleaving)</text>
  <text x="56" y="724" class="tag">#6 channel balance (line count coprime with channel count)</text>
  <line x1="440" y1="652" x2="440" y2="678" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- ===== Right column ===== -->
  <rect x="880" y="75" width="300" height="160" rx="10" class="sock"/>
  <text x="896" y="100" class="h">CPU socket 1</text>
  <text x="896" y="125" class="s">its own cores, L3, controller and memory</text>
  <text x="896" y="145" class="s">remote memory goes over the interconnect</text>
  <text x="896" y="170" class="tag">#1 NUMA: thread and memory on the same node</text>
  <line x1="862" y1="160" x2="878" y2="160" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <rect x="880" y="255" width="300" height="100" rx="8" class="box"/>
  <text x="896" y="280" class="t">NIC → interrupt → some core</text>
  <text x="896" y="302" class="tag">#1 steer IRQs away from hot cores</text>
  
  <text x="896" y="342" class="s">(an OS layer, not a cache layer)</text>

  <!-- ===== DRAM ===== -->
  <text x="20" y="805" class="h">DIMMs (DRAM)</text>
  <text x="160" y="805" class="tag">#6</text>
  <line x1="250" y1="742" x2="250" y2="818" class="line" marker-end="url(#arr)"/>
  <line x1="440" y1="742" x2="440" y2="818" class="line" marker-end="url(#arr)"/>
  <line x1="710" y1="742" x2="710" y2="818" class="line" marker-end="url(#arr)"/>

  <rect x="40" y="820" width="260" height="230" rx="8" class="mem"/>
  <text x="56" y="844" class="t">Channel 0</text>
  <text x="56" y="866" class="s">DIMM → rank → many banks</text>
  <rect x="56" y="880" width="228" height="155" class="box"/>
  <text x="68" y="902" class="t">a bank = rows × columns</text>
  <rect x="68" y="914" width="204" height="30" class="buf"/>
  <text x="78" y="934" class="s">row buffer: the row currently open</text>
  <text x="68" y="964" class="s">hit in the open row ~14 ns</text>
  <text x="68" y="983" class="s">switch rows (conflict) ~40 ns</text>
  <text x="68" y="1006" class="s">refresh every ~7.8 µs stalls</text>
  <text x="68" y="1024" class="s">a few hundred ns → P99 spikes</text>

  <rect x="320" y="820" width="240" height="230" rx="8" class="mem"/>
  <text x="336" y="844" class="t">Channel 1</text>
  <text x="336" y="866" class="s">same as channel 0</text>
  <text x="336" y="900" class="s">Channels work in parallel:</text>
  <text x="336" y="920" class="s">bandwidth ≈ channels × one channel</text>

  <rect x="580" y="820" width="260" height="230" rx="8" class="mem"/>
  <text x="596" y="844" class="t">Channel 2 …</text>
  <text x="596" y="866" class="s">same as channel 0</text>

  <!-- ===== Address bits ===== -->
  <text x="20" y="1095" class="h">The fields of one address (4 KiB pages, L1D 32 KiB 8-way, 64 B lines)</text>
  <rect x="40"  y="1110" width="560" height="44" fill="#fff8c5" stroke="#d4a72c"/>
  <rect x="600" y="1110" width="300" height="44" fill="#ddf4ff" stroke="#54aeff"/>
  <rect x="900" y="1110" width="280" height="44" fill="#ffffff" stroke="#8c959f"/>
  <text x="56"  y="1137" class="t">virtual page number (bit 12+) → TLB</text>
  <text x="616" y="1137" class="t">set index bits 6–11</text>
  <text x="916" y="1137" class="t">offset in line bits 0–5</text>
  <text x="56"  y="1174" class="tag">huge pages: fewer pages, the TLB covers more</text>
  <text x="616" y="1174" class="tag">#6 4 KiB apart → same set</text>
  <text x="916" y="1174" class="tag">#6 aligned = these bits are 0</text>
  <path d="M600,1188 L600,1198 L1180,1198 L1180,1188" class="line"/>
  <text x="620" y="1220" class="s">Page offset bits 0–11 survive translation, so L1 picks the set while the TLB translates (VIPT)</text>
  <text x="620" y="1238" class="s">→ L1's sets × line size is capped at 4 KiB; it grows only by adding ways</text>

  <!-- ===== Latency ladder ===== -->
  <text x="20" y="1270" class="h">Latency magnitudes</text>
  <text x="20" y="1290" class="s">Cycles at about 4 GHz; each level down is roughly 3–10× slower.</text>
  <rect x="340" y="1304" width="840" height="42" fill="#7f9db9"/>
  <text x="480" y="1331" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#ffffff">Access time</text>
  <text x="750" y="1331" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#ffffff">Capacity</text>
  <text x="1030" y="1331" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#ffffff">Managed by</text>
  <line x1="620" y1="1304" x2="620" y2="1668" stroke="#ffffff" stroke-width="3"/>
  <line x1="880" y1="1304" x2="880" y2="1668" stroke="#ffffff" stroke-width="3"/>
  <rect x="340" y="1346" width="840" height="46" fill="#e3ebf3"/>
  <line x1="340" y1="1346" x2="1180" y2="1346" stroke="#ffffff" stroke-width="3"/>
  <text x="480" y="1375" text-anchor="middle" style="font-size:15px;fill:#1f2328">~1 cycle (&lt; 1 ns)</text>
  <text x="750" y="1375" text-anchor="middle" style="font-size:15px;fill:#1f2328">~1 KB</text>
  <text x="1030" y="1375" text-anchor="middle" style="font-size:15px;fill:#1f2328">Compiler</text>
  <rect x="170" y="1352" width="150" height="34" rx="3" fill="#7f9db9" stroke="#5d7d9c"/>
  <text x="245" y="1374" text-anchor="middle" style="font-size:13px;fill:#ffffff">Registers</text>
  <line x1="620" y1="1346" x2="620" y2="1392" stroke="#ffffff" stroke-width="3"/>
  <line x1="880" y1="1346" x2="880" y2="1392" stroke="#ffffff" stroke-width="3"/>
  <rect x="340" y="1392" width="840" height="46" fill="#f1f5f9"/>
  <line x1="340" y1="1392" x2="1180" y2="1392" stroke="#ffffff" stroke-width="3"/>
  <text x="480" y="1421" text-anchor="middle" style="font-size:15px;fill:#1f2328">4–5 cycles (~1 ns)</text>
  <text x="750" y="1421" text-anchor="middle" style="font-size:15px;fill:#1f2328">32 KiB / core</text>
  <text x="1030" y="1421" text-anchor="middle" style="font-size:15px;fill:#1f2328">Hardware</text>
  <rect x="170" y="1398" width="150" height="34" rx="3" fill="#7f9db9" stroke="#5d7d9c"/>
  <text x="245" y="1420" text-anchor="middle" style="font-size:13px;fill:#ffffff">L1D cache</text>
  <line x1="620" y1="1392" x2="620" y2="1438" stroke="#ffffff" stroke-width="3"/>
  <line x1="880" y1="1392" x2="880" y2="1438" stroke="#ffffff" stroke-width="3"/>
  <rect x="340" y="1438" width="840" height="46" fill="#e3ebf3"/>
  <line x1="340" y1="1438" x2="1180" y2="1438" stroke="#ffffff" stroke-width="3"/>
  <text x="480" y="1467" text-anchor="middle" style="font-size:15px;fill:#1f2328">12–14 cycles (~3–4 ns)</text>
  <text x="750" y="1467" text-anchor="middle" style="font-size:15px;fill:#1f2328">512 KiB / core</text>
  <text x="1030" y="1467" text-anchor="middle" style="font-size:15px;fill:#1f2328">Hardware</text>
  <rect x="170" y="1444" width="150" height="34" rx="3" fill="#7f9db9" stroke="#5d7d9c"/>
  <text x="245" y="1466" text-anchor="middle" style="font-size:13px;fill:#ffffff">L2 cache</text>
  <line x1="620" y1="1438" x2="620" y2="1484" stroke="#ffffff" stroke-width="3"/>
  <line x1="880" y1="1438" x2="880" y2="1484" stroke="#ffffff" stroke-width="3"/>
  <rect x="340" y="1484" width="840" height="46" fill="#f1f5f9"/>
  <line x1="340" y1="1484" x2="1180" y2="1484" stroke="#ffffff" stroke-width="3"/>
  <text x="480" y="1513" text-anchor="middle" style="font-size:15px;fill:#1f2328">~40–60 cycles (~10–15 ns)</text>
  <text x="750" y="1513" text-anchor="middle" style="font-size:15px;fill:#1f2328">16 MiB, shared</text>
  <text x="1030" y="1513" text-anchor="middle" style="font-size:15px;fill:#1f2328">Hardware</text>
  <rect x="170" y="1490" width="150" height="34" rx="3" fill="#7f9db9" stroke="#5d7d9c"/>
  <text x="245" y="1512" text-anchor="middle" style="font-size:13px;fill:#ffffff">L3 cache</text>
  <line x1="620" y1="1484" x2="620" y2="1530" stroke="#ffffff" stroke-width="3"/>
  <line x1="880" y1="1484" x2="880" y2="1530" stroke="#ffffff" stroke-width="3"/>
  <rect x="340" y="1530" width="840" height="46" fill="#e3ebf3"/>
  <line x1="340" y1="1530" x2="1180" y2="1530" stroke="#ffffff" stroke-width="3"/>
  <text x="480" y="1559" text-anchor="middle" style="font-size:15px;fill:#1f2328">~300–400 cycles (~80–100 ns)</text>
  <text x="750" y="1559" text-anchor="middle" style="font-size:15px;fill:#1f2328">tens of GB</text>
  <text x="1030" y="1559" text-anchor="middle" style="font-size:15px;fill:#1f2328">OS (page tables)</text>
  <rect x="170" y="1536" width="150" height="34" rx="3" fill="#7f9db9" stroke="#5d7d9c"/>
  <text x="245" y="1558" text-anchor="middle" style="font-size:13px;fill:#ffffff">Local DRAM</text>
  <line x1="620" y1="1530" x2="620" y2="1576" stroke="#ffffff" stroke-width="3"/>
  <line x1="880" y1="1530" x2="880" y2="1576" stroke="#ffffff" stroke-width="3"/>
  <rect x="340" y="1576" width="840" height="46" fill="#f1f5f9"/>
  <line x1="340" y1="1576" x2="1180" y2="1576" stroke="#ffffff" stroke-width="3"/>
  <text x="480" y="1605" text-anchor="middle" style="font-size:15px;fill:#1f2328">slower than local</text>
  <text x="750" y="1605" text-anchor="middle" style="font-size:15px;fill:#1f2328">the other socket's DRAM</text>
  <text x="1030" y="1605" text-anchor="middle" style="font-size:15px;fill:#1f2328">OS + your pinning</text>
  <rect x="170" y="1582" width="150" height="34" rx="3" fill="#7f9db9" stroke="#5d7d9c"/>
  <text x="245" y="1604" text-anchor="middle" style="font-size:13px;fill:#ffffff">Remote NUMA</text>
  <line x1="620" y1="1576" x2="620" y2="1622" stroke="#ffffff" stroke-width="3"/>
  <line x1="880" y1="1576" x2="880" y2="1622" stroke="#ffffff" stroke-width="3"/>
  <rect x="340" y="1622" width="840" height="46" fill="#e3ebf3"/>
  <line x1="340" y1="1622" x2="1180" y2="1622" stroke="#ffffff" stroke-width="3"/>
  <text x="480" y="1651" text-anchor="middle" style="font-size:15px;fill:#1f2328">10–100 µs</text>
  <text x="750" y="1651" text-anchor="middle" style="font-size:15px;fill:#1f2328">TBs</text>
  <text x="1030" y="1651" text-anchor="middle" style="font-size:15px;fill:#1f2328">OS (file system)</text>
  <rect x="170" y="1628" width="150" height="34" rx="3" fill="#7f9db9" stroke="#5d7d9c"/>
  <text x="245" y="1650" text-anchor="middle" style="font-size:13px;fill:#ffffff">NVMe SSD</text>
  <line x1="620" y1="1622" x2="620" y2="1668" stroke="#ffffff" stroke-width="3"/>
  <line x1="880" y1="1622" x2="880" y2="1668" stroke="#ffffff" stroke-width="3"/>
  <line x1="245" y1="1386" x2="245" y2="1398" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="245" y1="1432" x2="245" y2="1444" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="245" y1="1478" x2="245" y2="1490" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="245" y1="1524" x2="245" y2="1536" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="245" y1="1570" x2="245" y2="1582" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="245" y1="1616" x2="245" y2="1628" class="line" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="95" y="1374" text-anchor="middle" style="font-size:14px;fill:#1f2328">On the core</text>
  <line x1="30" y1="1392" x2="330" y2="1392" stroke="#54aeff" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="95" y="1466" text-anchor="middle" style="font-size:14px;fill:#1f2328">On chip</text>
  <line x1="30" y1="1530" x2="330" y2="1530" stroke="#54aeff" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="95" y="1581" text-anchor="middle" style="font-size:14px;fill:#1f2328">Off chip</text>
  <line x1="30" y1="1622" x2="330" y2="1622" stroke="#54aeff" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="95" y="1650" text-anchor="middle" style="font-size:14px;fill:#1f2328">Devices</text>
  <text x="340" y="1694" class="tag">First write to a page (page fault) ≈ 1.5 µs: measured in #5 (Windows). The rest are typical x86 (Zen 3) magnitudes, not measurements.</text>
  <text x="20" y="1748" class="s">Updated as the series goes on: new hardware layers get labels when a post covers them.</text>
</svg>
