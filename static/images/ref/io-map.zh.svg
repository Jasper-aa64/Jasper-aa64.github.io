<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .s  { font-size: 12px; fill: #57606a; }
      .h  { font-size: 17px; font-weight: 700; fill: #1f2328; }
      .tag{ font-size: 12px; fill: #0969da; }
      .lab{ font-size: 11.5px; fill: #57606a; }
      .labc{ font-size: 11.5px; fill: #bc4c00; }
      .labd{ font-size: 11.5px; fill: #0969da; }
      .labm{ font-size: 11.5px; fill: #1a7f37; }
      .lane-h { font-size: 13px; font-weight: 700; }
      .user { fill: #eefbf1; stroke: #1a7f37; stroke-width: 1.3; }
      .file { fill: #fbefff; stroke: #c297ff; stroke-width: 1.2; }
      .net  { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.2; }
      .dev  { fill: #ffebe9; stroke: #ff8182; stroke-width: 1.2; }
      .note { fill: #fbfbfc; stroke: #8c959f; stroke-width: 1; }
      .ctl { stroke: #555; stroke-width: 1.5; fill: none; }
      .cpu { stroke: #bc4c00; stroke-width: 2; fill: none; }
      .dma { stroke: #0969da; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
      .map { stroke: #1a7f37; stroke-width: 2; fill: none; stroke-dasharray: 3 3; }
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="1150" fill="#ffffff"/>
  <text x="20" y="38" class="h" style="font-size:23px">IO 地图：数据怎么在设备、内核和你的缓冲区之间走</text>
  <text x="20" y="62" class="s">上面是用户态，中间是内核，下面是设备和内存。左边一列是文件，中间一列是网络。数字都是量级。</text>
  <text x="20" y="82" class="s">橙线 = CPU 拷贝；蓝色虚线 = DMA（设备直接读写内存，不占 CPU）；绿色虚线 = 映射，不拷贝；灰线 = 调用或通知。</text>
  <text x="20" y="102" class="s">蓝字 = 在哪里讲过，进程地图、硬件地图会打开对应的那张图。</text>
  <rect x="20" y="112" width="1560" height="230" rx="10" fill="#f6fbf7" stroke="#4ac26b" stroke-dasharray="6 4"/>
  <text x="32" y="134" class="lane-h" style="fill:#1a7f37">用户态：你的进程</text>
  <path d="M20,356 L1580,356" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
  <text x="1576" y="351" class="lab" text-anchor="end">系统调用：同一个线程切到内核态，一次来回约 100 ns 到几百 ns</text>
  <rect x="20" y="364" width="1560" height="478" rx="10" fill="#fbfbfc" stroke="#1f2328" stroke-width="2"/>
  <text x="32" y="383" class="lane-h" style="fill:#1f2328">内核态</text>
  <rect x="20" y="900" width="1560" height="190" rx="10" fill="#fff8f7" stroke="#ff8182" stroke-dasharray="6 4"/>
  <text x="32" y="922" class="lane-h" style="fill:#cf222e">设备和内存</text>
  <g id="app">
  <rect x="40" y="150" width="300" height="150" rx="6" class="user"/>
  <text x="52" y="174" class="t">你的进程</text>
  <text x="52" y="192" class="s" style="white-space:pre">read / write：读写文件</text>
  <text x="52" y="210" class="s" style="white-space:pre">send / recv：收发网络数据</text>
  <text x="52" y="228" class="s" style="white-space:pre">mmap：把文件映射进地址空间</text>
  <text x="52" y="246" class="s" style="white-space:pre">每一个都是一次系统调用</text>
  <text x="52" y="264" class="tag"><a href="/maps/process-map.zh.html" target="_blank" rel="noopener"><tspan>进程地图</tspan></a></text>
  </g>
  <g id="ubuf">
  <rect x="370" y="150" width="270" height="150" rx="6" class="user"/>
  <text x="382" y="174" class="t">用户缓冲区 buf</text>
  <text x="382" y="192" class="s" style="white-space:pre">你自己分配的内存：栈上、堆上</text>
  <text x="382" y="210" class="s" style="white-space:pre">read / recv：内核把数据拷进来</text>
  <text x="382" y="228" class="s" style="white-space:pre">write / send：内核从这里拷走</text>
  <text x="382" y="246" class="tag"><a href="/maps/process-map.zh.html" target="_blank" rel="noopener"><tspan>进程地图：栈、堆</tspan></a></text>
  </g>
  <g id="umap">
  <rect x="670" y="150" width="270" height="150" rx="6" class="user"/>
  <text x="682" y="174" class="t">mmap 映射区</text>
  <text x="682" y="192" class="s" style="white-space:pre">页缓存里的页直接映射进来</text>
  <text x="682" y="210" class="s" style="white-space:pre">读写就是普通的访存，不拷贝</text>
  <text x="682" y="228" class="s" style="white-space:pre">第一次碰一页要缺页</text>
  <text x="682" y="246" class="tag"><a href="/maps/process-map.zh.html" target="_blank" rel="noopener"><tspan>进程地图：mmap 区</tspan></a></text>
  </g>
  <g id="models">
  <rect x="980" y="140" width="580" height="180" rx="6" class="note"/>
  <text x="992" y="164" class="t">IO 模型：等数据的时候，线程在干什么</text>
  <text x="992" y="182" class="s" style="white-space:pre">阻塞：数据没好，线程睡在 read / recv 里</text>
  <text x="992" y="200" class="s" style="white-space:pre">非阻塞：数据没好，立刻返回 EAGAIN，过会儿再试</text>
  <text x="992" y="218" class="s" style="white-space:pre">IO 多路复用（select / poll / epoll）：一个线程等很多 fd，读还是自己读</text>
  <text x="992" y="236" class="s" style="white-space:pre">异步（io_uring）：把“读到 buf 里”交给内核，读完了再通知你</text>
  <text x="992" y="254" class="s" style="white-space:pre">前三种都是同步 IO：把数据拷进 buf 这一步，是你的线程在等</text>
  <text x="992" y="272" class="tag"><a href="/zh/ref/epoll-internals/" target="_blank" rel="noopener"><tspan>epoll：红黑树、就绪链表和回调</tspan></a></text>
  </g>
  <g id="vfs">
  <rect x="40" y="390" width="300" height="110" rx="6" class="file"/>
  <text x="52" y="414" class="t">VFS（虚拟文件系统）</text>
  <text x="52" y="432" class="s" style="white-space:pre">按 fd 找到打开的文件</text>
  <text x="52" y="450" class="s" style="white-space:pre">再交给具体的文件系统（ext4、xfs……）</text>
  </g>
  <g id="pcache">
  <rect x="40" y="530" width="300" height="150" rx="6" class="file"/>
  <text x="52" y="554" class="t">页缓存（page cache）</text>
  <text x="52" y="572" class="s" style="white-space:pre">读过、写过的文件内容，按页缓存在内存里</text>
  <text x="52" y="590" class="s" style="white-space:pre">read 命中就直接拷，不碰磁盘</text>
  <text x="52" y="608" class="s" style="white-space:pre">write 写到这里、标成脏页就返回</text>
  <text x="52" y="626" class="s" style="white-space:pre">free 命令里的 buff/cache 主要就是它</text>
  </g>
  <g id="flush">
  <rect x="370" y="710" width="250" height="110" rx="6" class="file"/>
  <text x="382" y="734" class="t">回写线程（writeback）</text>
  <text x="382" y="752" class="s" style="white-space:pre">脏页过一会写回磁盘</text>
  <text x="382" y="770" class="s" style="white-space:pre">默认脏了约 30 s 必写，每 5 s 查一次</text>
  <text x="382" y="788" class="s" style="white-space:pre">fsync：等这个文件写完才返回</text>
  </g>
  <g id="blk">
  <rect x="40" y="710" width="300" height="110" rx="6" class="file"/>
  <text x="52" y="734" class="t">块设备层 + 磁盘驱动</text>
  <text x="52" y="752" class="s" style="white-space:pre">把要读写的页组成请求，排队、合并</text>
  <text x="52" y="770" class="s" style="white-space:pre">交给 NVMe 驱动，发给磁盘</text>
  </g>
  <g id="sock">
  <rect x="670" y="390" width="300" height="150" rx="6" class="net"/>
  <text x="682" y="414" class="t">socket 缓冲区</text>
  <text x="682" y="432" class="s" style="white-space:pre">接收缓冲：收到了、还没被 recv 的数据</text>
  <text x="682" y="450" class="s" style="white-space:pre">发送缓冲：send 拷进来、对方还没确认的</text>
  <text x="682" y="468" class="s" style="white-space:pre">满了：send 阻塞，或返回 EAGAIN</text>
  </g>
  <g id="epollk">
  <rect x="1010" y="390" width="550" height="150" rx="6" class="net"/>
  <text x="1022" y="414" class="t">epoll：就绪通知</text>
  <text x="1022" y="432" class="s" style="white-space:pre">socket 收到数据，回调把它挂上 epoll 的就绪链表，</text>
  <text x="1022" y="450" class="s" style="white-space:pre">再叫醒睡在 epoll_wait 里的线程</text>
  <text x="1022" y="468" class="s" style="white-space:pre">只通知“可以读了”，数据还得你自己 recv</text>
  <text x="1022" y="486" class="tag"><a href="/zh/ref/epoll-internals/" target="_blank" rel="noopener"><tspan>epoll：红黑树、就绪链表和回调</tspan></a></text>
  </g>
  <g id="tcp">
  <rect x="670" y="570" width="300" height="110" rx="6" class="net"/>
  <text x="682" y="594" class="t">TCP/IP 协议栈</text>
  <text x="682" y="612" class="s" style="white-space:pre">收：校验、去包头，按 IP 和端口找到 socket</text>
  <text x="682" y="630" class="s" style="white-space:pre">发：分段、等确认、丢了重传</text>
  </g>
  <g id="drv">
  <rect x="670" y="710" width="300" height="110" rx="6" class="net"/>
  <text x="682" y="734" class="t">网卡驱动 + 收发环</text>
  <text x="682" y="752" class="s" style="white-space:pre">收：软中断（NAPI）一次取一批包</text>
  <text x="682" y="770" class="s" style="white-space:pre">发：把包挂到发送环，通知网卡</text>
  </g>
  <g id="zc">
  <rect x="1010" y="570" width="550" height="250" rx="6" class="note"/>
  <text x="1022" y="594" class="t">零拷贝：把文件发到网络上</text>
  <text x="1022" y="612" class="s" style="white-space:pre">read + write：</text>
  <text x="1022" y="630" class="s" style="white-space:pre">  磁盘 → 页缓存（DMA）→ buf（CPU）→ socket 缓冲（CPU）→ 网卡（DMA）</text>
  <text x="1022" y="648" class="s" style="white-space:pre">  4 次拷贝，4 次用户态、内核态切换</text>
  <text x="1022" y="666" class="s" style="white-space:pre">mmap + write：页缓存直接映射进来，省掉拷进 buf 那一次</text>
  <text x="1022" y="684" class="s" style="white-space:pre">sendfile：数据不出内核，页缓存 → 网卡</text>
  <text x="1022" y="702" class="s" style="white-space:pre">  网卡支持分散收集 DMA 时，CPU 一次都不拷，只剩 2 次 DMA、2 次切换</text>
  <text x="1022" y="720" class="s" style="white-space:pre">splice：在两个 fd 之间搬，中间经过一个管道，也不拷进用户态</text>
  </g>
  <g id="disk">
  <rect x="40" y="940" width="300" height="130" rx="6" class="dev"/>
  <text x="52" y="964" class="t">磁盘（NVMe SSD）</text>
  <text x="52" y="982" class="s" style="white-space:pre">一次随机读约 10–100 µs</text>
  <text x="52" y="1000" class="s" style="white-space:pre">机械硬盘要几 ms</text>
  <text x="52" y="1018" class="s" style="white-space:pre">做完用 DMA 写进内存，再发中断</text>
  <text x="52" y="1036" class="tag"><a href="/maps/hardware-map.zh.html" target="_blank" rel="noopener"><tspan>硬件地图：外部设备</tspan></a></text>
  </g>
  <g id="mem">
  <rect x="380" y="940" width="250" height="130" rx="6" class="dev"/>
  <text x="392" y="964" class="t">内存（DRAM）</text>
  <text x="392" y="982" class="s" style="white-space:pre">页缓存、socket 缓冲、收发环</text>
  <text x="392" y="1000" class="s" style="white-space:pre">其实都是内存里的页</text>
  <text x="392" y="1018" class="s" style="white-space:pre">DMA：设备直接读写内存，不占 CPU</text>
  <text x="392" y="1036" class="tag"><a href="/maps/hardware-map.zh.html#load" target="_blank" rel="noopener"><tspan>硬件地图：内存控制器 → 通道</tspan></a></text>
  </g>
  <g id="nic">
  <rect x="670" y="940" width="300" height="130" rx="6" class="dev"/>
  <text x="682" y="964" class="t">网卡（NIC）</text>
  <text x="682" y="982" class="s" style="white-space:pre">收：DMA 写进收包环，再发中断</text>
  <text x="682" y="1000" class="s" style="white-space:pre">发：DMA 从发送环读出来发走</text>
  <text x="682" y="1018" class="s" style="white-space:pre">同一机房往返约几十 µs</text>
  <text x="682" y="1036" class="tag"><a href="/maps/hardware-map.zh.html" target="_blank" rel="noopener"><tspan>硬件地图：网卡 → 中断 → 某个核</tspan></a></text>
  </g>
  <path d="M190,300 L190,388" class="ctl edge" id="e_app_vfs" marker-end="url(#arr)"/>
  <path d="M320,300 L320,330 L820,330 L820,388" class="ctl edge" id="e_app_sock" marker-end="url(#arr)"/>
  <path d="M190,500 L190,528" class="ctl edge" id="e_vfs_pc" marker-end="url(#arr)"/>
  <path d="M340,580 L420,580 L420,302" class="cpu edge" id="e_pc_ubuf" marker-end="url(#arrC)"/>
  <path d="M670,450 L560,450 L560,302" class="cpu edge" id="e_sock_ubuf" marker-end="url(#arrC)"/>
  <path d="M340,640 L650,640 L650,250 L668,250" class="map edge" id="e_pc_umap" marker-end="url(#arrM)"/>
  <path d="M190,680 L190,708" class="ctl edge" id="e_pc_blk" marker-end="url(#arr)"/>
  <path d="M320,680 L320,695 L470,695 L470,708" class="ctl edge" id="e_pc_flush" marker-end="url(#arr)"/>
  <path d="M370,770 L342,770" class="ctl edge" id="e_flush_blk" marker-end="url(#arr)"/>
  <path d="M190,820 L190,938" class="ctl edge" id="e_blk_disk" marker-end="url(#arr)"/>
  <path d="M340,1005 L378,1005" class="dma edge" id="e_disk_mem" marker-end="url(#arrD)"/>
  <path d="M670,1005 L632,1005" class="dma edge" id="e_nic_mem" marker-end="url(#arrD)"/>
  <path d="M820,938 L820,822" class="ctl edge" id="e_nic_drv" marker-end="url(#arr)"/>
  <path d="M820,708 L820,682" class="ctl edge" id="e_drv_tcp" marker-end="url(#arr)"/>
  <path d="M820,568 L820,542" class="ctl edge" id="e_tcp_sock" marker-end="url(#arr)"/>
  <path d="M970,465 L1008,465" class="ctl edge" id="e_sock_ep" marker-end="url(#arr)"/>
  <text x="198" y="352" class="lab" text-anchor="start">read / write</text>
  <text x="560" y="324" class="lab" text-anchor="start">send / recv</text>
  <text x="428" y="560" class="labc" text-anchor="start">CPU 拷贝</text>
  <text x="566" y="440" class="labc" text-anchor="start">CPU 拷贝</text>
  <text x="480" y="632" class="labm" text-anchor="start">映射，不拷贝</text>
  <text x="198" y="880" class="lab" text-anchor="start">读写请求</text>
  <text x="360" y="996" class="labd" text-anchor="middle">DMA</text>
  <text x="651" y="996" class="labd" text-anchor="middle">DMA</text>
  <text x="828" y="880" class="lab" text-anchor="start">中断</text>
  <text x="989" y="457" class="lab" text-anchor="middle">回调</text>
  <text x="198" y="518" class="lab" text-anchor="start">查</text>
  <text x="198" y="698" class="lab" text-anchor="start">没命中</text>
  <text x="20" y="1120" class="s">图随文章更新：讲到 io_uring、管道和信号时再往上补。</text>
</svg>
