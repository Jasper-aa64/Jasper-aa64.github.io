<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><style>.h{font-size:18px;font-weight:700;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.p{font-size:14px;font-weight:700;fill:#1f2328}.t{font-size:12.5px;font-weight:700;fill:#57606a}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#1f2328}.l{font-size:12.5px;fill:#1f2328}.lb{font-size:12.5px;font-weight:700;fill:#1f2328}.r{font-size:12px;font-weight:700;fill:#cf222e}.bw{font-size:12.5px;font-weight:700;fill:#ffffff}.m{font-size:14px;letter-spacing:2px;fill:#1f2328}.g{font-size:12.5px;fill:#1a7f37}</style></defs>
<rect x="0" y="0" width="1100" height="480" fill="#ffffff"/>
<text class="h" x="20" y="32">两个线程各自先写、再读对方：release / acquire 管不住，seq_cst 管得住</text>
<text class="s" x="20" y="54">初始 x = y = 0。灰色箭头：同一线程里代码的先后（竖边）。</text>

<!-- 左 -->
<rect x="20" y="70" width="520" height="395" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="p" x="40" y="96">release / acquire：两边都可能读到 0</text>
<text class="t" x="40" y="126">线程 1</text>
<text class="t" x="310" y="126">线程 2</text>
<rect x="40" y="140" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="50" y="158">① x.store(1, release);</text>
<text class="r" x="46" y="186">还在 store buffer 里</text>
<rect x="40" y="220" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="50" y="238">② r1 = y.load(acquire);</text>
<text class="r" x="46" y="266">先读完了：0</text>
<rect x="310" y="140" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="320" y="158">③ y.store(1, release);</text>
<text class="r" x="316" y="186">还在 store buffer 里</text>
<rect x="310" y="220" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="320" y="238">④ r2 = x.load(acquire);</text>
<text class="r" x="316" y="266">先读完了：0</text>
<line x1="228" y1="166" x2="228" y2="217" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="498" y1="166" x2="498" y2="217" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<text class="lb" x="40" y="306">竖边 ① → ② 只对线程 1 算数。</text>
<text class="l" x="40" y="330">线程 2 要看到 ①，得从 ① 沿边走到 ④：</text>
<text class="l" x="40" y="352">走到 ② 就断了，② 是读，读发不出横边。</text>
<text class="l" x="40" y="374">③ → ④ 同理。两边的读都可以先于对方的写，</text>
<text class="l" x="40" y="396">都读到 0。</text>
<rect x="40" y="420" width="230" height="28" rx="14" fill="#cf222e"/>
<text class="bw" x="155" y="439" text-anchor="middle">r1 == 0 且 r2 == 0：可能</text>

<!-- 右 -->
<rect x="560" y="70" width="520" height="395" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="p" x="580" y="96">seq_cst：线程里的先后对所有线程都成立</text>
<text class="t" x="580" y="126">线程 1</text>
<text class="t" x="850" y="126">线程 2</text>
<rect x="580" y="140" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="590" y="158">① x.store(1, seq_cst);</text>
<rect x="580" y="220" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="590" y="238">② r1 = y.load(seq_cst);</text>
<rect x="850" y="140" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="860" y="158">③ y.store(1, seq_cst);</text>
<rect x="850" y="220" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="860" y="238">④ r2 = x.load(seq_cst);</text>
<line x1="685" y1="166" x2="685" y2="217" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="955" y1="166" x2="955" y2="217" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<text class="lb" x="580" y="284">① 先于 ② 生效，③ 先于 ④，交错只有 6 种：</text>
<text class="m" x="600" y="308">① ② ③ ④</text><text class="l" x="720" y="308">r1 = 0，r2 = 1</text>
<text class="m" x="600" y="326">① ③ ② ④</text><text class="l" x="720" y="326">r1 = 1，r2 = 1</text>
<text class="m" x="600" y="344">① ③ ④ ②</text><text class="l" x="720" y="344">r1 = 1，r2 = 1</text>
<text class="m" x="600" y="362">③ ① ② ④</text><text class="l" x="720" y="362">r1 = 1，r2 = 1</text>
<text class="m" x="600" y="380">③ ① ④ ②</text><text class="l" x="720" y="380">r1 = 1，r2 = 1</text>
<text class="m" x="600" y="398">③ ④ ① ②</text><text class="l" x="720" y="398">r1 = 1，r2 = 0</text>
<rect x="580" y="420" width="230" height="28" rx="14" fill="#1a7f37"/>
<text class="bw" x="695" y="439" text-anchor="middle">没有一种是两个 0：不可能</text>
<text class="s" x="824" y="432">x86 上写编成 xchg，</text>
<text class="s" x="824" y="450">要等 store buffer 排空</text>
</svg>
