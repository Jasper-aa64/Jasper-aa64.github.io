<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker><style>.h{font-size:18px;font-weight:700;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.p{font-size:14px;font-weight:700;fill:#1f2328}.t{font-size:12.5px;font-weight:700;fill:#57606a}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#1f2328}.l{font-size:12.5px;fill:#1f2328}.lb{font-size:12.5px;font-weight:700;fill:#1f2328}.r{font-size:12px;font-weight:700;fill:#cf222e}.o{font-size:12.5px;font-weight:700;fill:#bc4c00}.bw{font-size:12.5px;font-weight:700;fill:#ffffff}</style></defs>
<rect x="0" y="0" width="1100" height="470" fill="#ffffff"/>
<text class="h" x="20" y="32">两个线程各自先写、再读对方：release / acquire 管不住，seq_cst 管得住</text>
<text class="s" x="20" y="54">初始 x = y = 0。灰色箭头：同一线程里代码的先后。</text>

<!-- 左 -->
<rect x="20" y="70" width="520" height="380" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="p" x="40" y="96">release / acquire：两边都可能读到 0</text>
<text class="t" x="40" y="126">线程 1</text>
<text class="t" x="310" y="126">线程 2</text>
<rect x="40" y="140" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="50" y="158">① x.store(1, release);</text>
<text class="r" x="46" y="186">还在 store buffer 里</text>
<rect x="40" y="220" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="50" y="238">② r1 = y.load(acquire);</text>
<text class="r" x="46" y="266">先走了，读到 0</text>
<rect x="310" y="140" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="320" y="158">③ y.store(1, release);</text>
<text class="r" x="316" y="186">还在 store buffer 里</text>
<rect x="310" y="220" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="320" y="238">④ r2 = x.load(acquire);</text>
<text class="r" x="316" y="266">先走了，读到 0</text>
<line x1="228" y1="166" x2="228" y2="217" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="498" y1="166" x2="498" y2="217" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<text class="lb" x="40" y="306">release 只管它前面的，acquire 只管它后面的。</text>
<text class="l" x="40" y="330">“写在前、读在后”这一对，两条都不管，</text>
<text class="l" x="40" y="352">读就可以先于写生效：② 读 y 时 ③ 还没被看见，</text>
<text class="l" x="40" y="374">④ 读 x 时 ① 还没被看见。两边都读到 0。</text>
<rect x="40" y="404" width="230" height="28" rx="14" fill="#cf222e"/>
<text class="bw" x="155" y="423" text-anchor="middle">r1 == 0 且 r2 == 0：可能</text>

<!-- 右 -->
<rect x="560" y="70" width="520" height="380" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="p" x="580" y="96">seq_cst：先写后读也不许乱</text>
<text class="t" x="580" y="126">线程 1</text>
<text class="t" x="850" y="126">线程 2</text>
<rect x="580" y="140" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="590" y="158">① x.store(1, seq_cst);</text>
<rect x="580" y="220" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="590" y="238">② r1 = y.load(seq_cst);</text>
<rect x="850" y="140" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="860" y="158">③ y.store(1, seq_cst);</text>
<rect x="850" y="220" width="210" height="26" rx="5" fill="#ffffff" stroke="#d0d7de"/>
<text class="c" x="860" y="238">④ r2 = x.load(seq_cst);</text>
<line x1="685" y1="166" x2="685" y2="217" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="955" y1="166" x2="955" y2="217" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="790" y1="153" x2="848" y2="230" stroke="#bc4c00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ao)"/>
<line x1="850" y1="153" x2="792" y2="230" stroke="#bc4c00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ao)"/>
<text class="o" x="796" y="182">A</text>
<text class="o" x="836" y="182">B</text>
<text class="lb" x="580" y="306">所有 seq_cst 操作排成一个所有线程都认的顺序，</text>
<text class="l" x="580" y="330">同一线程里的先后在这个顺序里不能反。</text>
<text class="l" x="580" y="352">排最早的一定是 ① 或 ③：① 最早，④ 在它后面，读到 1（A）；</text>
<text class="l" x="580" y="374">③ 最早，② 在它后面，读到 1（B）。至少一边读到 1。</text>
<rect x="580" y="404" width="230" height="28" rx="14" fill="#1a7f37"/>
<text class="bw" x="695" y="423" text-anchor="middle">r1 == 0 且 r2 == 0：不可能</text>
<text class="s" x="824" y="416">x86 上写编成 xchg，</text>
<text class="s" x="824" y="434">要等 store buffer 排空</text>
</svg>
