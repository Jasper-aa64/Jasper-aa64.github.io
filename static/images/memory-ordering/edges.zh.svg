<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 384" width="1100" height="384" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><style>.h{font-size:18px;font-weight:700;fill:#1f2328}.s{font-size:12.5px;fill:#57606a}.p{font-size:14px;font-weight:700;fill:#1f2328}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#1f2328}.n{font-size:12px;fill:#57606a}.bw{font-size:12px;font-weight:700;fill:#ffffff}.l{font-size:12.5px;fill:#1f2328}.lb{font-size:12.5px;font-weight:700;fill:#1f2328}</style></defs>
<rect x="0" y="0" width="1100" height="384" fill="#ffffff"/>
<text class="h" x="20" y="32">把两边的代码并排放，连 release 到 acquire 的边</text>
<text class="s" x="20" y="54">内存池的 deallocate 和 allocate（代码有删减）。蓝色是横边，灰色是竖边；一处跨线程的读写，从对方的写沿着边走得到，才看得到。</text>
<rect x="20" y="68" width="500" height="296" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="p" x="36" y="92">线程 A：deallocate（发布的一方）</text>
<rect x="580" y="68" width="500" height="296" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="p" x="596" y="92">线程 B：allocate（接收的一方）</text>
<rect x="44" y="258" width="330" height="22" rx="5" fill="#ddf4ff" stroke="#2a78d6"/>
<rect x="604" y="102" width="330" height="22" rx="5" fill="#ddf4ff" stroke="#2a78d6"/>
<rect x="604" y="284" width="330" height="22" rx="5" fill="#ddf4ff" stroke="#2a78d6"/>
<text class="c" x="50.0" y="118">obj-&gt;~T();</text>
<text class="c" x="50.0" y="144">old = head_.load(relaxed);</text>
<text class="c" x="50.0" y="170">for (;;) {</text>
<text class="c" x="65.1" y="196">slot-&gt;next.store(idx_of(old), relaxed);</text>
<text class="c" x="65.1" y="222">desired = pack(ver(old) + 1, idx);</text>
<text class="c" x="65.1" y="248">if (head_.CAS(old, desired,</text>
<text class="c" x="110.4" y="274">release,     // 成功</text>
<text class="c" x="110.4" y="300">relaxed))    // 失败</text>
<text class="c" x="80.2" y="326">return;</text>
<text class="c" x="50.0" y="352">}</text>
<text class="c" x="610.0" y="118">old = head_.load(acquire);</text>
<text class="c" x="610.0" y="144">for (;;) {</text>
<text class="c" x="625.1" y="170">idx = low32(old);</text>
<text class="c" x="625.1" y="196">next = slots_[idx].next.load(relaxed);</text>
<text class="c" x="625.1" y="222">desired = pack(ver(old) + 1, next);</text>
<text class="c" x="625.1" y="248">if (head_.CAS(old, desired,</text>
<text class="c" x="670.4" y="274">acquire,     // 成功</text>
<text class="c" x="670.4" y="300">acquire))    // 失败</text>
<text class="c" x="640.2" y="326">return new (slots_[idx].storage) T(...);</text>
<text class="c" x="610.0" y="352">}</text>
<rect x="404" y="103" width="100" height="20" rx="10" fill="#bc4c00"/>
<text class="bw" x="454" y="117" text-anchor="middle">写 ① 槽里的字节</text>
<rect x="404" y="181" width="100" height="20" rx="10" fill="#bc4c00"/>
<text class="bw" x="454" y="195" text-anchor="middle">写 ② next</text>
<rect x="960" y="181" width="100" height="20" rx="10" fill="#bc4c00"/>
<text class="bw" x="1010" y="195" text-anchor="middle">读 ② next</text>
<rect x="960" y="311" width="110" height="20" rx="10" fill="#bc4c00"/>
<text class="bw" x="1015" y="325" text-anchor="middle">写在 ① 的字节上</text>
<text class="n" x="262" y="144">没有边通到：old 只当一个数用</text>
<text class="n" x="262" y="300">没有边通到：新的 old 也只当数用</text>
<text class="n" x="960" y="300">失败：回到循环开头</text>
<line x1="34" y1="112" x2="34" y2="270" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<line x1="594" y1="116" x2="594" y2="322" stroke="#57606a" stroke-width="2" marker-end="url(#ag)"/>
<path d="M374,269 H520 C556,269 548,113 588,113" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ab)"/>
<path d="M520,269 C556,269 552,295 588,295" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#ab)"/>
</svg>
