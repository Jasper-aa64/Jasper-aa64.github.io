<text class="bs" x="60.0" y="98" text-anchor="middle">交易所</text>
<text class="s" x="60.0" y="118" text-anchor="middle">发行情</text>
<rect x="114" y="62" width="60" height="80" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
<text class="bs" x="144.0" y="107" text-anchor="middle">交换机</text>
<rect x="188" y="62" width="50" height="80" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
<text class="bs" x="213.0" y="107" text-anchor="middle">网卡</text>
<rect x="252" y="62" width="60" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text class="bs" x="282.0" y="98" text-anchor="middle">内核</text>
<text class="s" x="282.0" y="118" text-anchor="middle">或旁路</text>
<rect x="326" y="62" width="116" height="80" rx="8" fill="#eaf5ff" stroke="#0969da" stroke-width="1.5"/>
<text class="b" x="384.0" y="86" text-anchor="middle">行情线程</text>
<text class="t" x="384.0" y="110" text-anchor="middle">T7 读 UDP</text>
<text class="t" x="384.0" y="129" text-anchor="middle">T8 写队列</text>
<rect x="478" y="62" width="116" height="80" rx="8" fill="#eaf5ff" stroke="#0969da" stroke-width="1.5"/>
<text class="b" x="536.0" y="86" text-anchor="middle">交易引擎</text>
<text class="t" x="536.0" y="110" text-anchor="middle">T9 读队列</text>
<text class="t" x="536.0" y="129" text-anchor="middle">T10 写队列</text>
<rect x="630" y="62" width="116" height="80" rx="8" fill="#eaf5ff" stroke="#0969da" stroke-width="1.5"/>
<text class="b" x="688.0" y="86" text-anchor="middle">订单网关</text>
<text class="t" x="688.0" y="110" text-anchor="middle">T11 读队列</text>
<text class="t" x="688.0" y="129" text-anchor="middle">T12 写 TCP</text>
<rect x="760" y="62" width="60" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text class="bs" x="790.0" y="107" text-anchor="middle">内核</text>
<rect x="834" y="62" width="50" height="80" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
<text class="bs" x="859.0" y="107" text-anchor="middle">网卡</text>
<rect x="898" y="62" width="60" height="80" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
<text class="bs" x="928.0" y="107" text-anchor="middle">交换机</text>
<rect x="972" y="62" width="100" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text class="bs" x="1022.0" y="98" text-anchor="middle">交易所</text>
<text class="s" x="1022.0" y="118" text-anchor="middle">撮合、回报</text>
<line x1="101" y1="102.0" x2="112" y2="102.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="175" y1="102.0" x2="186" y2="102.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="239" y1="102.0" x2="250" y2="102.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="313" y1="102.0" x2="324" y2="102.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="443" y1="102.0" x2="476" y2="102.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="q" x="460.0" y="94.0" text-anchor="middle">队列</text>
<line x1="595" y1="102.0" x2="628" y2="102.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="q" x="612.0" y="94.0" text-anchor="middle">队列</text>
<line x1="747" y1="102.0" x2="758" y2="102.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="821" y1="102.0" x2="832" y2="102.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="885" y1="102.0" x2="896" y2="102.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="959" y1="102.0" x2="970" y2="102.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="rh" x="20" y="178">① 函数耗时 · TSC：一对打点包住一个函数 → 这个函数本身多久</text><text class="rd" x="20" y="196">组件内用；读一次 TSC 约 6–12 ns；看不到函数之间、线程之间的时间</text>
<line x1="340" y1="220" x2="376" y2="220" stroke="#0969da" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="340" cy="220" r="4.5" fill="#0969da"/>
<circle cx="376" cy="220" r="4.5" fill="#0969da"/>
<line x1="392" y1="220" x2="428" y2="220" stroke="#0969da" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="392" cy="220" r="4.5" fill="#0969da"/>
<circle cx="428" cy="220" r="4.5" fill="#0969da"/>
<line x1="492" y1="220" x2="528" y2="220" stroke="#0969da" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="492" cy="220" r="4.5" fill="#0969da"/>
<circle cx="528" cy="220" r="4.5" fill="#0969da"/>
<line x1="544" y1="220" x2="580" y2="220" stroke="#0969da" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="544" cy="220" r="4.5" fill="#0969da"/>
<circle cx="580" cy="220" r="4.5" fill="#0969da"/>
<line x1="644" y1="220" x2="680" y2="220" stroke="#0969da" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="644" cy="220" r="4.5" fill="#0969da"/>
<circle cx="680" cy="220" r="4.5" fill="#0969da"/>
<line x1="696" y1="220" x2="732" y2="220" stroke="#0969da" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="696" cy="220" r="4.5" fill="#0969da"/>
<circle cx="732" cy="220" r="4.5" fill="#0969da"/>
<text class="rh" x="20" y="262">② 线程边界 · TSC：T7–T12 各读一次 → 软件 TTT，以及处理、排队各段</text><text class="rd" x="20" y="280">同一台机器上跨核可以直接减；网卡和内核那两段不在里面</text>
<line x1="348" y1="304" x2="420" y2="304" stroke="#0969da" stroke-width="3" stroke-linecap="round"/>
<line x1="420" y1="304" x2="500" y2="304" stroke="#bc4c00" stroke-width="3" stroke-linecap="round"/>
<line x1="500" y1="304" x2="572" y2="304" stroke="#0969da" stroke-width="3" stroke-linecap="round"/>
<line x1="572" y1="304" x2="652" y2="304" stroke="#bc4c00" stroke-width="3" stroke-linecap="round"/>
<line x1="652" y1="304" x2="724" y2="304" stroke="#0969da" stroke-width="3" stroke-linecap="round"/>
<circle cx="348" cy="304" r="4.5" fill="#1f2328"/>
<text class="tl" x="348" y="321" text-anchor="middle">T7</text>
<circle cx="420" cy="304" r="4.5" fill="#1f2328"/>
<text class="tl" x="420" y="321" text-anchor="middle">T8</text>
<circle cx="500" cy="304" r="4.5" fill="#1f2328"/>
<text class="tl" x="500" y="321" text-anchor="middle">T9</text>
<circle cx="572" cy="304" r="4.5" fill="#1f2328"/>
<text class="tl" x="572" y="321" text-anchor="middle">T10</text>
<circle cx="652" cy="304" r="4.5" fill="#1f2328"/>
<text class="tl" x="652" y="321" text-anchor="middle">T11</text>
<circle cx="724" cy="304" r="4.5" fill="#1f2328"/>
<text class="tl" x="724" y="321" text-anchor="middle">T12</text>
<line x1="776" y1="304" x2="798" y2="304" stroke="#0969da" stroke-width="3" stroke-linecap="round"/>
<text class="lb" x="804" y="308" fill="#0969da">处理</text>
<line x1="840" y1="304" x2="862" y2="304" stroke="#bc4c00" stroke-width="3" stroke-linecap="round"/>
<text class="lb" x="868" y="308" fill="#bc4c00">排队</text>
<text class="rh" x="20" y="346">③ 网卡硬件时间戳 · 网卡上的时钟（PTP 对时）：收包、发包时由网卡自己打 → 线上 TTT、RTT</text><text class="rd" x="20" y="364">两头都是网卡的时钟，直接相减；要和 T7 比（量内核那段），得先把网卡时钟和系统时钟对上</text>
<line x1="213.0" y1="388" x2="859.0" y2="388" stroke="#9a6700" stroke-width="3" stroke-linecap="round"/>
<circle cx="213.0" cy="388" r="4.5" fill="#9a6700"/>
<path d="M859.0 388 L1042.0 388 L1042.0 400 L871.0 400" fill="none" stroke="#cf222e" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="859.0" cy="388" r="4.5" fill="#9a6700"/>
<circle cx="859.0" cy="400" r="4.5" fill="#9a6700"/>
<text class="lb" x="1048.0" y="398" fill="#cf222e">RTT</text>
<text class="rh" x="20" y="430">④ 交换机镜像 + 抓包设备 · 设备自己的时钟（PTP / GPS 对时）：进出的包各复制一份给它 → 线上 TTT、RTT</text><text class="rd" x="20" y="448">在服务器外面，不占服务器的 CPU；只看得到包，要按行情序号、订单号配对</text>
<line x1="144.0" y1="472" x2="928.0" y2="472" stroke="#8250df" stroke-width="3" stroke-linecap="round"/>
<circle cx="144.0" cy="472" r="4.5" fill="#8250df"/>
<path d="M928.0 472 L1042.0 472 L1042.0 484 L940.0 484" fill="none" stroke="#cf222e" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="928.0" cy="472" r="4.5" fill="#8250df"/>
<circle cx="928.0" cy="484" r="4.5" fill="#8250df"/>
<text class="lb" x="1048.0" y="482" fill="#cf222e">RTT</text>
<text class="rh" x="20" y="514">⑤ 交易所时间戳 · 两套对到 UTC 的时钟：交易所打发出时间，自己打收到时间 → 交易所到我们这一段</text><text class="rd" x="20" y="532">误差是两边对时误差之和，约 20 ns–1 µs；有的交易所时间戳只到 ms；交易所内部（T1–T6）量不到</text>
<line x1="60.0" y1="556" x2="213.0" y2="556" stroke="#1a7f37" stroke-width="3" stroke-linecap="round"/>
<circle cx="60.0" cy="556" r="4.5" fill="#1a7f37"/>
<circle cx="213.0" cy="556" r="4.5" fill="#1a7f37"/>
<text class="ft" x="20" y="604">同一个时钟上的两个点才能直接相减，不同时钟要先对时（PTP 做的就是这件事）。量到的差值都送进直方图，再读分位数（1.2）。</text>
</svg>
