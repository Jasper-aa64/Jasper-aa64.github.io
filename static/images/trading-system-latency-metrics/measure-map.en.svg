<text class="h" x="20" y="36">What measures which leg: a dot is where a time is read, a line is the leg two dots subtract to</text>
<rect x="20" y="62" width="80" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text class="bs" x="60.0" y="98" text-anchor="middle">Exchange</text>
<text class="s" x="60.0" y="118" text-anchor="middle">sends data</text>
<rect x="114" y="62" width="60" height="80" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
<text class="bs" x="144.0" y="107" text-anchor="middle">Switch</text>
<rect x="188" y="62" width="50" height="80" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
<text class="bs" x="213.0" y="107" text-anchor="middle">NIC</text>
<rect x="252" y="62" width="60" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text class="bs" x="282.0" y="98" text-anchor="middle">Kernel</text>
<text class="s" x="282.0" y="118" text-anchor="middle">or bypass</text>
<rect x="326" y="62" width="116" height="80" rx="8" fill="#eaf5ff" stroke="#0969da" stroke-width="1.5"/>
<text class="b" x="384.0" y="86" text-anchor="middle">Market data</text>
<text class="t" x="384.0" y="110" text-anchor="middle">T7 UDP read</text>
<text class="t" x="384.0" y="129" text-anchor="middle">T8 queue write</text>
<rect x="478" y="62" width="116" height="80" rx="8" fill="#eaf5ff" stroke="#0969da" stroke-width="1.5"/>
<text class="b" x="536.0" y="86" text-anchor="middle">Trade engine</text>
<text class="t" x="536.0" y="110" text-anchor="middle">T9 queue read</text>
<text class="t" x="536.0" y="129" text-anchor="middle">T10 queue write</text>
<rect x="630" y="62" width="116" height="80" rx="8" fill="#eaf5ff" stroke="#0969da" stroke-width="1.5"/>
<text class="b" x="688.0" y="86" text-anchor="middle">Order gateway</text>
<text class="t" x="688.0" y="110" text-anchor="middle">T11 queue read</text>
<text class="t" x="688.0" y="129" text-anchor="middle">T12 TCP write</text>
<rect x="760" y="62" width="60" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text class="bs" x="790.0" y="107" text-anchor="middle">Kernel</text>
<rect x="834" y="62" width="50" height="80" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
<text class="bs" x="859.0" y="107" text-anchor="middle">NIC</text>
<rect x="898" y="62" width="60" height="80" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
<text class="bs" x="928.0" y="107" text-anchor="middle">Switch</text>
<rect x="972" y="62" width="100" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text class="bs" x="1022.0" y="98" text-anchor="middle">Exchange</text>
<text class="s" x="1022.0" y="118" text-anchor="middle">match, reply</text>
